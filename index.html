1:[
 {t:'Vida saudável',h:`<p>A matéria tem seis partes:</p><ul class="dots"><li>Estilos de vida saudável</li><li>A importância da alimentação</li><li>A importância da hidratação e do arrefecimento do organismo</li><li>A importância do repouso</li><li>A importância da higiene</li><li>A importância do meio ambiente</li></ul>`},
 {t:'O que é um estilo de vida?',h:`<p>Refere-se a um conjunto de <b>aspetos comportamentais</b>, tais como: padrões de consumo, rotinas, hábitos ou forma de vida adaptada ao dia a dia.</p><div class="formula">A atividade física é um dos pilares de um bom estilo de vida.</div><p><b>Exemplos de um bom estilo de vida:</b></p><ul class="dots"><li>a atividade física;</li><li>a alimentação;</li><li>a hidratação;</li><li>o repouso;</li><li>o controlo do stress;</li><li>o meio ambiente.</li></ul>`},
 {t:'Fatores que influenciam o estilo de vida',h:`<div class="box b3"><b>Controláveis</b><p><b>Alimentação saudável:</b> os hábitos alimentares podem estimular ou não o desenvolvimento de doenças, por exemplo a obesidade.</p><p><b>Atividade física:</b> atividades simples como caminhar, se realizadas com regularidade e intensidade suficientes, podem melhorar a nossa saúde.</p></div><div class="box b1"><b>Não controláveis</b><p><b>Genética:</b> influencia a aparência física, na medida em que herdamos os genes dos progenitores; pode expressar-se, por exemplo, na altura.</p><p><b>Puberdade:</b> são produzidas em maiores concentrações as hormonas sexuais masculinas e femininas, que fazem o corpo mudar de aparência.</p></div>`},
],
2:[
 {t:'Crianças e jovens: pelo menos 60 minutos por dia',h:`<div class="formula">Fazer alguma atividade física é muito melhor do que não fazer nenhuma.</div><ul class="dots"><li><b>Pelo menos 60 min por dia</b> de atividade física de intensidade <b>moderada a vigorosa</b> (preferencialmente aeróbia).</li><li><b>Pelo menos 3 dias por semana</b>: atividade aeróbia de intensidade <b>vigorosa</b> (também de fortalecimento muscular e ósseo).</li><li>Pode distribuir-se ao longo do dia: "todas as atividades devem <b>acelerar a respiração e aumentar a temperatura corporal</b>".</li></ul><p><b>Exemplos:</b> andar/correr, nadar, skate, saltar à corda, pedalar, dançar.</p><p><b>Contextos de prática:</b> Educação Física, Preparação Física, Desporto.</p>`},
 {t:'Benefícios da atividade física',h:`<ul class="ck"><li class="y">Promove a confiança e as competências sociais.</li><li class="y">Mantém a saúde e a condição física.</li><li class="y">Desenvolve a coordenação.</li><li class="y">Mantém um peso saudável.</li><li class="y">Melhora a concentração e a aprendizagem.</li><li class="y">Melhora o sono.</li><li class="y">Fortalece músculos e ossos.</li><li class="y">Estimula o bem-estar.</li></ul>`},
 {t:'Adultos: pelo menos 150 minutos por semana',h:`<p>Recomenda-se que os adultos acumulem pelo menos <b>150 minutos por semana</b> de atividade física <b>moderada</b>.</p><table class="st"><tr><th>Tempo de AF</th><th>Sinais</th></tr><tr><td>10 min por dia</td><td>Intensidade baixa: é melhor do que nada e já confere benefícios para a saúde.</td></tr><tr><td>150 min por semana de AF <b>moderada</b></td><td>Respiração acelerada, mas ainda permite manter uma conversa.</td></tr><tr><td>75 min por semana de AF <b>intensa</b></td><td>Respiração muito acelerada, sendo muito difícil manter uma conversa.</td></tr></table>`},
 {t:'Para a AF promover a saúde, é necessário…',h:`<ul class="dots"><li>Desenvolvimento das capacidades motoras</li><li>Composição corporal</li><li>Alimentação</li><li>Hidratação</li><li>Repouso</li><li>Higiene</li><li>Qualidade do meio ambiente</li><li>Afetividade</li></ul>`},
],
3:[
 {t:'Capacidades motoras',h:`<p><b>Capacidades motoras</b> são qualidades gerais do indivíduo, relacionadas com o seu desempenho numa diversidade de habilidades/tarefas. Referem-se à potencialidade individual para a execução de habilidades motoras.</p><p>Todos nascemos com um potencial para desenvolvermos a <b>força, a resistência, a velocidade e a flexibilidade</b>, algo que pode ser alcançado através do <b>treino</b>.</p>`},
 {t:'Capacidade vs. habilidade motora',h:`<div class="box b1"><b>Capacidade motora</b><p>Refere-se às qualidades físicas de uma pessoa: um potencial definido geneticamente que pode ser atingido ou não.</p></div><div class="box b2"><b>Habilidade motora</b><p>Refere-se a uma tarefa com uma finalidade específica a ser atingida.</p></div><div class="warn">Todos nascemos com uma determinada força ou resistência, mas precisamos de <b>aprender</b> a dançar ou a jogar basquetebol.</div>`},
 {t:'Condicionais e coordenativas',h:`<div class="box b3"><b>Capacidades condicionais</b><p>Dimensão <b>quantitativa</b> do movimento (ex.: metros, kg, n.º de passos…). Relacionadas com os processos de <b>obtenção de energia</b>.</p><div class="formula">Resistência · Força · Velocidade · Flexibilidade</div></div><div class="box b2"><b>Capacidades coordenativas</b><p>Dimensão <b>qualitativa</b> do movimento (ex.: satisfaz, bom, muito bom…). Relacionadas com o <b>controlo do movimento</b> e dependem do <b>sistema nervoso central</b>. Capacidade dos órgãos dos sentidos analisarem a informação sobre o meio.</p><div class="formula">Orientação · Equilíbrio · Ritmo · Reação · Coordenação</div></div>`},
 {t:'O período de desenvolvimento é diferente',h:`<p>O período de desenvolvimento de cada uma das capacidades é diferente:</p><div class="fig">${efPer()}</div><p class="note">Mais cedo: flexibilidade e velocidade. Mais tarde: força máxima e resistência anaeróbia. A resistência aeróbia tem o período mais longo.</p>`},
],
4:[
 {t:'O Índice de Massa Corporal (IMC)',h:`<p>O IMC é um indicador da <b>aptidão morfológica</b> e representa a relação entre o <b>peso</b> e a <b>altura</b> de uma pessoa. Permite determinar se o peso está adequado ou não à altura.</p><div class="formula">IMC = P / H²<br><span style="font-weight:400;font-size:13px">P – peso (quilogramas) · H – altura (metros)</span></div><div class="box"><b>Exemplo</b><p>O Manuel pesa 55 kg e mede 1,60 m.<br>IMC = 55 / 1,60² = 55 / 2,56 = <b>21,48</b></p></div>`},
 {t:'Composição corporal',h:`<p>A composição corporal quantifica os principais componentes do organismo humano: <b>ossos, músculos e gordura corporal</b>.</p><p>Possibilita compreender as modificações resultantes de alterações metabólicas e <b>identificar riscos de saúde</b>.</p><div class="fig">${FIGS.ef_cc}</div><p class="note">O IMC é igual, mas a massa gorda não: o IMC não distingue gordura de músculo.</p>`},
 {t:'Objetivos da avaliação da composição corporal',h:`<ul class="dots"><li>Identificar possíveis distúrbios de saúde associados a níveis baixos/elevados de gordura corporal;</li><li>Identificar possíveis distúrbios associados à acumulação regional de gordura;</li><li>Avaliar a eficácia de um programa de nutrição e/ou atividade física na alteração dos valores da CC;</li><li>Auxiliar na prescrição de exercício físico;</li><li>Monitorizar as alterações da composição corporal ao longo do crescimento.</li></ul>`},
 {t:'Peso saudável e energia',h:`<p>Devemos:</p><ul class="dots"><li>Saber que um peso saudável depende do <b>equilíbrio de energia</b> entre aquilo que se ingere e aquilo que se gasta na AF realizada ao longo do dia;</li><li>Perceber o contributo do <b>dispêndio energético</b> para o controlo do peso e do IMC;</li><li>Identificar diferentes opções de AF para dar resposta a necessidades diversas de dispêndio energético.</li></ul>`},
],
5:[
 {t:'A importância da alimentação',h:`<p>A alimentação pode ter um impacto <b>positivo ou negativo</b> na nossa saúde, no crescimento e no desenvolvimento — a curto e a longo prazo.</p><p>Se tivermos bons hábitos alimentares <b>desde a infância</b>, estes tendem a persistir na idade adulta.</p><div class="warn">Os malefícios de uma alimentação deficiente e/ou excessiva e desequilibrada não se fazem sentir no imediato, mas os problemas de saúde podem surgir em poucos anos, <b>antes ainda de serem adultos</b>.</div>`},
 {t:'A roda dos alimentos',h:`<div class="fig">${FIGS.ef_roda}</div>`},
 {t:'Hidratação e arrefecimento do organismo',h:`<div class="formula">70 % do nosso peso é água.</div><p>A atividade desportiva pode levar ao défice ou esgotamento das reservas de água do organismo, devido às perdas pelo <b>suor</b> e pelas <b>vias respiratórias</b>.</p><p>Ao transpirarmos, a água do suor evapora-se à superfície da pele, baixando a temperatura corporal.</p><div class="warn">O que faz arrefecer o corpo é a <b>evaporação</b> da água do suor produzido.</div>`},
],
6:[
 {t:'A importância do repouso',h:`<p>É durante o descanso que o corpo se <b>reconstitui, restabelece e reforça</b>. Estes processos têm um grande impacto na condição física e na saúde.</p><div class="warn">O descanso reduzido e, consequentemente, o <b>overtraining</b> podem ter um impacto negativo na saúde e na condição física e psicológica.</div>`},
 {t:'A importância da higiene',h:`<p>Após a atividade física deve-se <b>tomar banho</b>: é um ato fundamental de higiene física, que elimina os produtos da sudação e limpa a pele.</p><ul class="ck"><li class="n">Partilhar toalhas</li><li class="y">Usar sempre chinelos no balneário</li></ul><p class="note">Assim evita-se o contágio de agentes que provocam infeções cutâneas e das unhas (pé de atleta, por exemplo).</p>`},
 {t:'A importância do meio ambiente',h:`<div class="fig">${FIGS.ef_amb}</div>`},
],
};

function SAG(A,B,pairs,la,lb){
 const n=Math.max(A.length,B.length),H=Math.max(130,n*34+40),W=300,ax=80,bx=220;
 const ya=i=>H/2+(i-(A.length-1)/2)*34, yb=i=>H/2+(i-(B.length-1)/2)*34;
 let g=`<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" style="fill:var(--accent)"/></marker></defs>`;
 g+=`<ellipse cx="${ax}" cy="${H/2}" rx="44" ry="${H/2-8}" fill="none" style="stroke:var(--muted)" stroke-width="1.3"/><ellipse cx="${bx}" cy="${H/2}" rx="44" ry="${H/2-8}" fill="none" style="stroke:var(--muted)" stroke-width="1.3"/>`;
 g+=`<text x="${ax-44}" y="14" font-size="12" font-weight="700" style="fill:var(--ink)">${la||'A'}</text><text x="${bx+34}" y="14" font-size="12" font-weight="700" style="fill:var(--ink)">${lb||'B'}</text>`;
 A.forEach((a,i)=>{g+=`<circle cx="${ax+12}" cy="${ya(i)}" r="2.6" style="fill:var(--ink)"/><text x="${ax+2}" y="${ya(i)+4}" font-size="12" text-anchor="end" style="fill:var(--ink)">${a}</text>`});
 B.forEach((b,i)=>{g+=`<circle cx="${bx-12}" cy="${yb(i)}" r="2.6" style="fill:var(--ink)"/><text x="${bx-2}" y="${yb(i)+4}" font-size="12" style="fill:var(--ink)">${b}</text>`});
 pairs.forEach(([i,j])=>{g+=`<line x1="${ax+16}" y1="${ya(i)}" x2="${bx-18}" y2="${yb(j)}" style="stroke:var(--accent)" stroke-width="1.4" marker-end="url(#ah)"/>`});
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:340px;display:block;margin:0 auto" font-family="inherit">${g}</svg>`}
const PW=(lhs,rows)=>`<div class="pwx"><span>${lhs} =</span><span class="pwb"></span><table>${rows.map(([e,c])=>`<tr><td>${e}</td><td>${c}</td></tr>`).join('')}</table></div>`;
const TB=(r1,r2)=>`<table class="tbx"><tr>${r1.map(x=>`<td>${x}</td>`).join('')}</tr><tr>${r2.map(x=>`<td>${x}</td>`).join('')}</tr></table>`;
const cosI=(P)=>x=>{for(let i=0;i<P.length-1;i++){const [a,ya]=P[i],[b,yb]=P[i+1];if(x>=a&&x<=b){const t=(1-Math.cos(Math.PI*(x-a)/(b-a)))/2;return ya+(yb-ya)*t}}return NaN};

function gePir(d,ano){const W=170,H=248,cx=W/2,bh=11,sc=13.5;let g='';
 d.forEach(([h,m],i)=>{const y=H-22-(i+1)*bh;const c=i<3?'#3b82d6':i<13?'#7aa84a':'#e0b628';

  if(i%3===0)g+=`<text x="${cx}" y="${y+8}" font-size="7" text-anchor="middle" style="fill:var(--muted)">${GE_CL[i]}</text>`});
 g+=`<text x="${cx}" y="12" font-size="12" font-weight="700" text-anchor="middle" style="fill:var(--ink)">${ano}</text><text x="${cx-12}" y="${H-6}" font-size="8" text-anchor="end" style="fill:var(--muted)">Homens</text><text x="${cx+12}" y="${H-6}" font-size="8" style="fill:var(--muted)">Mulheres</text>`;

const STUDY_GE={
1:[
 {t:'Natalidade, mortalidade e crescimento natural',h:`<div class="box b2"><b>Natalidade</b><p>Número de nados-vivos ocorridos num território, durante um ano.</p></div><div class="box b1"><b>Mortalidade</b><p>Número de óbitos ocorridos num território, durante um ano.</p></div><div class="box b3"><b>Crescimento natural ou saldo fisiológico</b><p>Diferença entre a natalidade e a mortalidade.</p></div><div class="formula">TN = n.º nados-vivos ÷ população total × 1000<br>TM = n.º óbitos ÷ população total × 1000<br>TCN = TN − TM</div>`},
 {t:'Migrações e crescimento efetivo',h:`<ul class="dots"><li><b>Imigração:</b> pessoas que entram num país e aí fixam residência.</li><li><b>Emigração:</b> pessoas que saem do seu país para fixar residência noutro.</li><li><b>Crescimento migratório ou saldo migratório</b> = imigração − emigração.</li><li><b>Crescimento efetivo</b>: variação real da população num território durante um ano.</li></ul><div class="formula">TCM = (imigração − emigração) ÷ população total × 1000<br>CE = CN + CM &nbsp;·&nbsp; TCE = TCN + TCM</div><p>As taxas apresentam-se em <b>permilagem (‰)</b>, por mil habitantes. As taxas de crescimento natural, migratório e efetivo também podem vir em <b>percentagem (%)</b>, por cem habitantes. Ex.: −0,5% = −5‰.</p>`},
 {t:'Censos',h:`<p>O <b>Recenseamento Geral da População</b> realiza-se desde <b>1864</b>, de <b>dez em dez anos</b>. Desde <b>1970</b> é feito em simultâneo com o <b>Recenseamento da Habitação</b>: em conjunto chamam-se <b>Censos</b>. O último é o de 2021.</p><p><b>Recenseamento:</b> operação estatística em que todos os elementos da população são contabilizados e caracterizados.</p><p><b>Taxa de mortalidade infantil:</b> número de óbitos de crianças com menos de 1 ano, por mil nados-vivos, geralmente num ano.</p>`},
],
2:[
 {t:'Os seis períodos desde 1950',h:`<div class="tl">${tbl(['Período','O que aconteceu','Porquê'],[['Até 1962','Aumento','TCN positiva, TN alta e TM a descer. A TCN compensa a TCM negativa.'],['1963-1973','Redução','Grande surto de emigração, sobretudo para a Europa. TCM muito negativa, TCE negativa.'],['1974-1982','Aumento rápido','Regresso de portugueses das ex-colónias; crise internacional trava a emigração.'],['Anos 1980','Estagnação','TN desce; crise internacional trava as migrações. TCE quase nula.'],['1992-2010','Aumento','Imigração dos PALOP, do Brasil e da Europa de Leste; a TN sobe um pouco.'],['Desde 2010-2011','Redução','Crise económica: mais emigração e menos imigração. TCN e TCM negativas.']])}</div><p>População: 9 milhões em <b>1975</b>; ultrapassou os 10 milhões vinte anos depois.</p>`},
 {t:'Natalidade e mortalidade no século XX',h:`<ul class="dots"><li><b>Início do século XX:</b> TN e TM elevadas, TN &gt; TM, logo TCN positiva.</li><li><b>1914-1918:</b> TM &gt; TN, TCN negativa, por causa da Primeira Guerra Mundial e da gripe pneumónica.</li><li><b>1920 a 1974:</b> a TN desce mas fica acima de 20‰; a TM desce para cerca de 10‰ com a melhoria das condições de vida e da assistência médica.</li><li><b>Depois de 1974:</b> queda acentuada da TN pela banalização dos contracetivos. A TM desce um pouco nos anos 80 e sobe ligeiramente desde 1990, pelo envelhecimento.</li><li><b>TCN negativa</b> em 2007 e depois desde 2010.</li></ul>`},
 {t:'Mortalidade infantil',h:`${FIGS.ga_tmi}<p>A forte descida depois do 25 de Abril reflete a melhoria das condições socioeconómicas e da assistência médica, como a criação do <b>Serviço Nacional de Saúde (1979)</b>.</p><p>Outras datas na cronologia: 1961 Guerra Colonial, 1974 Revolução, 1986 adesão à CEE, 1998 Expo 98, 2008 crise económica mundial.</p>`},
],
3:[
 {t:'Emigração e imigração',h:`<ul class="dots"><li><b>1963-1973:</b> intensa emigração por fraco desenvolvimento, falta de emprego e más condições de vida. Destino sobretudo <b>França e Alemanha</b>. TCE negativa.</li><li><b>1974-1980:</b> TCM positiva pela independência das colónias: regressam muitos portugueses e chegam naturais desses territórios. Forte subida da TCE.</li><li><b>1990-2007:</b> TCM positiva. Crescimento económico após a adesão à UE atrai migrantes dos <b>PALOP, do Brasil e da Europa de Leste</b>, esta em crise pela desagregação da URSS.</li><li><b>Desde 2008:</b> a crise reduz a imigração e aumenta muito a emigração, sobretudo de jovens qualificados. A TCM volta a ser positiva em 2017; em 2019 a TCE foi positiva pela primeira vez desde 2009.</li></ul>`},
 {t:'Efeitos das migrações',h:`<p>A maioria dos migrantes tem <b>idade ativa e reprodutiva</b>.</p><div class="box b1"><b>Emigração</b><p>Redução e envelhecimento da população total e ativa; diminuição da TN e da TCN.</p></div><div class="box b3"><b>Imigração</b><p>Aumento e rejuvenescimento da população total e ativa; ligeiro aumento da TN e da TCN.</p></div><p>As migrações influenciam o crescimento efetivo <b>diretamente</b> pela TCM e <b>indiretamente</b> pela TN e pela TCN.</p>`},
 {t:'Êxodo rural',h:`<p><b>Êxodo rural:</b> saída do espaço rural para o espaço urbano, para residir e trabalhar. Mais intenso nos <b>anos 1960 e 1970</b>.</p><p><b>Causa:</b> o crescimento demográfico nas áreas rurais levou à escassez de recursos naturais, como terras e lenha, e à falta de emprego e de perspetivas.</p><p><b>Efeitos:</b> o litoral ganhou população, sobretudo nas áreas metropolitanas de Lisboa e Porto; o interior e as regiões autónomas perderam em quase todos os municípios. Nas áreas rurais: envelhecimento, TN a diminuir, TM a aumentar, TCN negativa.</p><p>É o fator essencial do contraste entre o <b>interior rural</b> e o <b>litoral urbano</b>. Alguns municípios do interior crescem graças a cidades com desenvolvimento económico.</p>`},
],
4:[
 {t:'Litoral e interior em 2019',h:`<ul class="dots"><li><b>Taxa de natalidade:</b> mais alta nos <b>Açores, Algarve e AM de Lisboa</b>; mais baixa no interior do Norte e Centro.</li><li><b>Taxa de mortalidade:</b> menor no litoral e nas regiões autónomas; mais elevada no interior.</li><li>No interior há mais idosos: menos nascimentos e mais óbitos.</li></ul><p>A <b>emigração</b> ajudou a despovoar o interior. A <b>imigração</b> fixa-se sobretudo nas AM de Lisboa e Porto, com alguma fixação em áreas rurais ligada à agricultura pouco qualificada, ao turismo rural e à agricultura biológica.</p>`},
 {t:'Crescimento efetivo por regiões',h:`<p>Saldo positivo ou pouco negativo no <b>litoral e regiões autónomas</b>; valores mais negativos no <b>interior</b>.</p><p>Em 2019 o crescimento efetivo foi negativo em todo o país, <b>exceto nas duas áreas metropolitanas</b>, porque:</p><ul class="dots"><li>a <b>TCN</b> era negativa em quase todo o país: é a variável que mais contribui para a redução da população;</li><li>a <b>TCM</b> era negativa em mais de metade das sub-regiões, mas com valores superiores aos da TCN, e positiva nas duas AM. A AM de Lisboa teve a TCM mais alta.</li></ul>`},
],
5:[
 {t:'Estrutura etária e pirâmide',h:`<p><b>Estrutura etária:</b> composição da população por idades. Classes de cinco anos; grupos etários: <b>0-14 jovens</b>, <b>15-64 adultos</b>, <b>65 e mais idosos</b>.</p><div class="tl">${tbl(['Na pirâmide…','…indica'],[['Barras até aos 14 anos','A evolução da TN e se a população ativa vai aumentar ou diminuir'],['Barras dos 15 aos 64','A população ativa: se dos 15 aos 34 forem estreitas, vai diminuir e envelhecer'],['Barras dos 65 e mais','A mortalidade, cuja redução fez aumentar a esperança média de vida'],['Mulheres vs homens','A diferença da esperança média de vida por género']])}</div><p><b>Esperança média de vida:</b> número de anos que, em média, uma pessoa tem probabilidade de viver ao nascer ou num dado grupo etário.</p>`},
 {t:'Duplo envelhecimento',h:`${FIGS.ga_pir}<ul class="dots"><li><b>Na base:</b> menos jovens, por redução da natalidade.</li><li><b>No topo:</b> mais idosos, por redução da mortalidade e aumento da esperança média de vida.</li><li>Também os <b>adultos</b> envelhecem: diminuem as classes dos 15-34/39 e aumentam as acima dos 34/39.</li></ul><p>Até 2050 prevê-se ainda menos jovens e mais idosos.</p>`},
 {t:'Fecundidade',h:`<ul class="dots"><li><b>Índice sintético de fecundidade:</b> número médio de filhos por mulher em idade fértil, dos 15 aos 49 anos. Em Portugal está abaixo de 2,1.</li><li><b>Índice de renovação de gerações:</b> valor mínimo do ISF para substituir as gerações: <b>2,1</b>.</li><li><b>Taxa de fecundidade:</b> nados-vivos num ano por mil mulheres em idade fértil. Desce nas mães mais jovens e sobe nas de 30 e mais anos.</li></ul><p><b>Porque desce:</b> planeamento familiar e contracetivos; mais mulheres a trabalhar e valorização profissional; escolaridade obrigatória mais longa, que adia a vida ativa e o 1.º filho; despesas com a educação dos filhos e conciliação trabalho-família; trabalho precário dos jovens; falta de habitação a preços acessíveis.</p>`},
 {t:'Esperança de vida e índice de envelhecimento',h:`<p>A esperança média de vida aumentou muito pela <b>queda da mortalidade</b>, graças à melhoria da assistência médica e proteção social, da higiene e segurança no trabalho e das condições de vida.</p><p><b>As mulheres vivem mais</b> por: maior cuidado com alimentação e saúde; menos acidentes de trabalho; menos comportamentos de risco; sistema imunológico mais eficiente.</p><div class="formula">Índice de envelhecimento = pop. 65 e mais ÷ pop. 0-14 × 100<br>n.º de idosos por cada cem jovens</div><p>Mais alto no <b>interior</b>; mais baixo no <b>Norte litoral</b>; intermédio no Centro litoral, AM de Lisboa e Algarve.</p>`},
],
6:[
 {t:'População ativa e setores',h:`<p><b>População ativa:</b> pessoas com 15 ou mais anos que são mão de obra disponível, incluindo desempregados e quem cumpre serviço militar.</p><div class="formula">Taxa de atividade = pop. ativa ÷ pop. total × 100</div><div class="tl">${tbl(['Setor','O que inclui'],[['Primário','Extração de recursos naturais e obtenção de alimentos: agricultura, pesca…'],['Secundário','Indústria, produção de energia, construção civil e obras públicas'],['Terciário','Comércio, transação de bens e capitais, serviços à população e às empresas']])}</div><p><b>Terciarização:</b> domínio do terciário no emprego e na produção de riqueza.</p>`},
 {t:'Evolução da população ativa e do emprego',h:`<p>A população ativa depende de: <b>estrutura etária</b>, <b>valorização da formação</b>, <b>participação da mulher</b>, <b>saldo migratório</b> e <b>situação económica</b>.</p><ul class="dots"><li>Ativos aumentaram muito desde os anos 70, sobretudo pela atividade feminina; voltaram a subir em 1995-2005 com a imigração; desceram um pouco com a crise de 2008-2015.</li><li>Em <b>1974</b> o emprego dividia-se quase igualmente pelos três setores.</li><li><b>Primário</b>: grande redução, menos de 10%, pelo êxodo rural e mecanização da agricultura.</li><li><b>Secundário</b>: subiu um pouco e desce neste século, cerca de 30%: modernização da indústria, deslocalização, fim das grandes obras após a Expo 98 e o Euro 2004.</li><li><b>Terciário</b>: cerca de 70% dos ativos.</li></ul>`},
 {t:'Escolaridade',h:`<p><b>Taxa de alfabetização:</b> população de 15 ou mais anos que sabe ler e escrever um pequeno texto, compreendendo-o.</p>${FIGS.ga_esc}<p>A evolução mostra: menos desigualdade de género, escolaridade obrigatória mais longa e democratização do ensino superior. Ajudaram: cursos profissionais, ensino recorrente em horário pós-laboral, Novas Oportunidades e, desde 2017, o <b>Programa Qualifica</b>.</p><p>Portugal ainda está abaixo da UE.</p>`},
 {t:'Diferenças entre regiões',h:`<ul class="dots"><li><b>Centro e Alentejo:</b> primário menos reduzido, por terem muitas áreas agrícolas e florestais e mais idosos.</li><li><b>Norte e Centro:</b> destaca-se o secundário, com muitas indústrias.</li><li><b>AM de Lisboa:</b> destaca-se o terciário, com serviços administrativos, financeiros e turísticos. <b>Algarve e Madeira:</b> turismo.</li><li><b>Escolaridade:</b> todas as regiões têm mais de 50% de ativos com secundário ou superior, exceto Açores e Madeira. Destaca-se a AM de Lisboa.</li><li>A população ativa envelhece em todas as regiões, sobretudo no interior.</li></ul>`},
],
7:[
 {t:'Índices de dependência',h:`<p>A <b>população dependente</b> é a população inativa, sobretudo jovens e idosos.</p><div class="formula">IDJ = jovens 0-14 ÷ pop. 15-64 × 100<br>IDI = idosos 65+ ÷ pop. 15-64 × 100<br>IDT = (jovens + idosos) ÷ pop. 15-64 × 100</div>${FIGS.ga_id}<ul class="dots"><li>1960-1981: IDT alto sobretudo pelos jovens.</li><li>1981-2001: IDT desce porque o IDJ desce.</li><li>Desde 2001: IDT sobe porque o IDI sobe.</li></ul>`},
 {t:'Sustentabilidade e renovação',h:`<ul class="dots"><li><b>Índice de sustentabilidade potencial:</b> número de pessoas em idade ativa por cada idoso. Há cada vez menos.</li><li><b>Índice de renovação da população ativa:</b> número dos que entram na idade ativa por cada cem que saem. Abaixo de 100 já não substitui quem sai.</li></ul>${FIGS.ga_isp}<p><b>Problema:</b> as despesas do Estado com saúde, apoio aos idosos e pensões aumentam e as contribuições dos ativos diminuem: desequilíbrio dos sistemas de pensões, como a Segurança Social e a Caixa Geral de Aposentações, que podem entrar em rutura.</p>`},
 {t:'Qualificação e produtividade',h:`<p><b>Produtividade:</b> relação entre o valor da produção e o tempo de trabalho. Pode ser do trabalho ou do capital fixo.</p><div class="formula">Produtividade do trabalho = VAB ÷ n.º de horas trabalhadas</div><p><b>VAB:</b> diferença entre o valor da produção e os gastos com a produção. <b>Produtividade do capital fixo:</b> depende do uso intensivo do equipamento e do seu grau de modernização e automatização.</p><p>Falta de qualificação nos <b>empregadores</b>: má organização, gestão financeira pouco eficaz, menos inovação. Nos <b>empregados</b>: trabalho menos qualificado, mais dificuldade de adaptação. Menos produtividade significa menos <b>competitividade</b>.</p>`},
 {t:'Desemprego',h:`<div class="formula">Taxa de desemprego = desempregados ÷ pop. ativa × 100<br>Taxa de emprego = empregados ÷ pop. ativa × 100</div><p><b>Desemprego:</b> pessoas com mais de 15 anos sem trabalho, disponíveis e à procura de emprego. <b>Conjuntura:</b> situação num período limitado com fatores que influenciam a economia. <b>Recessão:</b> PIB inferior ao do ano anterior.</p><p>Em crescimento económico o desemprego desce; em recessão sobe. Máximo em 2013, na crise.</p><p><b>Maior risco:</b> mulheres menos qualificadas; ativos com menos formação; jovens até aos 25, porque se exige experiência; ativos com mais de 35 em desemprego de longa duração.</p><p>Quem tem mais qualificação participa mais na <b>aprendizagem ao longo da vida</b>.</p>`},
],
8:[
 {t:'Rejuvenescer a população',h:`<p>É preciso aumentar a <b>população jovem</b> para equilibrar os grupos etários e renovar a população ativa.</p><p>Os portugueses querem em média <b>2,3 filhos</b> e têm <b>1,2</b>, por barreiras económicas, institucionais e sociais.</p><p><b>Políticas natalistas:</b> pré-escolar público com horários compatíveis; subsídios familiares e menos impostos por filho; apoio às despesas de educação; licença parental maior e partilhada; adoção; empresas amigas da família com creches e horário flexível; emprego seguro e salários adequados.</p><p>Exemplos: OE 2020, licença do pai de 15 para 20 dias úteis e complemento-creche; uma empresa dá 500 € por filho; Montalegre dá 50 € por mês até aos 3 anos.</p>`},
 {t:'Valorizar a imigração',h:`<p>Manter o <b>saldo migratório positivo</b>: salários e carreiras como nos países mais desenvolvidos da UE, para não perder jovens qualificados; atrair estudantes e jovens estrangeiros; imigração legal e planeada; integração de refugiados.</p><p>A maioria dos migrantes tem entre 15 e 45 anos. A imigração rejuvenesce a população, trava a queda da natalidade, aumenta e rejuvenesce os ativos, aumenta as receitas fiscais, ajuda as pensões e traz diversidade cultural. Os estrangeiros têm taxa de atividade superior à dos nacionais.</p>`},
 {t:'Elevar a qualificação e a competitividade',h:`<ul class="dots"><li>Diversificar percursos escolares para incluir todos e combater o abandono.</li><li>Melhorar a oferta profissional para jovens e adultos.</li><li>Ligar o ensino às empresas.</li><li>Inovação tecnológica nas escolas e universidades.</li><li>Apoiar as empresas na formação e na aprendizagem ao longo da vida.</li></ul><p><b>Programa Qualifica</b> (2017): objetivo de 600 mil adultos até 2020, para que pelo menos 50% dos ativos tenham o secundário.</p><p>Mais qualificação: mais produtividade, mais inovação e <b>empreendedorismo</b>, melhor resposta aos consumidores, mais exportações e investimento estrangeiro.</p>`},
],
};
// ---- gráficos e quadros de dados para as perguntas (valores aproximados quando indicado) ----
function LCH(o){const W=330,H=o.h||210,L=34,R=16,T=14,B=26,[x0,x1,xs]=o.x,[y0,y1,ys]=o.y;
 window.CHREG=window.CHREG||[];const id=CHREG.push({W,H,x0,x1,y0,y1,L,R,T,B,ax:'box',step:1,c:o.s.map(s=>({p:s.p,col:s.c})),pt:[]})-1;
 const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(y1-y)/(y1-y0)*(H-T-B);let g='';
 for(let y=y0;y<=y1+1e-9;y+=ys){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(y)}" y2="${Y(y)}" style="stroke:var(--line)" stroke-width="0.7"/><text x="${L-4}" y="${Y(y)+3.5}" font-size="9" text-anchor="end" style="fill:var(--muted)">${String(+y.toFixed(1)).replace('.',',')}</text>`}
 for(let x=x0;x<=x1;x+=xs){g+=`<line x1="${X(x)}" x2="${X(x)}" y1="${T}" y2="${H-B}" style="stroke:var(--line)" stroke-width="0.5"/><text x="${X(x)}" y="${H-B+13}" font-size="9" text-anchor="middle" style="fill:var(--muted)">${x}</text>`}
 if(o.zero!==undefined)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(o.zero)}" y2="${Y(o.zero)}" style="stroke:var(--ink)" stroke-width="1"/>`;
 o.s.forEach(s=>{g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2" points="${s.p.map(([x,y])=>X(x)+','+Y(y)).join(' ')}"/>`;(s.lab||[]).forEach(([x,y,t])=>{g+=`<circle cx="${X(x)}" cy="${Y(y)}" r="2.6" fill="${s.c}"/><text x="${X(x)}" y="${Y(y)-6}" font-size="9" text-anchor="middle" fill="${s.c}" font-weight="700">${t}</text>`})});
 const leg=o.s.length>1?`<div class="fs">${o.s.map(s=>`<span style="color:${s.c}">■</span> ${s.n}`).join(' · ')}</div>`:'';
 return `<div class="ft">${o.t}</div><svg data-ch="${id}" viewBox="0 0 ${W} ${H}" style="width:100%;display:block;cursor:crosshair" font-family="inherit">${g}</svg><div class="chhint">Toca no gráfico para ler os valores</div>${leg}${o.cap?`<div class="fs">${o.cap}</div>`:''}`}
Object.assign(FIGS,{
 ge_pop:LCH({t:'População residente em Portugal (milhões)',x:[1950,2020,10],y:[8.4,10.8,0.4],s:[{n:'População',c:'#1f7f86',p:[[1950,8.51],[1955,8.69],[1960,8.89],[1962,8.95],[1966,8.8],[1970,8.66],[1973,8.63],[1975,9.09],[1978,9.6],[1982,9.86],[1986,9.9],[1991,9.87],[1995,10.03],[2001,10.36],[2005,10.5],[2010,10.57],[2013,10.45],[2016,10.33],[2020,10.3]]}],cap:'Valores aproximados.'}),
 ge_tntm:LCH({t:'Taxas de natalidade e de mortalidade em Portugal (‰)',x:[1900,2020,20],y:[0,45,5],h:220,s:[{n:'Taxa de natalidade',c:'#3b82d6',p:[[1900,30.5],[1910,32],[1915,31],[1918,30],[1920,33],[1930,29.5],[1940,24.5],[1950,24.4],[1960,24.1],[1970,20],[1974,19.5],[1980,16.2],[1985,13],[1990,11.7],[2000,11.7],[2007,9.7],[2010,9.6],[2013,7.9],[2019,8.4],[2020,8.2]]},{n:'Taxa de mortalidade',c:'#c0552b',p:[[1900,20.5],[1910,19.5],[1915,20.5],[1918,41],[1920,23.7],[1930,17],[1940,15.6],[1950,12.2],[1960,10.8],[1970,10.7],[1974,10.5],[1980,9.7],[1985,9.6],[1990,10.4],[2000,10.3],[2007,9.8],[2010,10],[2013,10.2],[2019,10.9],[2020,12]]}],cap:'Valores aproximados. Cronologia: 1914-18 Primeira Guerra Mundial · 1918-19 gripe pneumónica · 1974 Revolução de Abril · 1979 SNS · 1986 adesão à CEE · 2020 pandemia de Covid-19.'}),
 ge_desemp:LCH({t:'Taxa de desemprego em Portugal (%)',x:[1986,2020,4],y:[0,18,2],s:[{n:'Taxa de desemprego',c:'#c0552b',p:[[1986,8.6],[1988,5.7],[1990,4.6],[1992,4.1],[1994,6.9],[1996,7.2],[1998,5],[2000,3.9],[2002,5],[2004,6.7],[2006,7.6],[2008,7.6],[2010,10.8],[2012,15.5],[2013,16.2],[2014,13.9],[2016,11.1],[2018,7],[2019,6.5]]}],cap:'Valores aproximados.'}),

Object.assign(FIGS,{
 cr_a:CR('Estando a cidade assi cercada na maneira que já ouvistes, gastavom-se os mantiimentos cada vez mais, por as muitas gentes que em ela havia, assi dos que se colherom dentro, do termo, de homeẽs e aldeãos com molheres e filhos, come dos que veerom na frota do Porto; e alguũs se tremetiam aas vezes em batees e passavom de noite escusamente contra as partes de Ribatejo, e metendo-se em alguũs esteiros, ali carregavom de triigo que já achavom prestes […]. E partiam de noite remando mui rijamente, e algũas galees quando os sentiam viinr remando, isso meesmo remavom a pressa sobre eles; e os batees por lhe fugir, e elas por os tomar, eram postos em grande trabalho.','tremetiam: metiam, embarcavam · batees: batéis, pequenas embarcações · escusamente: em segredo · esteiros: canais · galees: galés inimigas'),

 cr_f:CR('Andavom os moços de tres e de quatro anos pedindo pam pela cidade por amor de Deos, como lhes ensinavam suas madres, e muitos nom tiinham outra cousa que lhe dar senom lagrimas que com eles choravom que era triste cousa de veer; e se lhes davom tamanho pam come ũa noz, haviam-no por grande bem. Desfalecia o leite aquelas que tiinham crianças a seus peitos per mingua de mantiimento; e veendo lazerar seus filhos a que acorrer nom podiam, choravom ameúde sobr’eles a morte ante que os a morte privasse da vida.','lazerar: sofrer · ameúde: amiúde, frequentemente'),

 cr_j:CR('Onde sabee que esta fame e falecimento que as gentes assi padeciam, nom era por seer o cerco perlongado, ca nom havia tanto tempo que Lixboa era cercada; mas era per aazo das muitas gentes que se a ela colherom de todo o termo; e isso meesmo da frota do Porto quando veo, e os mantiimentos seerem muito poucos. Ora esguardae como se fossees presente, ũa tal cidade assi desconfortada e sem neũa certa feúza de seu livramento, como veviriam em desvairados cuidados quem sofria ondas de taes aflições? Ó geeraçom que depois veo, poboo bem aventuirado, que nom soube parte de tantos males, nem foi quinhoeiro de taes padecimentos!','falecimentos: misérias · per aazo: por causa · esguardae: olhai, vede · feúza: confiança · quinhoeiro: participante'),

 {t:'O cerco de Lisboa',h:`<p>Depois da morte do Conde Andeiro e da fuga de D. Leonor Teles para Alenquer, o povo de Lisboa reconheceu o Mestre de Avis como <b>Regedor e Defensor do Reino</b>.</p><p>O rei castelhano, que reclamava o trono português, invadiu o país e <b>cercou Lisboa por terra e mar</b>. A cidade resistiu alguns meses, protegida pela <b>muralha fernandina</b>.</p><p>Um surto de <b>peste</b> no exército invasor obrigou o rei a levantar o cerco. Nas <b>Cortes de Coimbra</b>, a <b>6 de abril de 1385</b>, D. João foi aclamado rei de Portugal.</p>`},

4:[
 {t:'A consciência coletiva',h:`<p>A noção de <b>identidade nacional</b> foi sendo criada à medida que se consolidaram as fronteiras. Em 1385 o povo português já tinha consciência da sua identidade face aos outros povos da Península.</p><p>Na crise, o povo, a <b>«arraia-miúda»</b>, sente a independência e a liberdade ameaçadas e <b>reage violentamente</b> contra a invasão castelhana.</p><p>Fernão Lopes faz a apologia da <b>força de uma coletividade</b> que não aceita o lugar que lhe dava o direito senhorial e cria um direito novo, fundado no <b>«amor da terra»</b>.</p><p>A palavra «Portugal» passa a definir não um território, mas <b>um corpo de gente animado de um pensamento: a sua nacionalidade</b>.</p><p>A crónica é menos a história dos atos do Mestre do que a evocação dos <b>esforços, sacrifícios e feitos do povo inteiro</b> na luta pela independência.</p>`},

const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const idsOf=k=>QS.map((q,i)=>q[0]===k?i:-1).filter(i=>i>=0);

function stratified(ids,n){const g={};shuffle(ids).forEach(i=>{const k=QS[i][1];(g[k]=g[k]||[]).push(i)});
 const keys=shuffle(Object.keys(g)),out=[];let r=0;
 while(out.length<n&&keys.some(k=>g[k].length>r)){keys.forEach(k=>{if(out.length<n&&g[k][r]!==undefined)out.push(g[k][r])});r++}
 return shuffle(out)}
function fresh(ids,n){const un=ids.filter(i=>!S.seen[i]);if(un.length>=n)return stratified(un,n);return shuffle(un.concat(stratified(ids.filter(i=>S.seen[i]),n-un.length)))}
function cover(k){const ids=idsOf(k);const s=ids.filter(i=>S.seen[i]).length;return {s,n:ids.length,p:ids.length?Math.round(s/ids.length*100):0}}
function build(t){
 if(t.startsWith('lvl:')){const ids=idsOf(T_().keys[+t.split(':')[2]]);return fresh(ids,Math.min(LVN,ids.length)).sort((a,b)=>a-b)}
 if(t.startsWith('unit:')){const ks=T_().units[+t.split(':')[2]].keys,n=size();let o=[];ks.forEach((k,j)=>{const per=Math.floor(n/ks.length)+(j<n%ks.length?1:0);o=o.concat(fresh(idsOf(k),per))});return shuffle(o)}
 if(t.startsWith('sub:')){const key=t.slice(4);return fresh(QS.map((q,i)=>(q[0]+':'+q[1])===key?i:-1).filter(i=>i>=0),size())}
 if(t===SAV())return shuffle(S.saved.filter(inCur)).slice(0,size());
 if(t===ERR())return shuffle(S.wrong.filter(inCur)).slice(0,size());
 if(t===ALL()){const ks=T_().mix||T_().keys,n=size();let o=[];ks.forEach((k,j)=>{const per=Math.floor(n/ks.length)+(j<n%ks.length?1:0);o=o.concat(fresh(idsOf(k),per))});return shuffle(o)}
 return fresh(idsOf(t),size())}
const LVN=10;
function LV(){const o=S.lvl[cur]=S.lvl[cur]||{u:0,s:[],b:[]};return o}
function tname(t){if(t.startsWith('lvl:')){const i=+t.split(':')[2];return 'Nível '+(i+1)+' · '+TOPICS[T_().keys[i]].n}if(t.startsWith('unit:'))return T_().units[+t.split(':')[2]].n;if(t.startsWith('sub:'))return SUBN[t.slice(4)]||'Treino';if(t.startsWith('all:'))return 'Mistura (como no teste)';if(t.startsWith('err:'))return 'Os meus erros';if(t.startsWith('sav:'))return 'Guardadas';return TOPICS[t].n}

function daysTo(d){if(!d)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(d+'T00:00:00')-t)/864e5)}
function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString('pt-PT',{day:'numeric',month:'long'})}
function cdBox(T){const n=daysTo(T.when);if(n===null||n<0)return '';
 const txt=n===0?'O teste é hoje.':n===1?'O teste é amanhã.':`Faltam ${n} dias para o teste (${fmtDate(T.when)}).`;
 return `<div class="cd ${n<=2?'hot':''}"><b>${n}</b><span>${txt}</span></div>`}
function tagFor(k){const L=Object.entries(TESTS).filter(([,T])=>T.subj===k);if(!L.length)return 'Em breve';
 const up=L.map(([,T])=>daysTo(T.when)).filter(n=>n!==null&&n>=0).sort((a,b)=>a-b);
 if(up.length)return up[0]===0?'Teste hoje':up[0]===1?'Teste amanhã':`Teste daqui a ${up[0]} dias`;
 return L.some(([,T])=>!T.when&&T.keys.length)?'Teste com data por definir':L.some(([,T])=>!T.keys.length)?'Para estudar':''}

let lastAct=0;
function tick(){const now=Date.now();if(view.name==='quiz'&&lastAct&&cur){const d=Math.min((now-lastAct)/1000,120);S.time[cur]=(S.time[cur]||0)+d;
 const day=new Date().toISOString().slice(0,10);if(!S.tday||S.tday.d!==day)S.tday={d:day};S.tday[cur]=(S.tday[cur]||0)+d}lastAct=now}
function fmtT(s){s=Math.round(s/60);if(s<1)return 'menos de 1 min';const h=Math.floor(s/60),m=s%60;return h?`${h} h ${m} min`:`${m} min`}
function recAdd(k,good){const r=S.rec[k]=S.rec[k]||[];r.push(good?1:0);if(r.length>20)r.shift()}
function prep(){const ks=T_().mix||T_().keys;let tot=0,weak=null,ws=2;ks.forEach(k=>{const cv=cover(k).p/100;const r=S.rec[k]||[];const acc=r.length?r.reduce((a,b)=>a+b,0)/r.length:0;const conf=Math.min(r.length/10,1);const sc=0.4*cv+0.6*acc*conf;tot+=sc;if(sc<ws){ws=sc;weak=TOPICS[k].n}});return {p:Math.round(tot/ks.length*100),weak}}
function stats(t){const h=S.history.filter(x=>x.t===t);if(!h.length)return null;const p=h.map(x=>Math.round(x.c/x.n*100));return {n:h.length,last:p[p.length-1],best:Math.max(...p),avg:Math.round(p.reduce((a,b)=>a+b,0)/p.length),prev:p.length>1?p[p.length-2]:null}}

const needsCalc=q=>(q[1]==='imc'&&/\d,\d/.test(q[2]))||(q[1]==='calc'&&q[0].startsWith('ga'))||CALCQ.some(k=>q[2].startsWith(k));
let calc={open:false,ex:'',rs:''};
function cParse(str){let i=0;const s=str.replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'.').replace(/−/g,'-');
 const peek=()=>s[i],num=()=>{let j=i;while(i<s.length&&/[0-9.]/.test(s[i]))i++;if(j===i)throw 0;return parseFloat(s.slice(j,i))};
 function fac(){if(peek()==='-'){i++;return -fac()}if(peek()==='('){i++;const v=expr();if(s[i]!==')')throw 0;i++;return pct(v)}return pct(num())}
 function pct(v){if(s[i]==='%'){i++;return v/100}return v}
 function term(){let v=fac();while(peek()==='*'||peek()==='/'){const o=s[i++];const r=fac();v=o==='*'?v*r:v/r}return v}
 function expr(){let v=term();while(peek()==='+'||peek()==='-'){const o=s[i++];const r=term();v=o==='+'?v+r:v-r}return v}
 const v=expr();if(i!==s.length||!isFinite(v))throw 0;return v}
function cFmt(v){return Number(v.toFixed(6)).toLocaleString('pt-PT',{maximumFractionDigits:6})}
function cKey(k){if(k==='C'){calc.ex='';calc.rs=''}else if(k==='⌫'){calc.ex=calc.ex.slice(0,-1)}
 else if(k==='='){try{calc.rs=cFmt(cParse(calc.ex))}catch(e){calc.rs='Erro'}}
 else{if(calc.rs&&calc.rs!=='Erro'&&/[+−×÷%]/.test(k)&&calc.ex&&calc.lastEq){calc.ex=calc.rs.replace(/\s/g,'')}if(calc.lastEq&&/[0-9,(]/.test(k)){calc.ex='';}calc.ex+=k;calc.rs=''}
 calc.lastEq=k==='=';const d=$('#calc');if(d)d.outerHTML=calcHTML()}
function calcHTML(){const K=['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','0',',','⌫','='];
 return `<div class="calc" id="calc"><div class="disp"><div class="ex">${esc(calc.ex)||'&nbsp;'}</div><div class="rs">${calc.rs||'&nbsp;'}</div></div>
 <div class="keys4">${K.map(k=>`<button class="${'÷×−+'.includes(k)?'op':k==='='?'eq':''}" onclick="cKey('${k}')">${k}</button>`).join('')}</div></div>`}

function chTap(ev){const svg=ev.target.closest&&ev.target.closest('svg[data-ch]');if(!svg)return;const C=(window.CHREG||[])[+svg.dataset.ch];if(!C)return;

 C.c.forEach((c,ci)=>{if(c.f){const a=c.d?c.d[0]:C.x0,b=c.d?c.d[1]:C.x1;for(let i=0;i<=300;i++){const x=a+(b-a)*i/300;tryP(x,c.f(x),ci)}}
  else if(c.p){for(let k=0;k<c.p.length-1;k++){const [a,ya]=c.p[k],[b,yb]=c.p[k+1];for(let i=0;i<=12;i++){const t=i/12;tryP(a+(b-a)*t,ya+(yb-ya)*t,ci)}}}});

 if(!best||best.d>60)return;

 const ydec=Math.abs(y-Math.round(y))<0.05?0:1,xdec=Math.abs(x-Math.round(x))<1e-6?0:1;
 const xl=chFmt(x,xdec),yl=chFmt(y,ydec);const lab=(tx,ty,t,anc)=>{const w=t.length*5.6+8;let rx=anc==='end'?tx-w:anc==='middle'?tx-w/2:tx;rx=Math.max(1,Math.min(rx,C.W-w-1));return `<rect x="${rx}" y="${ty-10}" width="${w}" height="13" rx="3" fill="${col}"/><text x="${rx+w/2}" y="${ty}" font-size="9.5" font-weight="700" text-anchor="middle" fill="#fff">${t}</text>`};
 const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','xh');
 g.innerHTML=`<line x1="${px}" y1="${py}" x2="${px}" y2="${ax.y}" stroke="${col}" stroke-width="1.3" stroke-dasharray="4 3"/><line x1="${px}" y1="${py}" x2="${ax.x}" y2="${py}" stroke="${col}" stroke-width="1.3" stroke-dasharray="4 3"/><circle cx="${px}" cy="${py}" r="4" fill="${col}"/>`+lab(px,Math.min(ax.y+13,C.H-1),xl,'middle')+lab(ax.x-2,py+3.5,yl,'end');
 svg.appendChild(g)}
document.addEventListener('click',chTap);
function home(){
 return `<div class="hello"><h1>Estudo 10.º ano</h1><p class="muted">Escolhe a disciplina.</p></div>
 <div class="grid">${SUBJ.map(s=>{const on=Object.values(TESTS).some(T=>T.subj===s.k);
  return on?`<button class="subj on" onclick="openSubj('${s.k}')"><span class="ic" style="background:${s.c}">${s.ic}</span><h3>${s.n}</h3><span class="tag">${tagFor(s.k)}</span></button>`
  :`<div class="subj off"><span class="ic" style="background:${s.c}">${s.ic}</span><h3>${s.n}</h3><span class="tag">Em breve</span></div>`}).join('')}</div>`}

function subj(){const s=SUBJ.find(x=>x.k===subjCur);const L=Object.keys(TESTS).filter(t=>TESTS[t].subj===subjCur);
 return `${header("go('home')",s.n)}<div class="list">${L.map(t=>{const T=TESTS[t];return `<button class="testcard" style="background:${s.c};color:#fff" onclick="openTest('${t}')"><span class="k">${T.when?fmtDate(T.when):'Data por definir'}</span><span class="t">${T.title} · ${T.name}</span></button>`}).join('')}</div>`}

function test(){const T=T_(),s=SUBJ.find(x=>x.k===T.subj);if(!T.keys.length)return studyOnly(T,s);if(T.levels)return levels(T,s);
 const back=`subjCur='${T.subj}';go('subj')`;
 const tl=T.units?T.units.map((u,i)=>{const ids=u.keys.flatMap(idsOf),sn=ids.filter(x=>S.seen[x]).length,cp=ids.length?Math.round(sn/ids.length*100):0,st=stats('unit:'+cur+':'+i);
  return `<button class="topic" style="--c:${SUBJ.find(x=>x.k===T.subj).c}" onclick="openUnit(${i})"><div><div class="n">${i+1}. ${u.n}</div><div class="s">${u.s}</div>
  <div class="cov"><div class="bar"><i style="width:${cp}%"></i></div><span>${sn}/${ids.length} vistas</span></div></div><span class="best">${st?`<b>${st.best}%</b><br>melhor`:'›'}</span></button>`}).join(''):T.keys.map((k,i)=>{const P=TOPICS[k],st=stats(k),cv=cover(k);
  return `${T.extraFrom===k?'<p class="muted small" style="margin:10px 2px 0"><b>Fora da matriz do teste</b> · para treino extra</p>':''}<button class="topic" style="--c:${P.c}" onclick="start('${k}')"><div><div class="n">${i+1}. ${P.n}</div><div class="s">${P.s}</div>
  <div class="cov"><div class="bar"><i style="width:${cv.p}%"></i></div><span>${cv.s}/${cv.n} vistas</span></div></div>
  <span class="best">${st?`<b>${st.best}%</b><br>melhor`:'—'}</span></button>`}).join('');
 const tot=T.keys.reduce((a,k)=>{const c=cover(k);return [a[0]+c.s,a[1]+c.n]},[0,0]);const tp=tot[1]?Math.round(tot[0]/tot[1]*100):0;
 const sa=stats(ALL()),nw=S.wrong.filter(inCur).length,ns=S.saved.filter(inCur).length,P=prep();
 const tm=S.time[cur]||0,td=(S.tday&&S.tday.d===new Date().toISOString().slice(0,10))?(S.tday[cur]||0):0;
 const rounds=S.history.filter(x=>x.t.startsWith('unit:'+cur+':')||T.keys.includes(x.t)||[ALL(),ERR(),SAV()].includes(x.t)||(x.t.startsWith('sub:')&&T.keys.includes(x.t.slice(4).split(':')[0]))).length;
 return `${header(back,s.n+' · '+T.title)}
 <div class="testcard" style="background:${s.c};color:#fff"><span class="k">${T.when?'Teste a '+fmtDate(T.when):'Data do teste por definir'}</span><span class="t">${T.name}</span><span class="small" style="opacity:.85">${QS.filter((q,i)=>inCur(i)).length} perguntas · rondas de 10, 20 ou 30</span></div>
 ${cdBox(T)}
 <div class="card prep"><div class="row"><h3>Preparação estimada</h3><span class="pp">${P.p}%</span></div><div class="bar"><i style="width:${P.p}%"></i></div>
 <p class="muted small">${P.p===0?'Faz uma ronda para começar a medir.':`Conta as perguntas já vistas e os acertos recentes em cada matéria.${P.p<85&&P.weak?` Mais fraco: <b>${esc(P.weak)}</b>.`:''}`}</p>
 <p class="small">Tempo de estudo: <b>${fmtT(tm)}</b>${td?` · hoje ${fmtT(td)}`:''} · ${tot[0]}/${tot[1]} perguntas vistas (${tp}%)</p></div>
 <div class="row"><span class="muted small">Perguntas por ronda</span><div class="seg">${[10,20,30].map(n=>`<button class="${size()===n?'on':''}" onclick="setSize(${n})">${n}</button>`).join('')}</div></div>
 <div class="list">
 <button class="topic" style="--c:var(--accent)" onclick="start('${ALL()}')"><div><div class="n">Mistura tudo</div><div class="s">${T.mix?'Só a matéria da matriz, como no teste':'Um pouco de cada matéria, como no teste'}</div></div><span class="best">${sa?`<b>${sa.best}%</b><br>melhor`:'—'}</span></button>
 ${tl}</div>
 <div class="pill2"><button onclick="start('${ERR()}')" ${nw?'':'disabled'}>Os meus erros<span>${nw} para rever</span></button>
 <button onclick="start('${SAV()}')" ${ns?'':'disabled'}>Guardadas<span>${ns} para rever</span></button></div>
 <button class="ghost" onclick="go('prog')">Evolução <span class="muted">· ${rounds} rondas feitas</span></button>
 <p class="muted small" style="text-align:center">A app mostra primeiro as perguntas que ainda não viste.</p>
 <button class="muted small" style="text-align:center;padding:6px" onclick="resetTest()">${confirmReset?'<b style="color:var(--bad)">Toca outra vez para apagar o progresso deste teste</b>':'Recomeçar este teste do zero'}</button>`}

function qview(){const id=quiz.ids[quiz.i],q=QS[id],P=TOPICS[q[0]];
 const multi=isMulti(q),vf=isVF(q);quiz.sel=quiz.sel||[];
 if(!quiz.opts)quiz.opts=vf?['Verdadeiro','Falso']:multi?shuffle([...q[3],...q[4]]):shuffle([q[3],...q[4]]);
 const n=quiz.ids.length,done=quiz.answered!==null,good=done&&quiz.good,sv=S.saved.includes(id);
 const isRight=o=>multi?q[3].includes(o):o===q[3];
 const opts=quiz.opts.map((o,j)=>{const picked=multi?quiz.sel.includes(j):j===quiz.answered;let c='';
  if(done){if(isRight(o))c=multi&&!picked?'right miss':'right';else if(picked)c='wrong'}else if(multi&&picked)c='sel';
  const lab=vf?o[0]:multi?(picked?'✓':''):'ABCD'[j];
  return `<button class="opt ${c} ${multi?'chk':''}" ${done?'disabled':''} onclick="answer(${j})"><span class="l">${lab}</span><span>${esc(o)}</span></button>`}).join('');
 const fb=done?`<div class="fb ${good?'ok':'no'}" id="fb"><h3>${good?'Certo':'Errado'}</h3>${good?'':`<p>Resposta certa: <b>${esc(ansTxt(q))}</b></p>`}<p>${esc(q[5])}</p></div>${q[7]?`<div class="dv"><h3>Atenção: há dúvida nesta pergunta</h3><p>${esc(q[7])}</p></div>`:''}
  <button class="big" onclick="next()">${quiz.i+1<n?'Seguinte':'Ver resultado'}</button>`:(multi?`<button class="big" onclick="confirmMulti()" ${quiz.sel.length?'':'disabled style="opacity:.45"'}>Confirmar</button>`:'');
 const hint=multi?`<p class="multihint">Pode haver mais do que uma certa. Seleciona todas e confirma.</p>`:'';
 return `<div class="qtop"><button class="back" aria-label="Sair" onclick="go(backTo)">×</button><div class="prog"><i style="width:${(quiz.i+(done?1:0))/n*100}%"></i></div><span class="count">${quiz.i+1}/${n}</span>
 <button class="bm ${sv?'on':''}" aria-label="${sv?'Remover das guardadas':'Guardar pergunta'}" onclick="toggleSave()"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 3h12v18l-6-4-6 4z" fill="${sv?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button></div>
 <div class="card"><span class="qchip">${esc(P.n)}</span><div class="qtext">${esc(q[2])}</div>${q[6]&&FIGS[q[6]]?`<div class="fig">${FIGS[q[6]]}</div>`:''}${needsCalc(q)?`<button class="calcbtn" onclick="toggleCalc()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h4"/></svg>${calc.open?'Fechar calculadora':'Calculadora'}</button>${calc.open?calcHTML():''}`:''}${hint}<div class="opts">${opts}</div></div>${fb}
 <p class="keys">Teclado: 1–4 para responder · Enter para avançar</p>`}

function result(){const n=quiz.ids.length,p=Math.round(quiz.ok/n*100);
 const errs=quiz.wrongs.map(i=>QS[i]);
 const lv=quiz.lv,nxt=lv?lv.i+2:0,last=lv&&lv.i===T_().keys.length-1;
 const lvTxt=!lv?'':lv.unl?`<b>Nível ${nxt} desbloqueado.</b>`:!lv.full?(last||LV().u>lv.i?'Para dominar o nível, o objetivo são 2 rondas seguidas a 100%.':`Para desbloquear o Nível ${nxt} são precisas 2 rondas seguidas a 100%. A contagem recomeça.`):lv.streak>=2?(last?'Último nível dominado: 2 rondas seguidas a 100%.':'Nível dominado: 2 rondas seguidas a 100%.'):(last||LV().u>lv.i?'Primeira ronda a 100%. Falta mais uma seguida para dominar o nível.':`Primeira ronda a 100%. Mais uma seguida desbloqueia o Nível ${nxt}.`);
 return `<div class="card" style="align-items:center;text-align:center"><span class="muted small">${esc(tname(quiz.t))}</span><div class="score">${p}%</div><p class="muted" style="font-size:18px;font-weight:600">${quiz.ok}/${n} certas</p>${lvTxt?`<p class="small" style="margin:4px 0 0">${lvTxt}</p>`:''}</div>
 ${errs.length?`<div class="card"><h3>Para rever (${errs.length})</h3>${errs.map(q=>`<div class="err"><span>${esc(q[2])}</span><span class="a">${esc(ansTxt(q))}</span></div>`).join('')}</div>`:''}
 ${lv&&lv.unl?`<button class="big" onclick="start('lvl:${cur}:${lv.i+1}')">Começar o Nível ${nxt}</button><button class="ghost" onclick="start('${quiz.t}')">Repetir este nível</button>`:`<button class="big" onclick="start('${quiz.t}')">${lv?'Nova ronda deste nível':'Nova ronda'}</button>`}
 ${S.wrong.filter(inCur).length?`<button class="ghost" onclick="start('${ERR()}')">Rever os meus erros (${S.wrong.filter(inCur).length})</button>`:''}
 <button class="ghost" onclick="go(backTo)">${backTo==='unit'?'Voltar à unidade':T_().levels?'Voltar aos níveis':'Voltar às matérias'}</button>`}

function prog(){const T=T_();const TK=[...T.keys,ALL(),ERR(),SAV()];
 const H=S.history.filter(x=>x.t.startsWith('lvl:'+cur+':')||x.t.startsWith('unit:'+cur+':')||TK.includes(x.t)||(x.t.startsWith('sub:')&&T.keys.includes(x.t.slice(4).split(':')[0])));
 if(!H.length)return `${header("go('test')",'Evolução')}<div class="card empty">Ainda não há rondas feitas neste teste.</div>`;
 const pcts=H.map(x=>Math.round(x.c/x.n*100)),avg=Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length);
 const last=H.slice(-15),W=320,Hh=150,pl=32,pr=10,pt=10,pb=22;
 const xs=i=>pl+(last.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(last.length-1)),ys=v=>pt+(100-v)/100*(Hh-pt-pb);
 const pts=last.map((x,i)=>[xs(i),ys(Math.round(x.c/x.n*100))]);
 const css=getComputedStyle(document.documentElement),ac=css.getPropertyValue('--accent').trim(),ln=css.getPropertyValue('--line').trim(),mu=css.getPropertyValue('--muted').trim();
 const grid=[0,50,100].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${ys(v)}" y2="${ys(v)}" stroke="${ln}"/><text x="${pl-6}" y="${ys(v)+4}" font-size="10" text-anchor="end" fill="${mu}">${v}%</text>`).join('');
 const chart=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Percentagem de acertos nas últimas rondas">${grid}<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${ac}" stroke-width="2"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:3}" fill="${ac}"/>`).join('')}<text x="${pl}" y="${Hh-5}" font-size="10" fill="${mu}">mais antiga</text><text x="${W-pr}" y="${Hh-5}" font-size="10" text-anchor="end" fill="${mu}">última</text></svg>`;
 const rows=T.keys.map(k=>{const P=TOPICS[k];let ok=0,n=0;for(const [kk,v] of Object.entries(S.sub))if(kk.startsWith(k+':')){ok+=v[0];n+=v[1]}
  if(!n)return `<div class="trow" style="--c:${P.c}"><span class="nm">${P.n}</span><span class="v">sem respostas</span><div class="bar"><i style="width:0"></i></div></div>`;
  const p=Math.round(ok/n*100),st=stats(k);const tr=st&&st.prev!==null?(st.last>st.prev?' · a subir':st.last<st.prev?' · a descer':''):'';
  return `<div class="trow" style="--c:${P.c}"><span class="nm">${P.n}</span><span class="v">${p}% (${n})${tr}</span><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('');
 const weak=Object.entries(S.sub).filter(([k,v])=>v[1]>=3&&SUBN[k]&&T.keys.includes(k.split(':')[0])).map(([k,v])=>[k,Math.round(v[0]/v[1]*100)]).filter(x=>x[1]<80).sort((a,b)=>a[1]-b[1]).slice(0,5);
 const f5=pcts.slice(0,5),l5=pcts.slice(-5),evo=pcts.length>=6?Math.round(l5.reduce((a,b)=>a+b,0)/l5.length-f5.reduce((a,b)=>a+b,0)/f5.length):null;
 return `${header("go('test')",'Evolução')}
 <div class="card"><div class="kpis"><div class="kpi"><b>${H.length}</b><span>rondas</span></div><div class="kpi"><b>${avg}%</b><span>média</span></div><div class="kpi"><b>${fmtT(S.time[cur]||0).replace('menos de 1 min','<1 min')}</b><span>estudo</span></div></div>
 <p class="small muted">${evo!==null?`Últimas 5 rondas vs. primeiras 5: <b style="color:var(--ink)">${evo>0?'+':''}${evo} pontos percentuais</b>.`:'Com 6 ou mais rondas aparece a comparação entre as primeiras e as últimas.'}</p></div>
 <div class="card chart"><h3>Acertos nas últimas ${last.length} rondas</h3>${chart}</div>
 <div class="card"><h3>Por matéria</h3>${rows}</div>
 <div class="card"><h3>Pontos fracos</h3>${weak.length?`<p class="muted small">Abaixo de 80% (com pelo menos 3 respostas). Toca para treinar só isso.</p>${weak.map(([k,p])=>`<button class="wk" onclick="start('sub:${k}')"><span>${esc(SUBN[k])}</span><span>${p}% · treinar</span></button>`).join('')}`:'<p class="muted small">Nada abaixo de 80% (com pelo menos 3 respostas).</p>'}</div>`}

render();
</script>
