<style>
/* Sóbrio, uma coluna, pensado para telemóvel. Tema claro e escuro. */
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#18202e; --muted:#5d6676; --line:#e1e4ea; --soft:#eef1f5;
  --accent:#1d2b44; --accent-ink:#ffffff; --accent-soft:#e6ebf3;
  --ok:#1b7f4b; --ok-soft:#e5f3eb; --bad:#c0392b; --bad-soft:#fbeae8;
  --font:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --card:#171e29; --ink:#e7eaf0; --muted:#98a1b1; --line:#283244; --soft:#1e2734;
  --accent:#8fb0e8; --accent-ink:#0f141c; --accent-soft:#1f2b3e;
  --ok:#4cc38a; --ok-soft:#14291f; --bad:#ef7a6c; --bad-soft:#31191a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto;padding-block:max(16px,env(safe-area-inset-top,0px)) 48px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;font-weight:700}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{cursor:default}
.muted{color:var(--muted)} .small{font-size:13px}
.top{display:flex;align-items:center;gap:12px;min-height:40px}
.top h2{min-width:0;flex:1}
.back{width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:20px;display:grid;place-items:center;flex:none;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hello h1{font-size:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subj{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:104px}
.subj .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.subj h3{font-size:15px}
.subj .tag{font-size:12px;color:var(--muted)}
.subj.off{opacity:.5}
.subj.on:hover{border-color:var(--muted)}
.testcard{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:4px}
.testcard .t{font-size:19px;font-weight:700}
.testcard .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.cd{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600}
.cd b{min-width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:18px;font-variant-numeric:tabular-nums}
.cd.hot{border-color:var(--bad)} .cd.hot b{background:var(--bad);color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.topic{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--c);border-radius:12px;padding:12px 14px;width:100%}
.topic>div{flex:1;min-width:0}
.topic .n{font-weight:600}
.chhint{font-size:11px;color:var(--muted);text-align:center;margin-top:2px}
.topic.lock{opacity:.45;border-style:dashed}
.fig .pwx{display:flex;align-items:center;gap:8px;font-size:15px;align-self:center}.fig .pwx .pwb{width:9px;align-self:stretch;border:2px solid var(--ink);border-right:0;border-radius:9px 0 0 9px}.fig .pwx table{width:auto}.fig .pwx td{border:0;padding:3px 12px 3px 0;text-align:left;white-space:nowrap}
.fig table.tbx td{text-align:center;padding:5px 4px}.fig table.tbx td:first-child{font-weight:600}
.topic .s{font-size:13px;color:var(--muted)}

.topic .best b{color:var(--ink);font-size:14px}
.cov{display:flex;align-items:center;gap:8px;margin-top:6px}

.bar{flex:1;height:6px;border-radius:6px;background:var(--soft);overflow:hidden}

.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pill2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.pill2 button span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.pill2 button:disabled{opacity:.45}
.prep .pp{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.prep .bar{height:8px}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.bm{width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none}
.bm.on{color:var(--accent);border-color:var(--accent)}
.qchip{align-self:flex-start;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.qtext{font-size:19px;font-weight:600;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:500;display:flex;gap:12px;align-items:center;width:100%}
.opt .l{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;color:var(--muted)}
.opt:not(:disabled):hover{border-color:var(--muted)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)} .opt.right .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)} .opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;border:1.5px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)} .fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb h3{font-size:16px} .fb.ok h3{color:var(--ok)} .fb.no h3{color:var(--bad)}
.big{width:100%;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px;font-weight:700;font-size:17px;text-align:center}
.ghost{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;font-weight:600;text-align:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)} .opt.sel .l{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.chk .l{border-radius:5px}
.opt.right.miss{background:var(--card);border-style:dashed}
.dv{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;border:1.5px solid #c98a12;background:rgba(201,138,18,.12)}
.dv h3{font-size:15px;color:#a86f00}
@media (prefers-color-scheme:dark){.dv h3{color:#f0b54a}}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.mode .em{font-size:40px;line-height:1.1}.mode b{font-size:17px}.mode span:last-child{font-size:12px;color:var(--muted)}
.mode button:only-child{grid-column:1/-1}
.sdots{display:flex;gap:5px;justify-content:center}.sdots i{width:22px;height:5px;border-radius:5px;background:var(--line)}.sdots i.on,.sdots i.done{background:var(--c)}.sdots i.done{opacity:.45}
.snav{display:grid;grid-template-columns:1fr 2fr;gap:8px}.snav .ghost,.snav .big{width:100%}
.scard h2{font-size:21px}.sbody{display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.55}
.sbody p{margin:0}.sbody .note{font-size:13px;color:var(--muted)}
.sbody .quote{border-left:3px solid var(--accent);padding:6px 12px;font-style:italic;color:var(--muted)}.sbody .quote span{display:block;font-style:normal;font-size:12px;margin-top:4px}
.sbody .steps{display:flex;flex-direction:column;gap:8px}.sbody .steps div,.sbody .box,.sbody .two>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sbody .steps b,.sbody .box>b,.sbody .two b{display:block;margin-bottom:2px}
.sbody .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
@media (max-width:420px){.sbody .two{grid-template-columns:1fr}}
.sbody .box p{margin:4px 0}
.sbody .b1>b{color:#2d5fa8}.sbody .b2>b{color:#6b4fa0}.sbody .b3>b{color:#2f7d5b}
@media (prefers-color-scheme:dark){.sbody .b1>b{color:#8fb0e8}.sbody .b2>b{color:#b9a3e6}.sbody .b3>b{color:#6fd3a0}}
.sbody .tag{display:inline-block;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 10px}
.sbody .ex{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}.sbody .ex .cc{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;font-weight:600}
.sbody .warn{border:1.5px solid #c98a12;background:rgba(201,138,18,.12);border-radius:10px;padding:10px 12px}
.sbody .case{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;position:relative}
.sbody .case>span{align-self:flex-start;font-size:11px;font-weight:700;color:#fff;border-radius:99px;padding:2px 9px}
.sbody .case.ok{border-color:var(--ok)}.sbody .case.ok>span{background:var(--ok)}.sbody .case.mid{border-color:#c98a12}.sbody .case.mid>span{background:#b5651d}.sbody .case.no{border-color:var(--bad)}.sbody .case.no>span{background:var(--bad)}
.sbody table.st{width:100%;border-collapse:collapse;font-size:14px}.sbody .st td,.sbody .st th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}.sbody .st th{font-size:12px;color:var(--muted)}
.sbody .st .k{font-weight:700;text-align:center;font-size:16px}.sbody .st .g{color:var(--ok);font-weight:600}.sbody .st .r{color:var(--bad);font-weight:600}
.sbody .tt td,.sbody .tt th{text-align:center}.sbody .tt .cap{text-align:left;font-size:12px;color:var(--muted);border:0}
.sbody .tts{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.sbody .formula{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 12px;text-align:center;font-weight:600}
.sbody ul,.sbody ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sbody ul.ck{list-style:none;padding:0}.sbody .ck li::before{font-weight:700;margin-right:8px}.sbody .ck .y::before{content:'✓';color:var(--ok)}.sbody .ck .n::before{content:'✗';color:var(--bad)}
.sbody .aeio{display:flex;flex-direction:column;gap:8px}.sbody .aeio>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 54px;position:relative;font-size:14px}
.sbody .aeio span{position:absolute;left:12px;top:10px;width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:18px}
.sbody .aeio i,.sbody .sq i{display:block;font-size:12px;color:var(--muted)}
.sbody .sq{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sbody .sq .c{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px}
.sbody .sq span{display:block;font-size:24px;font-weight:700;color:var(--accent)}
.multihint{font-size:13px;color:var(--muted);margin-top:-4px}
.keys{font-size:12px;color:var(--muted);text-align:center}
@media (hover:none){.keys{display:none}}
/* resultado / evolução */
.score{font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--soft);border-radius:10px;padding:10px;text-align:center}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.trow .bar{grid-column:1/-1;height:8px}
.trow .nm{font-weight:600;font-size:14px;min-width:0}
.trow .v{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wk{display:flex;justify-content:space-between;gap:8px;background:var(--bad-soft);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500;width:100%}
.wk span:last-child{white-space:nowrap;color:var(--bad);font-weight:600}
.err{border-top:1px solid var(--line);padding-top:10px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.err:first-of-type{border-top:0;padding-top:0}
.err .a{color:var(--ok);font-weight:600}
.chart svg{width:100%;height:auto;display:block}
.empty{text-align:center;color:var(--muted)}
.calcbtn{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:600;color:var(--accent);border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px}
.calc{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.calc .disp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:right;min-height:58px;display:flex;flex-direction:column;justify-content:flex-end}
.calc .ex{font-size:14px;color:var(--muted);word-break:break-all;min-height:18px}
.calc .rs{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;word-break:break-all}
.calc .keys4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc .keys4 button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 0;font-size:18px;font-weight:600;text-align:center}
.calc .keys4 button.op{color:var(--accent)}
.calc .keys4 button.eq{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.fig{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.fig .ft{font-weight:600;font-size:13px}
.fig .poem{font-style:italic;font-size:14px;line-height:1.5}
.fig .poem .r{padding-left:22px}
.fig .poem .st{margin-bottom:8px}
.ttc td,.ttc th{text-align:center!important}
.fig table.per{border-collapse:collapse;font-size:10px;width:100%}.fig .per th{font-weight:600;color:var(--muted);padding:1px 2px;text-align:center}.fig .per th:first-child,.fig .per .pn{text-align:left;font-size:10px;padding-right:6px;white-space:normal;min-width:90px;border:0}.fig .per td{border:0}
.tl td,.tl th{text-align:left!important;vertical-align:top}
.fig p{margin:0;font-size:14px;line-height:1.55}
.fig .fs{font-size:11px;color:var(--muted)}
.fig table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.fig th,.fig td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}
.fig th:first-child,.fig td:first-child{text-align:left}
.fig th{font-weight:600;color:var(--muted);font-size:12px}
.fbar{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center}
.fbar .t{height:14px;border-radius:4px;background:var(--line);overflow:hidden}.fbar .t i{display:block;height:100%;background:var(--accent)}
.fbar span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

</style>

<div class="app" id="app"></div>
<script>
// Português — 1.º teste (10.º ano). Fonte: matriz do teste e ficha informativa 2 do manual.
// [tópico, subtópico, pergunta, resposta certa, [erradas], explicação]
const QS_PT = [
["p1","epoca","A poesia trovadoresca galego-portuguesa desenvolveu-se aproximadamente entre…","finais do século XII e meados do século XIV",["o início do século X e meados do século XI","o início do século XV e o final do século XVI","meados do século XIV e o final do século XV"],"Período trovadoresco: de finais do séc. XII a meados do séc. XIV."],
["p1","epoca","As cantigas trovadorescas foram escritas em…","galego-português",["latim","português moderno","provençal"],"A língua comum da Galiza e do norte de Portugal na época: o galego-português."],
["p1","epoca","A lírica trovadoresca tem uma forte influência da poesia…","provençal",["italiana do Renascimento","castelhana do século XVI","árabe do Oriente"],"Os trovadores provençais influenciaram a poesia da Península; as peregrinações a Santiago e as cortes ajudaram a difundi-la. Resposta completa: provençal (sul de França)."],
["p1","epoca","Um dos caminhos por onde a poesia provençal chegou à Península Ibérica foi…","as peregrinações a Santiago de Compostela",["as viagens marítimas para a Índia","a imprensa","as universidades do século XVI"],"Peregrinos, jograis e nobres circulavam pelo Caminho de Santiago e levavam a poesia de corte em corte."],
["p1","epoca","Um rei português que foi também trovador é…","D. Dinis",["D. Afonso Henriques","D. Manuel I","D. João II"],"D. Dinis (séc. XIII–XIV) é um dos trovadores mais importantes, com cantigas de amor e de amigo."],
["p1","canc","As cantigas chegaram até nós sobretudo através de…","cancioneiros",["livros impressos na época dos trovadores","gravações feitas pelos próprios jograis","crónicas oficiais dos reis de Portugal"],"Os cancioneiros reuniram as cantigas: Cancioneiro da Ajuda, da Biblioteca Nacional e da Vaticana. Resposta completa: cancioneiros (coletâneas manuscritas)."],
["p1","canc","Qual destes NÃO é um cancioneiro da lírica galego-portuguesa?","Cancioneiro Geral",["Cancioneiro da Ajuda","Cancioneiro da Vaticana","Cancioneiro da Biblioteca Nacional"],"O Cancioneiro Geral (Garcia de Resende, 1516) é posterior e não pertence à lírica trovadoresca."],
["p1","canc","O Cancioneiro da Ajuda reúne quase só…","cantigas de amor",["cantigas de amigo","cantigas de escárnio","romances"],"O da Ajuda tem sobretudo cantigas de amor; as cantigas de amigo estão nos da Vaticana e da Biblioteca Nacional."],
["p1","canc","Os Cancioneiros da Vaticana e da Biblioteca Nacional são…","cópias feitas em Itália no século XVI",["originais escritos pelos trovadores","livros impressos em Lisboa","cópias feitas no século XX"],"Ambos foram copiados em Itália no séc. XVI e preservam cantigas de amigo, de amor e satíricas."],
["p1","autores","Na época, as cantigas eram feitas para ser…","cantadas, com acompanhamento musical",["lidas em silêncio","apenas escritas em cancioneiros","declamadas sem música"],"Cantiga = texto para cantar. Poesia e música eram inseparáveis."],
["p1","autores","O trovador era, geralmente…","um nobre que compunha cantigas",["um músico pago que só tocava instrumentos","um monge copista","um camponês que cantava nas feiras"],"Trovador: autor de condição nobre, que compunha letra e música."],
["p1","autores","O jogral era…","um intérprete de condição inferior, que cantava e tocava",["um nobre que compunha, mas nunca cantava em público","o rei que protegia e pagava aos trovadores da corte","o monge que copiava as cantigas para os cancioneiros"],"Jogral: executante, de origem popular, que atuava a troco de pagamento."],
["p1","autores","Os géneros da poesia trovadoresca são…","lírica (cantigas de amor e de amigo) e satírica (escárnio e maldizer)",["épica (feitos heroicos) e dramática (autos e farsas)","lírica (só cantigas de amigo) e narrativa (romances)","satírica (sonetos) e religiosa (cantigas de santa)"],"Lírica: amor e amigo. Satírica: escárnio e maldizer."],
["p1","autores","A cantiga de amigo tem origem…","numa antiga tradição peninsular de canções em voz feminina",["exclusivamente na poesia dos trovadores provençais","na poesia latina clássica, estudada nos mosteiros","nos romances populares castelhanos do século XVI"],"A cantiga de amor segue o modelo provençal; a de amigo vem de uma tradição peninsular mais antiga."],
["p1","autores","Quem escrevia as cantigas de amigo?","trovadores que davam voz a uma donzela",["mulheres da corte que falavam dos seus amores","apenas jograis anónimos, sem qualquer formação","monges que as copiavam nos mosteiros"],"O autor é um homem, mas o sujeito poético é feminino. Resposta completa: trovadores (homens) que davam voz a uma donzela."],
["p1","amor","Na cantiga de AMOR, o sujeito poético é…","um homem que se dirige à \"senhor\"",["uma donzela que fala do amigo","a mãe da donzela","a natureza personificada"],"Cantiga de amor: voz masculina, dirige-se à \"mia senhor\" — é o contrário da cantiga de amigo."],
["p1","amor","O ambiente típico da cantiga de amor é…","cortês, aristocrático",["rural e popular","marítimo e costeiro","religioso, de romaria"],"Amor: ambiente da corte. Amigo: ambiente rural/natural, mais popular."],
["p1","amor","Na cantiga de amor, a \"coita\" é…","o sofrimento amoroso",["a alegria do encontro","a dança","o nome da amada"],"Coita = sofrimento por amor. Também aparece na cantiga de amigo, causada pela ausência do amigo."],
["p2","suj","Na cantiga de amigo, o sujeito poético é…","uma donzela",["um cavaleiro","um trovador que fala de si","um rei"],"Voz feminina: a donzela (jovem apaixonada) fala do seu \"amigo\"."],
["p2","suj","Na cantiga de amigo, a palavra \"amigo\" significa…","namorado, amado",["colega","irmão","senhor feudal"],"\"Amigo\" = namorado. Variantes nas cantigas: \"amado\", \"meu amigo\"."],
["p2","suj","A quem se pode dirigir a donzela nas cantigas de amigo?","à mãe, às amigas, ao amigo ou à natureza",["apenas ao rei, de quem o amigo é vassalo","apenas a Deus, em forma de oração","apenas à \"senhor\", a dama da corte"],"Interlocutores frequentes: mãe, amigas, irmã, o amigo, e a natureza (ondas, flores, aves…)."],
["p2","suj","O interlocutor é…","a entidade a quem o sujeito poético se dirige",["o trovador que escreveu a cantiga","o jogral que canta a cantiga em público","a personagem de quem o sujeito poético fala"],"Sujeito poético = quem fala; interlocutor = a quem fala."],
["p2","suj","Quando a donzela fala com as ondas ou as flores, estes elementos funcionam como…","confidentes",["obstáculos","inimigos","narradores"],"A natureza personificada é confidente: ouve os desabafos e às vezes responde."],
["p2","suj","Ao falar com as ondas como se fossem pessoas, a donzela recorre à…","personificação (e à apóstrofe)",["hipérbole (e à comparação)","comparação (e à ironia)","ironia (e à metáfora)"],"Personificação: atribuir características humanas a seres não humanos. Apóstrofe: interpelar diretamente."],
["p2","suj","A apóstrofe é…","a interpelação direta de alguém ou de algo",["a repetição de palavras no início dos versos","um exagero","uma comparação com \"como\""],"Ex.: \"Ondas do mar de Vigo, / se vistes meu amigo?\" — a donzela chama as ondas."],
["p2","sent","O tema mais frequente nas cantigas de amigo é…","a ausência do amigo e a saudade",["a guerra entre reinos","a crítica a pessoas da corte","o elogio da senhor"],"Temas: ausência, saudade, espera, ansiedade, alegria do encontro, ciúme, zanga."],
["p2","sent","Qual destes sentimentos é típico da donzela na cantiga de amigo?","saudade e ansiedade pela espera",["desprezo e raiva pelo amigo","indiferença perante a partida","medo e ódio da natureza"],"A donzela sofre com a ausência (coita), espera, receia que ele não volte."],
["p2","sent","A \"coita\" da donzela é causada, normalmente, por…","a ausência ou o afastamento do amigo",["a pobreza da sua família","a doença grave do rei","uma guerra que o reino perdeu"],"O amigo partiu (para o mar, para o fossado, para longe) e ela sofre."],
["p2","sent","Para além da tristeza, a cantiga de amigo pode exprimir…","alegria, por exemplo pela notícia do regresso do amigo",["apenas raiva contra a mãe que a proíbe de sair","apenas medo da morte e do mar","apenas devoção religiosa, sem qualquer referência ao amor"],"Há cantigas alegres: a donzela feliz porque o amigo volta ou porque vai ao seu encontro."],
["p2","esp","O espaço típico das cantigas de amigo é…","natural e campestre",["o palácio e os salões da corte","a cidade grande e os seus mercados","o interior das igrejas e dos mosteiros"],"Ambiente rural, ao ar livre: fonte, rio, mar, campos, ermidas. Resposta completa: natural e campestre (fontes, rios, mar, campos)."],
["p2","esp","A linguagem das cantigas de amigo é…","simples, com muitas repetições",["erudita e cheia de latinismos","muito complexa e difícil","técnica"],"Linguagem simples, popular, com repetições — fácil de memorizar e de cantar."],
["p2","esp","As cantigas de amigo são, em geral…","curtas, com estrofes de dois ou três versos e refrão",["longas, com centenas de versos e várias personagens","escritas em prosa, sem rima nem refrão","sonetos de 14 versos, com rima interpolada"],"Estrofes breves (dísticos, muitas vezes) + refrão."],
["p2","doc","Dizer que uma cantiga tem \"valor documental\" significa que…","dá informação sobre a vida e os costumes da época",["é um documento oficial assinado pelo rei","foi escrita em pergaminho e guardada num arquivo","conta acontecimentos totalmente inventados"],"As cantigas mostram costumes, espaços, festas, trabalhos e a condição da mulher na Idade Média."],
["p2","doc","As cantigas de romaria documentam…","as festas e peregrinações a santuários",["as batalhas navais contra os mouros","as leis do reino e os tribunais","a vida quotidiana dentro dos mosteiros"],"Romarias eram ocasiões de convívio e de encontro entre namorados."],
["p2","doc","As cantigas em que o amigo partiu para o \"fossado\" mostram…","que os homens partiam em expedições militares ao serviço do rei",["que os homens iam estudar para universidades longínquas","que as mulheres também partiam para a guerra","que eram comuns as viagens de lazer pelo reino"],"Fossado = expedição militar. A cantiga documenta a vida das mulheres que ficavam à espera."],
["p2","doc","A referência a lugares reais (Vigo, San Simón, Lisboa) contribui para…","o valor documental da cantiga",["a rima e a métrica da cantiga","a construção do refrão","o tom satírico da cantiga"],"Lugares concretos ligam a cantiga à realidade geográfica e social da época."],
["p2","doc","As cantigas de amigo mostram a mulher medieval muitas vezes…","dependente da autorização da mãe e à espera do amigo",["a governar o reino na ausência do rei","a partir para a guerra ao lado do amigo","a viajar sozinha e livremente pelo mundo"],"A mãe aparece como figura de autoridade que autoriza ou proíbe o encontro."],
["p2","tipos","Uma cantiga de amigo passada junto ao mar chama-se…","barcarola ou marinha",["bailia ou bailada","alba ou alvorada","cantiga de romaria"],"Barcarola/marinha: o mar e as ondas como cenário e confidentes."],
["p2","tipos","Uma cantiga de amigo em que as donzelas dançam chama-se…","bailia",["barcarola","alba","cantiga de romaria"],"Bailia ou bailada: convite à dança."],
["p2","tipos","Uma cantiga de amigo passada ao amanhecer chama-se…","alba ou alvorada",["bailia","barcarola","cantiga de romaria"],"Alba/alvorada: o raiar do dia, muitas vezes a separação dos namorados."],
["p2","tipos","Uma cantiga de amigo em que a donzela vai a um santuário chama-se…","cantiga de romaria",["barcarola ou marinha","alba ou alvorada","bailia ou bailada"],"Romaria: ida a uma igreja/ermida em festa, ocasião para ver o amigo."],
["p2","tipos","\"Bailemos nós ja todas tres, ai amigas\" é o início de uma…","bailia",["barcarola","alba","cantiga de amor"],"O convite à dança (\"bailemos\") identifica a bailia."],
["p3","par","O paralelismo consiste em…","repetir ideias e versos de estrofe para estrofe, com pequenas variações",["usar rimas diferentes em cada estrofe, sem repetir versos","contar uma história longa, com princípio, meio e fim","evitar repetições, para que cada estrofe traga ideias novas"],"Paralelismo: estrofes aos pares que dizem quase o mesmo, mudando poucas palavras."],
["p3","par","No paralelismo, as estrofes organizam-se muitas vezes…","aos pares, mudando só a palavra final do verso",["de forma totalmente diferente umas das outras","em quadras soltas, sem ligação entre si","por ordem alfabética do primeiro verso"],"Ex.: \"amigo\" / \"amado\"; \"Vigo\" / \"levado\"."],
["p3","par","Em \"se vistes meu amigo?\" / \"se vistes meu amado?\", a troca de \"amigo\" por \"amado\" é um exemplo de…","paralelismo",["leixa-pren","refrão","hipérbole"],"Mesma frase, palavra final diferente (sinónima) — paralelismo."],
["p3","par","O leixa-pren (\"deixa-prende\") consiste em…","retomar o 2.º verso de uma estrofe no início de outra",["repetir o refrão no início de cada estrofe seguinte","acabar todas as estrofes com a mesma palavra rimada","mudar de interlocutor a cada nova estrofe"],"O verso \"deixado\" numa estrofe é \"prendido\" mais à frente."],
["p3","par","Em \"Ondas do mar de Vigo\", o verso \"se vistes meu amigo?\" (estrofe 1) reaparece no início da estrofe 3. Isto é…","leixa-pren",["refrão","rima interna","apóstrofe"],"2.º verso da estrofe 1 → 1.º verso da estrofe 3: leixa-pren.","c_ondas"],
["p3","par","Qual é o efeito principal do paralelismo?","dar musicalidade e insistir na ideia, que avança devagar",["tornar a cantiga mais curta e fácil de escrever","esconder o sentimento da donzela ao ouvinte","criar suspense sobre o final da história"],"A repetição com variação cria ritmo, facilita a memorização e intensifica o sentimento."],
["p3","par","A repetição dos mesmos versos ajudava também a…","memorizar a cantiga, que circulava sobretudo oralmente",["imprimir mais depressa os cancioneiros","traduzir a cantiga para latim","encurtar o texto para caber no pergaminho"],"Numa cultura oral, a repetição facilitava a memória de quem cantava e de quem ouvia."],
["p3","ref","O refrão é…","um verso ou conjunto de versos repetidos no fim de cada estrofe",["o primeiro verso de cada cantiga, que lhe dá o título","o verso que muda de estrofe para estrofe","a última estrofe, onde se resume a história"],"Refrão: repetição fixa no fim das estrofes."],
["p3","ref","Em \"Ondas do mar de Vigo\", o refrão é…","\"E ai Deus, se verrá cedo!\"",["\"Ondas do mar de Vigo\"","\"se vistes meu amigo?\"","\"por que ei gran cuidado?\""],"O verso repetido no fim de todas as estrofes.","c_ondas"],
["p3","ref","Em \"Ai flores, ai flores do verde pino\", o refrão é…","\"Ai Deus, e u é?\"",["\"se sabedes novas do meu amigo\"","\"Ai flores, ai flores do verde ramo\"","\"que é san' e vivo\""],"\"e u é?\" = \"e onde está?\"","c_flores"],
["p3","ref","Uma função habitual do refrão é…","sintetizar e intensificar o sentimento dominante",["introduzir uma personagem nova em cada estrofe","contar o desfecho da história ao ouvinte","mudar o tema da cantiga a meio"],"O refrão concentra o estado de espírito (ansiedade, saudade) e reforça-o pela repetição."],
["p3","ref","A interjeição \"ai\" no refrão exprime…","emoção",["indiferença perante a situação","uma ordem dada ao interlocutor","uma comparação com a natureza"],"\"Ai\" é marca de emotividade: dor, ansiedade, desejo. Resposta completa: emoção (lamento, ansiedade)."],
["p3","ref","O sentido do refrão pode mudar ao longo da cantiga porque…","os versos à sua volta mudam o contexto",["as palavras do refrão mudam sempre em cada estrofe","o refrão deve ser lido de trás para a frente","depende apenas da voz do jogral que o canta"],"As palavras são iguais, mas a situação muda — por isso o refrão ganha novos sentidos. Resposta completa: os versos à sua volta mudam o contexto (ex.: da espera à aflição)."],
["p3","prog","Progressão temática é…","a evolução do assunto e do sentimento ao longo da cantiga",["a numeração das estrofes ao longo da cantiga","a mudança de autor a meio da cantiga","a passagem do latim ao português nas cantigas"],"Apesar das repetições, a cantiga avança: a situação e o sentimento mudam."],
["p3","prog","Na cantiga \"Sedia-m' eu na ermida de Sam Simiom\", a progressão vai…","da espera tranquila do amigo à certeza da morte no mar",["da tristeza da partida à alegria do casamento","do riso com as amigas à zanga com a mãe","da dança na romaria à oração na ermida"],"Espera → cerco das ondas → sem barqueiro → \"morrerei fremosa no mar maior\".","c_ermida"],
["p3","prog","Na cantiga \"Sedia-m' eu na ermida…\", os tempos verbais mostram a progressão porque passam…","do passado ao presente e ao futuro",["do futuro ao passado","sempre no presente","do imperativo ao conjuntivo"],"\"cercarom\" (passado) → \"nom ei\" (presente) → \"morrerei\" (futuro).","c_ermida"],
["p3","prog","Em \"Ai flores, ai flores do verde pino\", a progressão vai…","das perguntas ansiosas da donzela à resposta das flores",["da alegria do encontro à notícia da morte do amigo","do convite à dança à zanga entre as amigas","do elogio do amigo à crítica da sua mentira"],"1.ª parte: pergunta e queixa; 2.ª parte: as flores respondem que ele está \"san' e vivo\".","c_flores"],
["p3","prog","Mesmo depois da resposta das flores, o refrão \"Ai Deus, e u é?\" mostra que…","a dúvida e a saudade da donzela persistem",["a donzela deixou de se interessar pelo amigo","as flores lhe deram a notícia da morte do amigo","a cantiga acaba com a zanga entre os dois"],"O refrão mantém a pergunta até ao fim: ela só sossega quando o vir.","c_flores"],
["p4","ondas","\"Ondas do mar de Vigo, / se vistes meu amigo?\" — quem fala?","uma donzela",["as ondas do mar","o amigo ausente","a mãe da donzela"],"\"meu amigo\" → voz feminina: a donzela.","c_ondas"],
["p4","ondas","\"Ondas do mar de Vigo, / se vistes meu amigo?\" — a quem se dirige?","às ondas do mar",["ao amigo","a Deus","à mãe"],"A donzela interpela as ondas (apóstrofe/personificação).","c_ondas"],
["p4","ondas","Quem é o autor de \"Ondas do mar de Vigo\"?","Martim Codax",["D. Dinis","Meendinho","Pero Meogo"],"Martim Codax, jogral galego; as suas cantigas estão no Pergaminho Vindel, com música.","c_ondas"],
["p4","ondas","\"Ondas do mar levado\" — \"levado\" significa…","agitado, encapelado",["calmo, sereno","distante, longínquo","gelado, frio"],"Mar levado = mar alto, agitado.","c_ondas"],
["p4","ondas","\"por que ei gran cuidado\" exprime…","preocupação",["alegria","desprezo","cansaço físico"],"\"cuidado\" = preocupação, inquietação.","c_ondas"],
["p4","ondas","\"o por que eu sospiro\" exprime…","saudade e amor",["raiva","medo do mar","arrependimento"],"Suspirar pelo amigo = sentir a falta dele.","c_ondas"],
["p4","ondas","\"Ondas do mar de Vigo\" é uma barcarola porque…","o mar é o cenário e o confidente",["fala de uma dança entre amigas","se passa ao raiar da madrugada","se passa numa romaria a um santuário"],"Barcarola/marinha: o mar como espaço e confidente.","c_ondas"],
["p4","ondas","No refrão \"E ai Deus, se verrá cedo!\", \"verrá\" significa…","virá",["verá","voltará a partir","vencerá"],"Forma antiga do futuro de \"vir\".","c_ondas"],
["p4","flores","\"Ai flores, ai flores do verde pino\" — \"pino\" é…","pinheiro",["pino de bowling","pinho cortado","monte"],"Verde pino = pinheiro verde.","c_flores"],
["p4","flores","\"se sabedes novas do meu amigo\" — \"novas\" significa…","notícias",["coisas novas","roupas","flores novas"],"Novas = notícias.","c_flores"],
["p4","flores","Quem é o autor de \"Ai flores, ai flores do verde pino\"?","D. Dinis",["Martim Codax","Meendinho","Airas Nunes"],"Cantiga de amigo de D. Dinis.","c_flores"],
["p4","flores","\"aquel que mentiu do que pôs comigo\" mostra que a donzela…","se queixa porque o amigo não cumpriu o que combinou",["elogia a honestidade e a lealdade do amigo","já se esqueceu do amigo e não o espera","quer casar com outro pretendente"],"Ele faltou ao combinado (não apareceu no prazo).","c_flores"],
["p4","flores","\"Vós me preguntades polo voss' amigo?\" — quem fala neste verso?","as flores",["a donzela","o amigo","a mãe"],"A partir da 5.ª estrofe são as flores que respondem: estrutura dialogada.","c_flores"],
["p4","flores","\"e seerá vosc' ant' o prazo saído\" significa que o amigo…","estará com ela antes de terminar o prazo",["morreu antes de terminar o prazo","nunca mais voltará para junto dela","partiu com outra donzela para longe"],"\"seerá vosc'\" = estará convosco; \"ant' o prazo saído\" = antes de acabar o prazo.","c_flores"],
["p4","flores","A cantiga \"Ai flores…\" tem uma estrutura dialogada porque…","há perguntas da donzela e respostas das flores",["foi escrita por dois trovadores diferentes","mistura duas línguas, o latim e o galego","é cantada sempre por dois jograis"],"Diálogo: donzela (estrofes 1–4) e flores (estrofes 5–8).","c_flores"],
["p4","ermida","\"Sedia-m' eu na ermida de Sam Simiom\" — \"ermida\" é…","uma pequena igreja em lugar isolado",["uma casa de pescadores junto ao mar","um castelo construído numa ilha","uma ilha deserta, sem construções"],"Ermida: capela isolada. San Simón é uma ilha na ria de Vigo.","c_ermida"],
["p4","ermida","Quem é o autor de \"Sedia-m' eu na ermida de Sam Simiom\"?","Meendinho",["D. Dinis","Martim Codax","João Zorro"],"Meendinho: a única cantiga que se conhece dele.","c_ermida"],
["p4","ermida","\"Sedia-m' eu\" significa…","estava eu (sentada)",["saía eu (de casa)","sofria eu (de amor)","dormia eu (na ermida)"],"Do verbo \"seer/sedere\": estar sentado.","c_ermida"],
["p4","ermida","\"eu atendend' o meu amigo!\" — \"atendendo\" significa…","esperando",["ouvindo","tratando","servindo"],"\"Atender\" no galego-português = esperar.","c_ermida"],
["p4","ermida","\"nom ei [i] barqueiro, nem sei remar\" exprime…","isolamento e impotência",["alegria e liberdade","orgulho","cansaço"],"Ela está cercada pelo mar sem forma de sair.","c_ermida"],
["p4","ermida","\"morrerei [eu] fremosa no mar maior\" — o adjetivo \"fremosa\" revela que a donzela…","tem consciência da sua beleza",["está gravemente doente","é já uma mulher idosa","se considera feia e sozinha"],"Mesmo perante a morte, refere a sua beleza: traço típico da donzela.","c_ermida"],
["p4","outras","\"Mia irmana fremosa, treides comigo / a la igreja de Vig', u é o mar salido\" — a interlocutora é…","a irmã",["a mãe","o amigo","as ondas"],"\"Mia irmana\" — a donzela convida a irmã para ir à igreja de Vigo (romaria)."],
["p4","outras","\"treides comigo / a la igreja de Vig'\" é um…","convite",["pedido de desculpas","lamento pela morte","insulto"],"\"treides\" = vinde. Convite para a romaria. Resposta completa: convite (vinde comigo)."],
["p4","outras","\"Digades, filha, mia filha velida, / porque tardastes na fontana fria?\" — quem fala?","a mãe",["a donzela","o amigo","as amigas"],"A mãe pergunta à filha porque se atrasou na fonte (Pero Meogo)."],
["p4","outras","Na cantiga de Pero Meogo, a \"fontana fria\" simboliza…","o lugar do encontro amoroso",["a doença da donzela","a morte do amigo","a pobreza da família"],"A fonte é espaço de encontro dos namorados.","c_meogo"],
["p4","outras","\"Levantou-s' a velida, / levantou-s' alva\" (D. Dinis) — o cenário é…","o amanhecer",["a noite de tempestade","uma dança na corte","uma batalha"],"\"alva\" = madrugada: cantiga de tipo alba. Resposta completa: o amanhecer (alba)."],
["p4","outras","\"velida\" significa…","bela, formosa",["velha","vestida","vencida"],"Velida = bela. É frequente nas cantigas de amigo."],
["p4","outras","Em \"Bailemos nós ja todas tres, ai amigas\", a donzela dirige-se…","às amigas",["ao amigo","à mãe","ao mar"],"\"ai amigas\" — interpelação às amigas (bailia de Airas Nunes)."],
["p5","ins","A prótese é…","a inserção de um som no início da palavra",["a inserção de um som no final da palavra","a queda de um som no início da palavra","a troca de posição de sons na palavra"],"Prótese: + início. Ex.: scutu- > escudo."],
["p5","ins","A epêntese é…","a inserção de um som no interior da palavra",["a inserção de um som no início da palavra","a queda de um som no interior da palavra","a fusão de duas vogais numa só vogal"],"Epêntese: + interior. Ex.: creo > creio."],
["p5","ins","A paragoge é…","a inserção de um som no final da palavra",["a queda de um som no final da palavra","a inserção de um som no início da palavra","a troca de posição de sílabas na palavra"],"Paragoge: + final. Ex.: ante > antes."],

["e1","def","Para G. Pigou, a Economia tem por objeto…","os preços e as leis do mercado",["o bem-estar","as relações de produção","a escassez"],"Pigou: preços e mercado."],
["e1","def","Para os economistas marxistas, a Economia estuda…","as relações sociais de produção entre proprietários dos meios de produção e trabalhadores",["os preços e as leis do mercado, onde se encontram compradores e vendedores","a forma como cada consumidor escolhe os bens para o seu bem-estar","a aplicação dos recursos escassos em finalidades de desigual importância"],"Seguidores de Karl Marx."],
["e1","def","Para Paul Samuelson, a Economia é o estudo…","de como as sociedades usam recursos escassos para produzir e distribuir bens",["dos preços e das leis do mercado onde se trocam os bens","das relações sociais de produção entre proprietários e trabalhadores","dos assuntos correntes da vida e do bem-estar das pessoas"],"Samuelson (e Nordhaus): escolha e distribuição."],
["e1","def","John Stuart Mill (séc. XIX) afirmava que a Economia se ocupa do homem enquanto ser que…","deseja obter riqueza e julga a eficácia dos meios para isso",["vive em família e em comunidade com os outros","obedece às leis e às regras do Estado","consome sem pensar nas consequências dos seus atos"],"Uma das definições do manual."],
["e2","prob","O problema económico resulta de…","necessidades ilimitadas face a recursos escassos",["recursos ilimitados face a necessidades escassas","necessidades limitadas face a recursos abundantes","excesso de produção face à procura dos consumidores"],"Daí a necessidade de fazer escolhas."],
["e2","prob","A necessidade de fazer escolhas é consequência…","da escassez de recursos",["da abundância de recursos","do custo de oportunidade","da publicidade"],"Com recursos ilimitados não seria preciso escolher."],
["e2","prob","Os recursos naturais são escassos e muitos são…","não renováveis",["infinitos","gratuitos","renováveis instantaneamente"],"As necessidades acompanham o desenvolvimento e são ilimitadas."],
["e2","prob","A Economia é designada por \"ciência das escolhas\" porque…","estuda como usar recursos escassos para satisfazer necessidades",["estuda a forma como os cidadãos escolhem os governos","ajuda as empresas a escolher os trabalhadores","estuda apenas as escolhas de moda dos consumidores"],"A escassez obriga a escolher."],
["e2","rac","A racionalidade económica consiste em…","obter o máximo benefício com o mínimo de gasto em recursos",["gastar o máximo de recursos para obter o máximo benefício","escolher ao acaso entre as necessidades a satisfazer","produzir o máximo possível, sem olhar aos custos"],"Gestão eficiente dos recursos escassos."],
["e2","rac","Um consumidor tem um comportamento racional quando…","com um dado montante de moeda obtém a maior quantidade possível de bens e serviços",["gasta todo o rendimento no primeiro produto que encontra","compra sempre o produto mais caro, por ser de melhor qualidade","compra por impulso, sem comparar preços nem qualidade"],"Máximo benefício com os recursos de que dispõe."],
["e2","rac","Um produtor tem um comportamento racional quando…","maximiza a produção com o mínimo dispêndio de recursos",["gasta o máximo em matérias-primas para produzir","produz sem planear a quantidade nem os custos","desperdiça recursos para produzir mais depressa"],"Eficiência."],
["e2","co","O custo de oportunidade é…","a alternativa que se sacrifica ao fazer uma escolha",["o preço pago em dinheiro pelo bem que se escolheu","o lucro que a empresa obtém com a venda de um bem","o imposto que o Estado cobra sobre o consumo de um bem"],"O \"preço\" de uma opção."],
["e2","co","Uma câmara decide construir uma ponte em vez de um hospital. O custo de oportunidade é…","o hospital que não é construído",["a ponte","o dinheiro gasto na ponte","os impostos"],"A alternativa sacrificada."],
["e2","co","No esquema do problema económico, a satisfação de algumas necessidades corresponde ao…","benefício",["custo de oportunidade","problema económico","recurso escasso"],"A não satisfação de outras = custo de oportunidade."],
["e2","co","No esquema do problema económico, a não satisfação de outras necessidades corresponde ao…","custo de oportunidade",["benefício da escolha","lucro do produtor","consumo intermédio"],"Escolher implica sempre desistir de algo."],
["e2","co","O Rui tem 20 € e hesita entre um livro e um bilhete de concerto. Escolhe o livro. O custo de oportunidade é…","o concerto",["o livro","os 20 €","a livraria"],"A melhor alternativa sacrificada."],
["e2","co","Uma economia produz só cereais e tecido: 0 t cereais → 10 t tecido; 1 t → 8 t; 2 t → 6 t. O custo de oportunidade de cada tonelada adicional de cereais é…","2 toneladas de tecido",["8 toneladas de tecido","1 tonelada de tecido","10 toneladas de tecido"],"Cada tonelada a mais de cereais obriga a abdicar de 2 t de tecido."],
["e2","co","Uma economia produz só bicicletas e trotinetes: 0 bic. → 12 trot.; 1 → 8; 2 → 4; 3 → 0 (milhares). O custo de oportunidade de passar de 1 para 2 mil bicicletas é…","4 mil trotinetes",["8 mil trotinetes","2 mil trotinetes","12 mil trotinetes"],"De 8 para 4 mil trotinetes: sacrificam-se 4 mil."],
["e2","co","A decisão económica (escolha) implica sempre…","desistir de algo em benefício do que se elegeu",["ganhar tudo o que se deseja ao mesmo tempo","não gastar quaisquer recursos na decisão","aumentar a quantidade de recursos disponíveis"],"Essa alternativa sacrificada é o custo de oportunidade."],
["e2","co","A sequência certa do esquema é…","escassez e necessidades ilimitadas → escolha → racionalidade → otimização",["escolha → recursos ilimitados → necessidades escassas → benefício","benefício → escolha → escassez de recursos → racionalidade económica","otimização dos recursos → escassez → custo de oportunidade → escolha"],"Depois: benefício e custo de oportunidade."],
["e3","ag","Um agente económico é…","uma entidade autónoma que realiza operações económicas e decide",["apenas uma empresa que produz bens e serviços para vender","apenas o Estado, que toma decisões em nome dos cidadãos","qualquer objeto ou bem com valor económico no mercado"],"Tem capacidade para deter valor económico."],
["e3","ag","A função principal das Famílias é…","consumir",["produzir bens","conceder crédito","redistribuir o rendimento"],"Alimentação, vestuário, educação, saúde, transporte…"],
["e3","ag","A função principal das Empresas não Financeiras é…","produzir bens e serviços não financeiros",["consumir bens e serviços","recolher poupanças e conceder crédito","trocar bens com o exterior"],"Produzem o que as famílias consomem."],
["e3","ag","A função principal das Instituições Financeiras é…","financiar e prestar serviços financeiros",["produzir bens e serviços não financeiros","satisfazer as necessidades coletivas","consumir bens e serviços financeiros"],"Recolhem poupanças (depósitos) e canalizam-nas através do crédito. Resposta completa: financiar e prestar serviços financeiros (ex.: seguros)."],
["e3","ag","A função principal do Estado (Administração Pública) é…","satisfazer necessidades coletivas e redistribuir o rendimento",["produzir bens e serviços para obter lucro","conceder empréstimos às famílias e às empresas","trocar bens, serviços e capitais com o exterior"],"Justiça, defesa, segurança, infraestruturas…"],
["e3","ag","A função do Resto do Mundo é…","trocar bens, serviços e capitais",["consumir no país","redistribuir rendimentos","recolher impostos"],"Nenhum país sobrevive sozinho."],
["e3","ag","A Caixa Geral de Depósitos pertence ao agente económico…","Instituições Financeiras",["Empresas não Financeiras","Administração Pública","Famílias"],"É um banco."],
["e3","ag","Uma companhia de seguros pertence ao agente económico…","Instituições Financeiras",["Empresas não Financeiras","Famílias","Resto do Mundo"],"Seguros são serviços financeiros."],
["e3","ag","Uma operadora de telecomunicações (ex.: Vodafone) pertence ao agente…","Empresas não Financeiras",["Instituições Financeiras","Administração Pública","Resto do Mundo"],"Produz serviços não financeiros."],
["e3","ag","A TAP é considerada uma Empresa não Financeira porque…","produz serviços não financeiros (transporte aéreo)",["concede crédito aos passageiros (financeiro)","pertence em parte ao Estado (público)","faz voos para o estrangeiro (Resto do Mundo)"],"O critério é a função principal."],
["e3","ag","O Ministério da Educação pertence ao agente económico…","Administração Pública",["Empresas não Financeiras","Instituições Financeiras","Famílias"],"Satisfaz necessidades coletivas (educação). Resposta completa: Administração Pública (Estado)."],
["e3","ag","A justiça e a defesa estão a cargo do Estado porque…","não devem ser feitas por particulares, que não seriam imparciais",["são atividades muito lucrativas, que o Estado não quer partilhar","são atividades baratas, que não exigem impostos","as famílias e as empresas não precisam delas"],"Outras atividades (infraestruturas, transportes públicos) não são suficientemente lucrativas."],
["e3","ag","Uma empresa portuguesa que vende vinho a um importador do Brasil relaciona-se com o agente…","Resto do Mundo",["Administração Pública","Famílias","Instituições Financeiras"],"Trocas com o exterior."],
["e3","at","As atividades económicas são…","o conjunto das atividades humanas que visam satisfazer necessidades individuais e coletivas",["apenas as compras que as famílias fazem para satisfazer necessidades","apenas o trabalho realizado nas fábricas e nas empresas","as atividades de lazer e os passatempos das pessoas"],"Produção, distribuição e redistribuição dos rendimentos, utilização dos rendimentos."],
["e3","at","As principais atividades económicas são…","produção, distribuição e redistribuição e utilização dos rendimentos",["produção, publicidade, moda e inovação tecnológica","consumo, impostos, greves e negociação salarial","importação, exportação, turismo e transportes"],"A utilização divide-se em consumo e poupança."],
["e3","at","A utilização dos rendimentos divide-se em…","consumo e poupança",["produção e distribuição","salários e lucros","importação e exportação"],"Gasta-se ou guarda-se."],
["e3","at","O lucro é a remuneração…","dos donos das empresas, pelo risco de montar uma empresa",["dos trabalhadores, pelo trabalho realizado","dos depositantes, pelo dinheiro no banco","do Estado, pela cobrança de impostos"],"Os trabalhadores recebem salário."],
["e3","at","O juro recebido por quem deposita dinheiro no banco é…","a remuneração da poupança depositada",["o salário pago pelo banco","o lucro da atividade bancária","um imposto sobre a poupança"],"O banco usa os depósitos para financiar consumo e investimento."],
["e3","at","A distribuição (dos bens) liga…","a produção ao consumo, através dos transportes e do comércio",["as famílias ao Estado, através dos impostos","os bancos às empresas, através do crédito","a poupança ao investimento, através dos juros"],"Coloca os bens à disposição dos consumidores."],
["e3","at","A poupança pode ser…","entesourada, depositada nos bancos ou investida",["apenas gasta em bens de consumo","apenas paga ao Estado em impostos","apenas exportada para o estrangeiro"],"Parte do rendimento não consumida."],
["e3","at","As atividades económicas são complementares porque…","sem produção não há rendimento, nem consumo, nem poupança",["são todas iguais e podem substituir-se umas às outras","não dependem umas das outras e funcionam em separado","só existem em conjunto quando o Estado as organiza"],"Sem acumulação não há dinheiro para equipamentos, matérias-primas e salários."],
["e3","at","Receber o salário ao fim do mês corresponde à atividade de…","distribuição dos rendimentos",["produção de bens","utilização dos rendimentos","poupança do rendimento"],"A riqueza criada é repartida pelos que participaram na produção."],
["e3","at","Comprar um bilhete de cinema corresponde à atividade de…","utilização dos rendimentos",["produção","distribuição dos rendimentos","redistribuição dos rendimentos"],"Usa-se o rendimento para satisfazer uma necessidade. Resposta completa: utilização dos rendimentos (consumo)."],
["e4","noc","Uma necessidade é…","um estado de carência que urge ser ultrapassado ou satisfeito",["um bem material que se compra para usar no dia a dia","um serviço público prestado pelo Estado aos cidadãos","um desejo sempre supérfluo, criado pela publicidade"],"Ex.: alimentação, habitação, saúde, transporte…"],
["e4","noc","As necessidades são satisfeitas através…","da utilização de bens e serviços",["apenas do dinheiro que se ganha","apenas dos serviços do Estado","da poupança que se acumula"],"Saúde → ida ao médico; transporte → comboio ou autocarro."],
["e4","car","A multiplicidade das necessidades significa que…","são múltiplas e renovam-se constantemente: satisfeita uma, surgem outras",["podem ser satisfeitas por diferentes bens que se substituem uns aos outros","a sua intensidade diminui à medida que vão sendo satisfeitas","variam no tempo e no espaço, de acordo com a cultura dos povos"],"Parece não haver limite."],
["e4","car","A substituibilidade das necessidades significa que…","podem ser satisfeitas por bens diferentes",["diminuem de intensidade até desaparecer","variam de acordo com a cultura de cada povo","são infinitas e renovam-se constantemente"],"Fome: sandes + leite ou sopa + fruta."],
["e4","car","A saciabilidade significa que…","a intensidade da necessidade diminui à medida que é satisfeita, até desaparecer",["as necessidades são múltiplas e renovam-se constantemente, sem limite","as necessidades podem ser satisfeitas por bens que se substituem","as necessidades variam de país para país e de época para época"],"Sede: cada copo de água satisfaz menos do que o anterior."],
["e4","car","A relatividade das necessidades significa que…","variam no tempo e no espaço",["diminuem com a satisfação","são satisfeitas por vários bens","renovam-se sempre"],"Há um século não havia necessidade de telemóveis."],
["e4","car","\"Há um século ninguém sentia necessidade de um telemóvel.\" Esta frase ilustra a…","relatividade",["saciabilidade","substituibilidade","multiplicidade"],"Variação no tempo."],
["e4","car","\"Ao 4.º copo de água já não tenho sede.\" Esta frase ilustra a…","saciabilidade",["relatividade","multiplicidade","substituibilidade"],"A intensidade diminui até desaparecer."],
["e4","car","\"Mal comprei o telemóvel, já quero uma capa e uns auscultadores.\" Esta frase ilustra a…","multiplicidade",["saciabilidade","relatividade","substituibilidade"],"Satisfeita uma, surgem outras."],
["e4","car","\"Se não houver sopa, como uma sandes.\" Esta frase ilustra a…","substituibilidade",["saciabilidade","relatividade","multiplicidade"],"Bens diferentes satisfazem a mesma necessidade."],
["e4","cls","Quanto à importância, as necessidades classificam-se em…","primárias, secundárias e terciárias",["individuais e coletivas","finais e intermédias","privadas, públicas e mistas"],"Individuais e coletivas é quanto ao número de pessoas que as sentem."],
["e4","cls","As necessidades primárias são…","indispensáveis à vida humana",["dispensáveis","ligadas à qualidade de vida","sempre coletivas"],"Ex.: respiração, alimentação."],
["e4","cls","As necessidades secundárias…","garantem uma melhor qualidade de vida",["são indispensáveis à vida humana","são supérfluas e dispensáveis","só existem nos países mais ricos"],"Ex.: cultura, transporte."],
["e4","cls","As necessidades terciárias…","se não forem satisfeitas, não põem em risco a vida — são dispensáveis",["são indispensáveis à vida humana, como a respiração","são sempre coletivas, porque decorrem da vida em sociedade","garantem a sobrevivência e uma melhor qualidade de vida"],"Ex.: vestuário de marca, perfume, viajar em classe executiva."],
["e4","cls","Ter vários automóveis é uma necessidade…","terciária",["primária","secundária","coletiva"],"Dispensável."],
["e4","cls","Ler um livro satisfaz uma necessidade…","secundária e individual",["primária e coletiva","terciária e coletiva","primária e individual"],"Cultura = secundária; sentida por cada pessoa."],
["e4","cls","A alimentação é uma necessidade…","primária e individual",["secundária e coletiva","terciária e individual","primária e coletiva"],"Indispensável à vida; sentida por cada pessoa."],
["e4","cls","A segurança e a justiça são necessidades…","coletivas",["individuais","terciárias","privadas"],"Decorrem da vida em coletividade."],
["e4","cls","A iluminação pública satisfaz uma necessidade coletiva porque…","decorre da vida em comunidade e beneficia todos ao mesmo tempo",["é paga individualmente por cada pessoa que a usa","é uma necessidade dispensável, que não põe a vida em risco","só serve uma família de cada vez, em cada rua"],"Necessidade coletiva."],
["e4","cls","A classificação das necessidades quanto à importância é relativa porque…","a importância varia conforme a pessoa, a época ou o lugar",["as necessidades primárias não existem em todas as sociedades","todas as necessidades acabam por ser terciárias","a classificação é definida por lei em cada país"],"Ex.: o transporte pode ser essencial para quem vive longe do trabalho."],
["e4","cls","As necessidades individuais são as que…","dizem respeito a cada pessoa, mesmo que viva só",["decorrem da vida em comunidade, como a segurança","são satisfeitas pelo Estado, através dos impostos","são sempre terciárias, logo dispensáveis"],"Ex.: alimentação, respiração."],
["e5","noc","O consumo é…","a destruição de um bem ou utilização de um serviço para satisfazer necessidades",["a produção de bens e serviços para satisfazer necessidades","a poupança de uma parte do rendimento para o futuro","a venda de bens e serviços aos consumidores finais"],"Necessidade → consumo → estado de satisfação."],
["e5","noc","Os bens e serviços são…","meios capazes de satisfazer necessidades",["estados de carência","rendimentos das famílias","agentes económicos que produzem"],"Bens = materiais; serviços = imateriais."],
["e5","noc","Uma consulta médica é…","um serviço",["um bem material","uma necessidade primária","um rendimento do médico"],"Satisfaz a necessidade de saúde. Resposta completa: um serviço (meio imaterial)."],
["e5","noc","O consumo é um ato económico porque…","dá \"ordens de produção\" às empresas, gerando emprego e rendimento",["é sempre prejudicial ao ambiente e à saúde do consumidor","não tem consequências sobre as empresas nem sobre o emprego","é realizado apenas pelo Estado e pelas Administrações Públicas"],"Dinamiza a atividade económica."],
["e5","noc","O consumo é um ato social porque…","tem consequências para o próprio, para a coletividade e para o mundo",["é sempre feito em grupo, com amigos ou família","só envolve as famílias e não as empresas","não tem efeitos sobre a coletividade nem o ambiente"],"Ex.: produtos poluentes ou feitos com trabalho infantil."],
["e5","noc","Comprar produtos locais reduz a pegada ecológica. Isto mostra o consumo como ato…","social",["puramente individual","sem consequências","intermédio"],"E também é ato económico: beneficia os produtores locais."],
["e5","cls","Quanto ao autor do ato de consumir, o consumo pode ser…","privado ou público",["individual ou coletivo","final ou intermédio","primário ou secundário"],"Beneficiário → individual/coletivo; finalidade → final/intermédio."],
["e5","cls","Quanto ao beneficiário, o consumo pode ser…","individual ou coletivo",["privado ou público","final ou intermédio","essencial ou supérfluo"],"Quem beneficia do consumo."],
["e5","cls","Quanto à finalidade, o consumo pode ser…","final ou intermédio",["privado ou público","individual ou coletivo","racional ou impulsivo"],"Para que serve o consumo."],
["e5","priv","O consumo privado é realizado…","pelas famílias",["pelo Estado","pelas empresas para transformar bens","pelo Resto do Mundo"],"Ex.: compras no supermercado, idas ao cinema."],
["e5","priv","O consumo público é realizado…","pelo Estado e Administrações Públicas",["pelas famílias","pelos bancos","pelas empresas privadas"],"Ex.: vencimentos dos funcionários públicos, pensões, juros da dívida pública."],
["e5","priv","O pagamento dos vencimentos dos funcionários públicos é…","consumo público",["consumo privado","consumo intermédio das empresas","poupança"],"Exemplo do manual."],
["e5","priv","A compra de material de escritório por uma câmara municipal é consumo…","público",["privado","das famílias","do Resto do Mundo"],"As câmaras municipais fazem parte da Administração Pública."],
["e5","ind","O consumo individual caracteriza-se por…","rivalidade e exclusão",["não rivalidade e não exclusão","ser sempre gratuito","ser feito pelo Estado"],"Quem consome impede ou diminui o consumo dos outros."],
["e5","ind","O consumo coletivo caracteriza-se por…","não haver rivalidade nem exclusão",["rivalidade e exclusão","ser pago individualmente","ser feito só por uma pessoa"],"Ex.: iluminação pública, defesa nacional."],
["e5","ind","Um bem rival é aquele em que…","o consumo por uma pessoa diminui a quantidade disponível para os outros",["ninguém pode ser excluído de o consumir ao mesmo tempo","o uso é gratuito e fornecido pelo Estado","o consumo por uma pessoa não diminui a quantidade disponível"],"Ex.: comprar muito leite deixa menos para os outros."],
["e5","ind","Um bem excludente é aquele em que…","o consumo por uma pessoa impede outros de o consumir",["todas as pessoas podem usá-lo ao mesmo tempo","é fornecido pelo Estado através dos impostos","o seu uso é gratuito para toda a população"],"Ex.: a camisola que vestimos."],
["e5","ind","Os bens públicos têm as características de…","não exclusividade e não rivalidade",["exclusividade e rivalidade","exclusividade e não rivalidade","rivalidade e pagamento individual"],"São cobrados à coletividade (impostos)."],
["e5","ind","Os bens privados…","pertencem em exclusivo aos proprietários e são pagos individualmente",["são gratuitos e fornecidos pelo Estado a todos","não têm dono e podem ser usados por qualquer pessoa","beneficiam toda a coletividade sem rivalidade"],"Ex.: refeição, vestuário, viagens."],
["e5","ind","A defesa nacional é um exemplo de…","bem público e consumo coletivo",["bem privado e consumo individual","consumo intermédio","consumo privado"],"Ninguém pode ser excluído; não há rivalidade."],
["e5","ind","Quem fornece os bens públicos, através dos impostos?","o Estado",["as famílias","as Instituições Financeiras","o Resto do Mundo"],"Gratuitos ou a preços acessíveis."],
["e5","fin","O consumo final é o consumo de bens…","já transformados, utilizados diretamente na satisfação de necessidades",["que vão ser transformados noutros bens pelas empresas","realizado apenas pelo Estado e pelas Administrações Públicas","que são vendidos e exportados para o Resto do Mundo"],"Realizado pelas famílias."],
["e5","fin","O consumo intermédio é o consumo de bens…","que vão ser transformados noutros bens",["já prontos a usar pelas famílias","realizado pelas famílias no dia a dia","de luxo, comprados pelas empresas"],"Realizado pelas empresas."],

["e5","fin","Uma família compra madeira para fazer uma estante. Trata-se de consumo…","final",["intermédio","público","coletivo"],"A família não é uma empresa: o bem não vai ser vendido transformado."],
["e5","fin","Uma pastelaria usa farinha para fazer bolos para vender. Trata-se de consumo…","intermédio",["final","coletivo","público"],"A farinha é transformada em bens de consumo final."],

["f6b", "form", "Formaliza (P, Q, R pela ordem em que as proposições aparecem): \"Uma sociedade preserva verdadeiramente o seu património cultural se, e só se, protege os seus monumentos e valoriza a sua memória histórica.\"", "P↔(Q∧R)", ["P↔(Q→R)", "P↔(Q↔R)", "P↔(Q⊻R)"], "Identifica as proposições simples (P, Q, R) e as conectivas que as ligam."],

["f6b", "form", "Formaliza (P, Q, R pela ordem em que as proposições aparecem): \"Uma pintura é considerada impressionista se, e só se, privilegia a luz e privilegia a impressão visual imediata.\"", "(P∧Q)↔R", ["(P∨Q)↔R", "(P∧Q)∧R", "(P∧Q)→R"], "Identifica as proposições simples (P, Q, R) e as conectivas que as ligam.", "", "A solução do professor é (P∧Q)↔R. Mas a frase segue o mesmo modelo de \"Uma obra pertence ao Barroco se, e só se…\", que ele formalizou como P↔(Q∧R). Na frase, \"é impressionista\" vem primeiro, por isso P↔(Q∧R) parece mais coerente. As duas dizem o mesmo; só muda a letra atribuída a cada proposição. O teu filho deve confirmar com o professor qual quer no teste."],

["f6b", "form", "Formaliza (P, Q, R pela ordem em que as proposições aparecem): \"Se uma obra é um romance histórico ou uma crónica histórica, então aborda acontecimentos do passado.\"", "(P∨Q)→R", ["(P∨Q)⊻R", "(P⊻Q)→R", "P∨(Q→R)"], "Identifica as proposições simples (P, Q, R) e as conectivas que as ligam."],
["f6b", "form", "Formaliza (P, Q, R pela ordem em que as proposições aparecem): \"Não é verdade que a Idade Média tenha sido um período sem atividade intelectual e sem produção artística.\"", "¬(P∧Q)", ["¬(P↔Q)", "¬(P∨Q)", "¬(P→Q)"], "Identifica as proposições simples (P, Q, R) e as conectivas que as ligam.", "", "O professor formalizou como ¬(P∧Q), com P = \"período sem atividade intelectual\". Noutros exercícios (\"não tenha alterado\") pôs a negação dentro (¬Q). Se o teu filho usar ¬(¬P∧¬Q), com P = \"teve atividade intelectual\", também está logicamente correto. No teste, segue a solução do professor."],
["f6b", "form", "Formaliza (P, Q, R pela ordem em que as proposições aparecem): \"Não é verdade que Michelângelo tenha pintado As Meninas ou que Velázquez tenha pintado a Capela Sistina.\"", "¬(P∨Q)", ["¬(P→Q)", "¬(P⊻Q)", "¬(P∧Q)"], "Identifica as proposições simples (P, Q, R) e as conectivas que as ligam."],
["f6b", "form", "Formaliza (P, Q, R pela ordem em que as proposições aparecem): \"Ou, se Rousseau influenciou o pensamento político moderno, então as suas ideias tiveram impacto na história europeia, ou a sua influência foi insignificante.\"", "(P→Q)⊻R", ["(P↔Q)⊻R", "(P∨Q)⊻R", "(P→Q)→R"], "Identifica as proposições simples (P, Q, R) e as conectivas que as ligam."],
["f6b", "form", "Formaliza (P, Q, R pela ordem em que as proposições aparecem): \"Se te constipares, amanhã não vais à escola.\"", "P→¬Q", ["P↔¬Q", "¬Q→P", "P⊻¬Q"], "Identifica as proposições simples (P, Q, R) e as conectivas que as ligam."],
["f6b", "form", "Formaliza (usa o dicionário dado): \"Amanhã não vais à escola se te constipares. [P = te constipares; Q = vais à escola]\"", "P→¬Q", ["¬Q→P", "P⊻¬Q", "P∨¬Q"], "Atenção: a condição vem no fim da frase, mas é o antecedente."],
["f6b", "form", "Formaliza (P, Q, R pela ordem em que as proposições aparecem): \"Se não estudares, então não te deixo sair.\"", "¬P→¬Q", ["¬Q→¬P", "¬P∨¬Q", "¬P↔¬Q"], "Identifica as proposições simples (P, Q, R) e as conectivas que as ligam."],
["f6b", "form", "Formaliza (usa o dicionário dado): \"Não te inscreves no festival, caso não estudes para os exames. [P = estudas; Q = inscreves-te]\"", "¬P→¬Q", ["¬P∨¬Q", "¬P⊻¬Q", "¬Q→¬P"], "Atenção: a condição vem no fim da frase, mas é o antecedente."],
["f6b", "form", "Formaliza (P, Q, R pela ordem em que as proposições aparecem): \"Ou começas a estudar e tirar boas notas ou não vais de férias.\"", "(P∧Q)⊻¬R", ["P∧(Q⊻¬R)", "(P∧Q)↔¬R", "(P∨Q)⊻¬R"], "Identifica as proposições simples (P, Q, R) e as conectivas que as ligam.", "", "Formalização minha (o slide não tem solução). \"Ou… ou\" sugere disjunção exclusiva (⊻). Alguns professores aceitam ∨ quando não é claro que as duas coisas não possam acontecer juntas. Confirmar com o professor."],
["f6b", "form", "Formaliza (P, Q, R pela ordem em que as proposições aparecem): \"Eça de Queiroz ou Camilo Castelo Branco são escritores.\"", "P∨Q", ["P⊻Q", "P→Q", "P↔Q"], "Identifica as proposições simples (P, Q, R) e as conectivas que as ligam.", "", "Formalização minha (o slide não tem solução). O \"ou\" leva a P∨Q. Mas como os dois são, de facto, escritores, há quem defenda que a frase quer dizer \"ambos são escritores\" (P∧Q). Esta frase parece escolhida de propósito para gerar discussão. Confirmar com o professor."],
["f6b", "form", "Formaliza (P, Q, R pela ordem em que as proposições aparecem): \"Se tens fome é porque não comeste, se não comeste tens fome.\"", "P↔¬Q", ["P∨¬Q", "P∧¬Q", "P⊻¬Q"], "Identifica as proposições simples (P, Q, R) e as conectivas que as ligam.", "", "Formalização minha (o slide não tem solução), com P = \"tens fome\" e Q = \"comeste\". A frase diz as duas condicionais (fome → não comeste; não comeste → fome), o que equivale a uma bicondicional. Confirmar com o professor."],
["f3c", "ex", "\"Se uma pessoa é moralmente responsável por uma ação, então agiu livremente. A pessoa não agiu livremente. Logo, não é moralmente responsável por essa ação.\" Este argumento é…", "válido e sólido", ["válido mas não sólido", "inválido", "indutivo"], "Forma válida (se P então Q; não Q; logo não P — modus tollens).", "", "A validade é certa. A solidez depende de se aceitarem as premissas como verdadeiras, e a 1.ª premissa (responsabilidade moral exige liberdade) é uma tese filosófica discutível. Se o professor a considerar verdadeira, é sólido; se a considerar discutível, é \"válido, mas a solidez é discutível\". Confirmar."],
["f3c", "ex", "\"Todos os romances realistas são obras literárias. Os Maias, de Eça de Queirós, é um romance realista. Logo, Os Maias é uma obra literária.\" Este argumento é…", "válido e sólido", ["válido mas não sólido", "inválido", "indutivo"], "Forma válida e premissas verdadeiras."],
["f3c", "ex", "\"Se Picasso pintou Guernica em 1937, então pintou-a no século XX. Picasso pintou Guernica em 1937. Logo, Picasso pintou Guernica no século XX.\" Este argumento é…", "válido e sólido", ["válido mas não sólido", "inválido", "indutivo"], "Modus ponens com premissas verdadeiras."],
["f3c", "ex", "\"Se a frota de Vasco da Gama chegou à Índia em 1498, então chegou antes de 1500. A frota chegou à Índia em 1498. Logo, chegou à Índia antes de 1500.\" Este argumento é…", "válido e sólido", ["válido mas não sólido", "inválido", "indutivo"], "Modus ponens com premissas verdadeiras."],
["f3c", "ex", "\"Se Fernando Pessoa escreveu Mensagem, então era escritor. Fernando Pessoa era escritor. Logo, Fernando Pessoa escreveu Mensagem.\" Este argumento é…", "inválido", ["válido e sólido", "válido mas não sólido", "indutivo"], "Afirma o consequente: Q, logo P. Inválido, apesar de tudo ser verdadeiro."],
["f3c", "ex", "\"Se A Noite Estrelada, de Van Gogh, é uma aguarela, então é uma pintura. A Noite Estrelada não é uma aguarela. Logo, A Noite Estrelada não é uma pintura.\" Este argumento é…", "inválido", ["válido e sólido", "válido mas não sólido", "indutivo"], "Nega o antecedente: não P, logo não Q. Inválido (e a conclusão é falsa: é uma pintura a óleo)."],
["f3c", "ex", "\"Todos os ditadores são imperadores. Júlio César foi ditador. Logo, Júlio César foi imperador.\" Este argumento é…", "válido mas não sólido", ["válido e sólido", "inválido", "indutivo"], "A forma é válida, mas a 1.ª premissa é falsa (nem todos os ditadores são imperadores).", "", "A conclusão também é, em rigor, falsa: Júlio César foi ditador, mas não foi imperador (o primeiro foi Augusto). Isto não muda a resposta: válido, não sólido."],
["f3c", "ex", "\"David foi esculpido por Da Vinci. David é uma personagem bíblica. Logo, Da Vinci era crente.\" Este argumento é…", "inválido", ["válido e sólido", "válido mas não sólido", "indutivo"], "A conclusão não se segue das premissas (e a 1.ª premissa é falsa: o David é de Miguel Ângelo)."],
["f3c", "ex", "\"Todos os imperadores são governantes. Napoleão Bonaparte foi governante. Logo, Napoleão Bonaparte foi imperador.\" Este argumento é…", "inválido", ["válido e sólido", "válido mas não sólido", "indutivo"], "Ser governante não implica ser imperador. Inválido, mesmo com todas as proposições verdadeiras."],
["f3c", "ex", "\"Todo o país costeiro tem uma dieta baseada no peixe. A Grécia é um país costeiro. Logo, Sócrates comia peixe.\" Este argumento é…", "inválido", ["válido e sólido", "válido mas não sólido", "indutivo"], "A conclusão fala de Sócrates, que não aparece nas premissas: não se segue."],
["f3c", "ex", "\"Todos os romances históricos são obras de ficção. Crime e Castigo, de Dostoiévski, é um romance histórico. Logo, Crime e Castigo é uma obra de ficção.\" Este argumento é…", "válido mas não sólido", ["válido e sólido", "inválido", "indutivo"], "Forma válida, mas a 2.ª premissa é falsa (Crime e Castigo não é um romance histórico). A conclusão até é verdadeira."],
["f3c", "ex", "\"Se Rodin criou O Pensador, então criou pelo menos uma escultura. Rodin criou O Pensador. Logo, Rodin criou pelo menos uma escultura.\" Este argumento é…", "válido e sólido", ["válido mas não sólido", "inválido", "indutivo"], "Modus ponens com premissas verdadeiras."],
["f3c", "ex", "\"Se Descartes duvida, então pensa. Se Descartes pensa, então existe. Logo, se Descartes duvida, então existe.\" Este argumento é…", "válido e sólido", ["válido mas não sólido", "inválido", "indutivo"], "Forma válida: se P então Q; se Q então R; logo se P então R.", "", "A validade é certa. A solidez depende de aceitar as premissas como verdadeiras; para Descartes são, mas são teses filosóficas. Se o professor quiser só \"válido\", a resposta seria válido (solidez discutível). Confirmar."],
["f3c", "ex", "\"Toda a guerra que se estenda por múltiplos continentes considera-se uma guerra mundial. A Guerra dos Cem Anos desenrolou-se no Reino de França e no Canal da Mancha. Logo, a Guerra dos Cem Anos não é considerada uma guerra mundial.\" Este argumento é…", "inválido", ["válido e sólido", "válido mas não sólido", "indutivo"], "A 1.ª premissa diz que estender-se por vários continentes é suficiente para ser mundial, não que é necessário. Da premissa não se pode concluir que, não se estendendo, não é mundial (é como negar o antecedente).", "", "Há quem leia a 1.ª premissa como uma definição (\"só é mundial se…\"); nesse caso o argumento seria válido e sólido. Lendo à letra (\"Toda a guerra que… considera-se\"), é inválido. Confirmar com o professor."],

["f3c", "ex", "\"Se Rapariga com Brinco de Pérola, de Vermeer, é uma escultura, então é uma obra de arte. Não é uma escultura. Logo, não é uma obra de arte.\" Este argumento é…", "inválido", ["válido e sólido", "válido mas não sólido", "indutivo"], "Nega o antecedente. Inválido (e a conclusão é falsa)."],
["f3c", "ex", "\"D. Dinis era rei de Portugal. D. Dinis fundou uma universidade em 1290. Logo, todos os reis de Portugal fundaram universidades.\" Este argumento é…", "inválido", ["válido e sólido", "válido mas não sólido", "indutivo"], "Generaliza a partir de um caso: a conclusão não se segue."],
