// Cartões de estudo — Filosofia, Lógica formal (a partir do resumo da Susana)
const EX=(l,c)=>`<div class="ex">${l.map(x=>`<div>${x}</div>`).join('')}<div class="cc">${c}</div></div>`;
const STUDY_FI={
1:[
 {t:'Para que serve a lógica formal?',h:`<p>Serve para <b>distinguir os bons argumentos dos maus</b>, através de regras formais (quase como na matemática).</p><p>O que conta é a <b>forma</b> (o modo como o argumento está construído), não o assunto de que fala.</p><div class="quote">«Do mesmo modo que a matemática é o instrumento da ciência, também a lógica é o instrumento da filosofia.»<span>A. C. Grayling</span></div>`},
 {t:'Problema → Tese → Argumento',h:`<div class="steps"><div><b>1 · Problema</b>Uma pergunta filosófica.<br><i>Ex.: Somos responsáveis pelo que fazemos?</i></div><div><b>2 · Tese</b>A posição defendida, a resposta ao problema. É a <b>conclusão</b> do argumento.</div><div><b>3 · Argumento</b>As boas razões que justificam a tese (é isso que a distingue de uma opinião).</div></div>`},
 {t:'Anatomia de um argumento',h:`<p>Conjunto de proposições: uma ou mais <b>premissas</b> (as razões) das quais se tira uma <b>única conclusão</b>.</p><table class="st"><tr><td>Premissa 1</td><td>Todos os homens são mortais.</td></tr><tr><td>Premissa 2</td><td>Sócrates é homem.</td></tr><tr><td><b>Conclusão</b></td><td><b>Logo, Sócrates é mortal.</b></td></tr></table><div class="two"><div><b>Anunciam a conclusão</b>logo · portanto · por conseguinte · por isso · então</div><div><b>Anunciam premissas</b>porque · pois · dado que · visto que · já que</div></div>`},
 {t:'O que é uma proposição?',h:`<p>Uma <b>frase declarativa com valor de verdade</b>: pode ser verdadeira ou falsa.</p><ul class="ck"><li class="y">Lisboa é a capital de Portugal. (V)</li><li class="y">Todos os peixes voam. (F, mas é proposição!)</li><li class="n">Fecha a porta. (ordem)</li><li class="n">Que horas são? (pergunta)</li><li class="n">Oxalá chova. (desejo / prece)</li></ul><p class="note">Ordens, perguntas, pedidos, desejos e preces não são verdadeiros nem falsos.</p>`},
 {t:'Argumentos dedutivos e indutivos',h:`<div class="box"><b>Dedutivo</b><p>Premissas verdadeiras → conclusão <b>necessariamente</b> verdadeira. A lógica formal estuda estes.</p>${EX(['Se chover, a rua ficará molhada.','Está a chover.'],'Logo, a rua ficará molhada.')}</div><div class="box"><b>Indutivo</b><p>A conclusão é apenas <b>provável</b>: vai além do que as premissas garantem (generaliza ou prevê).</p>${EX(['Nos últimos dez testes, o João teve positiva.'],'Portanto, o João terá positiva no próximo teste.')}</div>`},
],
2:[
 {t:'Verdade, validade e solidez',h:`<div class="box b1"><b>Verdade</b><p>É das <b>proposições</b> (premissas e conclusão), não dos argumentos. Depende do <b>conteúdo</b>: corresponde ou não à realidade?</p><span class="tag">proposições: V ou F</span></div><div class="box b2"><b>Validade</b><p>É dos <b>argumentos</b>. Depende só da <b>forma</b>: a conclusão segue-se <b>necessariamente</b> das premissas?</p><span class="tag">argumentos: válido ou inválido</span></div><div class="box b3"><b>Solidez</b><p>Argumento <b>válido</b> + <b>premissas verdadeiras</b>. É o "bom argumento" que a filosofia procura.</p><span class="tag">sólido = válido + tudo V</span></div>`},
 {t:'O teste da validade',h:`<div class="warn"><b>É possível as premissas serem verdadeiras e a conclusão falsa?</b><br>Se <b>sim</b> → inválido. Se <b>não</b> (é impossível) → válido.</div><p><b>A única combinação impossível:</b> argumento válido, premissas verdadeiras e conclusão falsa.</p>`},
 {t:'Os 4 casos',h:`<div class="case ok"><span>SÓLIDO</span><b>Válido + premissas verdadeiras</b>${EX(['Todas as novelas são obras narrativas.','Amor de Perdição é uma novela.'],'Logo, Amor de Perdição é uma obra narrativa.')}</div><div class="case mid"><span>NÃO SÓLIDO</span><b>Válido + premissa falsa</b>${EX(['Todos os ditadores são imperadores. (F)','Júlio César foi ditador.'],'Logo, Júlio César foi imperador. (F)')}</div><div class="case no"><span>NÃO SÓLIDO</span><b>Inválido, mesmo com tudo V</b>${EX(['Se Pessoa escreveu Mensagem, então era escritor.','Pessoa era escritor.'],'Logo, Pessoa escreveu Mensagem.')}</div><div class="case no"><span>NÃO SÓLIDO</span><b>Inválido + conclusão falsa</b>${EX(['Se A Noite Estrelada é uma aguarela, então é uma pintura.','A Noite Estrelada não é uma aguarela.'],'Logo, não é uma pintura. (F)')}</div>`},
 {t:'Regras de ouro',h:`<ul class="dots"><li>Todo o argumento sólido é válido; <b>nem todo o válido é sólido</b>.</li><li>Premissas e conclusão verdadeiras <b>não</b> tornam um argumento válido.</li><li>Uma conclusão falsa não prova que o argumento é inválido: pode ter uma premissa falsa.</li><li>Conclusão "solta", sem ligação às premissas → inválido. Ex.: "David é uma personagem bíblica. Logo, Da Vinci era crente."</li></ul>`},
 {t:'Formas a reconhecer logo',h:`<table class="st"><tr><th>Forma</th><th>Esquema</th><th></th></tr><tr><td>Modus ponens</td><td>P→Q, P ∴ Q</td><td class="g">válido</td></tr><tr><td>Modus tollens</td><td>P→Q, ¬Q ∴ ¬P</td><td class="g">válido</td></tr><tr><td>Afirmar o consequente</td><td>P→Q, Q ∴ P</td><td class="r">inválido</td></tr><tr><td>Negar o antecedente</td><td>P→Q, ¬P ∴ ¬Q</td><td class="r">inválido</td></tr></table><p class="note">O exemplo de Pessoa é "afirmar o consequente"; o da Noite Estrelada é "negar o antecedente".</p>`},
],
3:[
 {t:'Proposição categórica',h:`<p>Afirma ou nega algo <b>sem condições e sem alternativas</b> (sem "se", sem "ou"). Tem sempre a forma:</p><div class="formula">quantificador + sujeito (S) + é / não é + predicado (P)</div><div class="two"><div><b>Quantidade</b> (olha para o sujeito)<br>Universal: fala de <b>todos</b> os S (A, E).<br>Particular: fala de <b>alguns</b>, ou seja, de pelo menos um S (I, O).</div><div><b>Qualidade</b> (olha para o verbo)<br>Afirmativa: "é" (A, I).<br>Negativa: "não é" (E, O).<br><i>Truque: AffIrmo (A, I) · nEgO (E, O).</i></div></div>`},
 {t:'Os quatro tipos',h:`<div class="aeio"><div><span>A</span><b>Universal afirmativa</b> · Todo o S é P<br>Todo o aluno é estudioso.<i>Pistas: todos · qualquer · cada</i></div><div><span>E</span><b>Universal negativa</b> · Nenhum S é P<br>Nenhum aluno é estudioso.<i>Pistas: nenhum · não há · todo o S não é</i></div><div><span>I</span><b>Particular afirmativa</b> · Algum S é P<br>Alguns alunos são estudiosos.<i>Pistas: alguns · certos · há pelo menos um</i></div><div><span>O</span><b>Particular negativa</b> · Algum S não é P<br>Alguns alunos não são estudiosos.<i>Pistas: alguns não · muitos não · existe um que não</i></div></div>`},
 {t:'Traduzir frases do dia a dia',h:`<table class="st"><tr><td>Os mamíferos bebem leite.</td><td class="k">A</td></tr><tr><td>Qualquer mamífero bebe leite.</td><td class="k">A</td></tr><tr><td>Não há mamífero que voe.</td><td class="k">E</td></tr><tr><td>A maior parte dos mamíferos não tem penas.</td><td class="k">O</td></tr><tr><td>Certos mamíferos são aquáticos.</td><td class="k">I</td></tr><tr><td>Há pelo menos um mamífero que põe ovos.</td><td class="k">I</td></tr><tr><td>Existe pelo menos um mamífero que não amamenta.</td><td class="k">O</td></tr><tr><td>Muitos mamíferos não são aquáticos.</td><td class="k">O</td></tr></table>`},
 {t:'Atenção ao "alguns"',h:`<div class="warn">Em lógica, "alguns" = <b>pelo menos um</b>. Não quer dizer "a maior parte", nem "só alguns".</div><p>"A maior parte" e "muitos" entram nas particulares (I ou O), mas I não significa "a maior parte".</p><p>"Todo o S não é P" = Nenhum S é P → <b>tipo E</b>.</p>`},
],
4:[
 {t:'O quadrado da oposição',h:`<div class="sq"><div class="c a"><span>A</span>Todo o acto é premeditado.<i>universal afirmativa</i></div><div class="c e"><span>E</span>Nenhum acto é premeditado.<i>universal negativa</i></div><div class="c i"><span>I</span>Alguns actos são premeditados.<i>particular afirmativa</i></div><div class="c o"><span>O</span>Alguns actos não são premeditados.<i>particular negativa</i></div></div><p class="note">A–E: contrárias · I–O: subcontrárias · diagonais (A–O, E–I): contraditórias · A→I e E→O: subalternas.</p>`},
 {t:'Como negar uma proposição',h:`<p>A negação de uma proposição é a sua <b>contraditória</b> (a diagonal). Trocam-se duas coisas ao mesmo tempo:</p><ul class="dots"><li>a <b>quantidade</b>: universal ↔ particular (todos ↔ alguns);</li><li>a <b>qualidade</b>: afirmativa ↔ negativa (é ↔ não é).</li></ul><div class="formula">A "Todos são" ⟷ O "Alguns não são"<br>E "Nenhum é" ⟷ I "Alguns são"</div><div class="warn">Negar "Todos os políticos mentem" <b>não</b> é "Nenhum mente": é "<b>Alguns não mentem</b>".</div>`},
 {t:'As quatro relações',h:`<div class="box"><b>Contraditórias (A–O, E–I)</b><p>Têm sempre valores de verdade opostos: uma é V e a outra é F. Nunca as duas V, nunca as duas F.</p></div><div class="box"><b>Contrárias (A–E)</b><p>Não podem ser ambas verdadeiras, mas podem ser ambas falsas. Ex.: as duas são F se só alguns actos forem premeditados.</p></div><div class="box"><b>Subcontrárias (I–O)</b><p>Não podem ser ambas falsas, mas podem ser ambas verdadeiras. Pelo menos uma é V.</p></div><div class="box"><b>Subalternas (A→I, E→O)</b><p>Se a universal é V, a particular também é V (a verdade "desce"). Se a particular é F, a universal também é F.</p></div>`},
],
5:[
 {t:'O que é uma conectiva?',h:`<p>Uma conectiva (ou <b>operador verofuncional</b>) liga ou altera proposições. Com ela formamos proposições <b>complexas</b> (compostas) a partir de proposições <b>simples</b> (elementares), que representamos com letras: P, Q, R…</p><div class="formula">P: Está sol · Q: Vou à praia</div>`},
 {t:'As seis conectivas',h:`<table class="st"><tr><th></th><th>Nome</th><th>Em português</th><th>Forma</th></tr><tr><td class="k">¬</td><td>Negação</td><td>não · não é verdade que · é falso que · é mentira que</td><td>¬P</td></tr><tr><td class="k">∧</td><td>Conjunção</td><td>e · mas · tanto… como… · contudo · embora</td><td>P∧Q</td></tr><tr><td class="k">∨</td><td>Disjunção inclusiva</td><td>ou (pode ser um, outro ou os dois)</td><td>P∨Q</td></tr><tr><td class="k">⊻</td><td>Disjunção exclusiva</td><td>ou… ou… (um ou outro, não os dois)</td><td>P⊻Q</td></tr><tr><td class="k">→</td><td>Condicional</td><td>se… então… · Q se P · Q caso P</td><td>P→Q</td></tr><tr><td class="k">↔</td><td>Bicondicional</td><td>se e só se · quando e só quando</td><td>P↔Q</td></tr></table>`},
 {t:'Formalizar em 3 passos',h:`<ol class="num"><li>Encontrar as proposições simples e escrevê-las na <b>afirmativa</b> (o "não" fica para o símbolo ¬).</li><li>Fazer o <b>dicionário</b>: P = …, Q = …, R = …</li><li>Identificar as conectivas e usar <b>parênteses</b> para mostrar o que vai junto.</li></ol><div class="box"><p>"Se Galileu defendeu o heliocentrismo, então entrou em conflito com as ideias da época e foi julgado."</p><p class="note">P: Galileu defendeu o heliocentrismo · Q: entrou em conflito… · R: foi julgado</p><div class="formula">P → (Q ∧ R)</div></div>`},
 {t:'As armadilhas',h:`<ul class="dots"><li>"mas", "contudo", "embora" = conjunção <b>∧</b>.</li><li>"Q se P" = <b>P → Q</b>. A condição (o que vem a seguir ao "se") é sempre o antecedente.<br><i>"Amanhã não vais à escola se te constipares" → P → ¬Q</i> (P = te constipares; Q = vais à escola)</li><li>"Não é verdade que…" no início nega tudo: <b>¬(P ∧ Q)</b> ≠ ¬P ∧ Q, que só nega o P.</li><li>"ou… ou…" → <b>⊻</b> · "ou" sozinho → <b>∨</b>.</li><li>"nem… nem…" = <b>¬P ∧ ¬Q</b>.</li><li>"Tanto existe maldade como bondade" = <b>P ∧ Q</b>.</li></ul>`},
 {t:'Exemplos dos exercícios',h:`<div class="box"><p>Não é verdade que a Revolução Francesa tenha influenciado a política europeia e não tenha alterado a sociedade francesa.</p><div class="formula">¬(P ∧ ¬Q)</div></div><div class="box"><p>Se Platão influenciou a filosofia e Aristóteles a ciência medieval, então a cultura europeia não se desenvolveu sem a herança grega.</p><div class="formula">(P ∧ Q) → ¬R</div></div>`},
],
6:[
 {t:'Quando é que cada conectiva é verdadeira',h:`<div class="tts"><table class="st tt"><tr><th>P</th><th>¬P</th></tr><tr><td>V</td><td>F</td></tr><tr><td>F</td><td>V</td></tr><tr><td colspan="2" class="cap">Negação: troca o valor</td></tr></table>${[['∧','Conjunção','VFFF','Só é V se as duas forem V.'],['∨','Disjunção inclusiva','VVVF','Só é F se as duas forem F.'],['⊻','Disjunção exclusiva','FVVF','É F se as duas tiverem o mesmo valor.'],['→','Condicional','VFVV','Só é F se P for V e Q for F.'],['↔','Bicondicional','VFFV','É V se as duas tiverem o mesmo valor.']].map(([s,n,c,d])=>`<table class="st tt"><tr><th>P</th><th>Q</th><th>${s}</th></tr>${['VV','VF','FV','FF'].map((r,i)=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="k">${c[i]}</td></tr>`).join('')}<tr><td colspan="3" class="cap"><b>${n}</b>: ${d}</td></tr></table>`).join('')}</div>`},
 {t:'Truque para a condicional',h:`<p>Pensa numa <b>promessa</b>: "Se tiveres positiva, então dou-te um prémio."</p><p>Só mentiste (F) se ele <b>teve positiva e não recebeu o prémio</b>.</p><p>Se não teve positiva, a promessa não foi quebrada (V).</p>`},
 {t:'Quantas linhas tem a tabela?',h:`<p>Com <b>n</b> proposições simples há <b>2ⁿ</b> linhas: 2 letras → 4 · 3 letras → 8 · 4 letras → 16.</p><p>Na 1.ª coluna, metade V e metade F; em cada coluna seguinte, os blocos ficam com metade do tamanho. A última coluna alterna V, F, V, F… Assim aparecem todas as combinações, sem repetir nenhuma.</p><table class="st tt"><tr><th>P</th><th>Q</th><th>R</th></tr>${['VVV','VVF','VFV','VFF','FVV','FVF','FFV','FFF'].map(r=>`<tr>${[...r].map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`},
 {t:'Exemplo resolvido: ¬(P ∧ ¬Q)',h:`<p>Resolve-se de dentro para fora, uma coluna de cada vez:</p><ol class="num"><li>Colunas de P e Q (4 combinações).</li><li>¬Q: troca os valores de Q.</li><li>P ∧ ¬Q: V só quando P e ¬Q são V.</li><li>¬(…): troca o resultado do passo 3.</li></ol><table class="st tt"><tr><th>P</th><th>Q</th><th>¬Q</th><th>P∧¬Q</th><th>¬(P∧¬Q)</th></tr><tr><td>V</td><td>V</td><td>F</td><td>F</td><td class="k">V</td></tr><tr><td>V</td><td>F</td><td>V</td><td>V</td><td class="k">F</td></tr><tr><td>F</td><td>V</td><td>F</td><td>F</td><td class="k">V</td></tr><tr><td>F</td><td>F</td><td>V</td><td>F</td><td class="k">V</td></tr></table><p class="note">Curiosidade: o resultado (V F V V) é igual ao de P → Q. As duas fórmulas são equivalentes.</p>`},
],
};

// Matemática A — Funções: cartões de estudo (a partir do resumo da Susana). Gráficos desenhados em SVG.
window.CHREG=window.CHREG||[];
function PL(o){
 const W=300,H=o.h||200,pad=16,[x0,x1,y0,y1]=o.r;
 const id=CHREG.push({W,H,x0,x1,y0,y1,L:pad,R:pad,T:pad,B:pad,ax:'pl',c:(o.c||[]).map(c=>({f:c.f,d:c.d,p:c.p})),pt:(o.pt||[]).map(p=>[p[0],p[1]])})-1;
 const X=x=>pad+(x-x0)/(x1-x0)*(W-2*pad), Y=y=>H-pad-(y-y0)/(y1-y0)*(H-2*pad);
 let g='';
 if(o.grid!==false){for(let x=Math.ceil(x0);x<=x1;x++)g+=`<line x1="${X(x)}" y1="${Y(y0)}" x2="${X(x)}" y2="${Y(y1)}" style="stroke:var(--line)" stroke-width=".6"/>`;
  for(let y=Math.ceil(y0);y<=y1;y++)g+=`<line x1="${X(x0)}" y1="${Y(y)}" x2="${X(x1)}" y2="${Y(y)}" style="stroke:var(--line)" stroke-width=".6"/>`}
 g+=`<line x1="${X(x0)}" y1="${Y(0)}" x2="${X(x1)}" y2="${Y(0)}" style="stroke:var(--muted)" stroke-width="1.2"/><line x1="${X(0)}" y1="${Y(y0)}" x2="${X(0)}" y2="${Y(y1)}" style="stroke:var(--muted)" stroke-width="1.2"/>`;
 g+=`<text x="${X(x1)-4}" y="${Y(0)-5}" font-size="10" text-anchor="end" style="fill:var(--muted)" font-style="italic">${o.xl||'x'}</text><text x="${X(0)+5}" y="${Y(y1)+10}" font-size="10" style="fill:var(--muted)" font-style="italic">${o.yl||'y'}</text>`;
 if(o.ticks!==false){for(let x=Math.ceil(x0);x<=x1;x++)if(x&&(o.tx||1)&&x%(o.tx||1)===0)g+=`<text x="${X(x)}" y="${Y(0)+11}" font-size="8" text-anchor="middle" style="fill:var(--muted)">${String(x).replace('-','−')}</text>`;
  for(let y=Math.ceil(y0);y<=y1;y++)if(y&&y%(o.ty||1)===0)g+=`<text x="${X(0)-4}" y="${Y(y)+3}" font-size="8" text-anchor="end" style="fill:var(--muted)">${String(y).replace('-','−')}</text>`}
 (o.c||[]).forEach(c=>{let pts=c.p;if(c.f){pts=[];const a=c.d?c.d[0]:x0,b=c.d?c.d[1]:x1;for(let i=0;i<=120;i++){const x=a+(b-a)*i/120,y=c.f(x);if(y>=y0-1&&y<=y1+1)pts.push([x,y]);else pts.push(null)}}
  let d='',pen=false;pts.forEach(p=>{if(!p){pen=false;return}d+=(pen?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)+' ';pen=true});
  g+=`<path d="${d}" fill="none" style="stroke:${c.col||'var(--ink)'}" stroke-width="${c.w||2}" ${c.dash?'stroke-dasharray="4 3"':''} stroke-linejoin="round"/>`});
 (o.seg||[]).forEach(([a,b,col])=>{g+=`<line x1="${X(a)}" y1="${Y(0)}" x2="${X(b)}" y2="${Y(0)}" style="stroke:${col}" stroke-width="4"/>`});
 (o.pt||[]).forEach(([x,y,open,lab,dx,dy])=>{g+=`<circle cx="${X(x)}" cy="${Y(y)}" r="3.4" style="fill:${open?'var(--card)':'var(--accent)'};stroke:var(--accent)" stroke-width="1.5"/>`;if(lab)g+=`<text x="${X(x)+(dx||5)}" y="${Y(y)+(dy||-6)}" font-size="9" font-weight="600" style="fill:var(--accent)">${lab}</text>`});
 (o.lab||[]).forEach(([x,y,t,anc])=>{g+=`<text x="${X(x)}" y="${Y(y)}" font-size="9" text-anchor="${anc||'start'}" style="fill:var(--ink)">${t}</text>`});
 const hint=(H>=150&&((o.c||[]).length||(o.pt||[]).length))?'<div class="chhint">Toca no gráfico para ler os valores</div>':'';
 return `<svg data-ch="${id}" viewBox="0 0 ${W} ${H}" style="width:100%;max-width:420px;display:block;margin:0 auto;cursor:crosshair" font-family="inherit">${g}</svg>${hint}`}
const mini=(f,cap,col)=>`<div style="text-align:center;font-size:12px">${PL({r:[-3,3,-3,3],h:120,ticks:false,c:[{f,col:col||'var(--ink)'}]})}${cap}</div>`;
const G3=(a,b,c)=>`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${a}${b}${c}</div>`;
const MODEL=PL({r:[-6,7,-3,4],h:220,c:[{p:[[-5,-1],[-3,3],[2,-2],[6,2]]}],seg:[[-4.5,0,'#2d5fa8'],[4,6,'#2d5fa8'],[-5,-4.5,'#c0552b'],[0,4,'#c0552b']],
 pt:[[-5,-1,0,'mín. rel. −1',-20,14],[-3,3,0,'máx. abs. 3',-28,-7],[2,-2,0,'mín. abs. −2',-22,15],[6,2,0,'máx. rel. 2',-48,-7],[-4.5,0,0],[0,0,0],[4,0,0]]});
const STUDY_MA={
1:[
 {t:'A ideia principal',h:`<p>Uma <b>função f de A em B</b> é uma regra que associa a <b>cada</b> elemento x de A <b>um e um só</b> elemento y = f(x) de B.</p><div class="formula">f : A → B, &nbsp;x ↦ f(x)</div><div class="warn">Cada objeto tem só uma imagem. Dois objetos podem ter a mesma imagem — isso é permitido.</div><div class="box"><b>Exemplo: f(x) = 2x</b><p>A = {1, 2, 3} &nbsp;→&nbsp; B = {2, 4, 6, 8}<br>1 ↦ 2 · 2 ↦ 4 · 3 ↦ 6</p><p class="note">O 8 não é imagem de ninguém: o contradomínio é {2, 4, 6} e o conjunto de chegada é {2, 4, 6, 8}.</p></div>`},
 {t:'Vocabulário',h:`<table class="st"><tr><td><b>Objeto</b></td><td>Um valor x do domínio (variável independente).</td></tr><tr><td><b>Imagem</b></td><td>O valor f(x) que corresponde a x (variável dependente).</td></tr><tr><td><b>Domínio D<sub>f</sub></b></td><td>Conjunto de todos os objetos (os valores que podemos usar).</td></tr><tr><td><b>Conjunto de chegada</b></td><td>Onde as imagens "podem cair" (no exemplo, B).</td></tr><tr><td><b>Contradomínio D′<sub>f</sub></b></td><td>Conjunto das imagens que são mesmo atingidas. Está dentro do conjunto de chegada.</td></tr><tr><td><b>Gráfico</b></td><td>Conjunto de todos os pontos (x, f(x)) com x no domínio.</td></tr></table>`},
 {t:'4 formas de representar a mesma função',h:`<div class="two"><div><b>Tabela</b><table class="st tt"><tr><td>x</td><td>1</td><td>2</td><td>3</td></tr><tr><td>f(x)</td><td>2</td><td>4</td><td>6</td></tr></table></div><div><b>Expressão</b>f(x) = 2x, com x ∈ {1, 2, 3}</div><div><b>Gráfico</b>${PL({r:[-0.5,4,-0.5,7],h:150,pt:[[1,2],[2,4],[3,6]],ty:2})}</div><div><b>Em palavras</b>"A cada número de A faz corresponder o seu dobro."</div></div>`},
 {t:'Teste da reta vertical',h:`<p>Um desenho é gráfico de uma função se <b>qualquer reta vertical</b> o cortar <b>no máximo uma vez</b>.</p><p>Se alguma reta vertical corta em 2 pontos, há um x com 2 imagens → <b>não é função</b>.</p><div class="two"><div style="text-align:center"><b style="color:var(--ok)">✓ É função</b>${PL({r:[-3,3,-3,3],h:140,ticks:false,c:[{f:x=>x*x/2-1.5},{p:[[1,-3],[1,3]],col:'var(--muted)',dash:1,w:1.2}]})}</div><div style="text-align:center"><b style="color:var(--bad)">✗ Não é função</b>${PL({r:[-3,3,-3,3],h:140,ticks:false,c:[{p:Array.from({length:61},(_,i)=>{const t=i/60*2*Math.PI;return[2*Math.cos(t),2*Math.sin(t)]})},{p:[[1,-3],[1,3]],col:'var(--muted)',dash:1,w:1.2}],pt:[[1,1.732],[1,-1.732]]})}</div></div>`},
 {t:'Domínio, imagens e objetos',h:`<div class="box"><b>Domínio a partir da expressão</b><p>Sem restrições, o domínio é ℝ (todos os reais).</p><p>Num contexto real só vale o que faz sentido (ex.: tempo t ≥ 0).</p></div><div class="box"><b>Calcular imagens e objetos</b><p><b>Imagem de 3:</b> substituir → f(3).</p><p><b>Objeto(s) com imagem 5:</b> resolver a equação f(x) = 5.</p></div>`},
],
2:[
 {t:'O exemplo-modelo',h:`<p>Quase tudo nos testes começa por <b>ler um gráfico</b>. Função f de domínio [−5, 6]:</p><div class="fig">${MODEL}<div class="fs"><span style="color:#2d5fa8">■</span> f(x) &gt; 0 (acima do eixo) · <span style="color:#c0552b">■</span> f(x) &lt; 0 (abaixo do eixo) · ● zeros: −4,5; 0; 4</div></div><p>Cresce em [−5, −3], decresce em [−3, 2], cresce em [2, 6].</p>`},
 {t:'Tabela de variação (monotonia)',h:`<div class="fig">${MODEL}</div><table class="st tt"><tr><th>x</th><th>−5</th><th></th><th>−3</th><th></th><th>2</th><th></th><th>6</th></tr><tr><td><b>f(x)</b></td><td>−1</td><td>↗</td><td>3</td><td>↘</td><td>−2</td><td>↗</td><td>2</td></tr><tr><td>ext.</td><td>mín.</td><td></td><td>máx.</td><td></td><td>mín.</td><td></td><td>máx.</td></tr></table><p>Crescente em [−5, −3] e em [2, 6]; decrescente em [−3, 2].</p>`},
 {t:'Tabela de sinal (zeros e sinal)',h:`<div class="fig">${MODEL}</div><table class="st tt"><tr><th>x</th><th>−5</th><th></th><th>−4,5</th><th></th><th>0</th><th></th><th>4</th><th></th><th>6</th></tr><tr><td><b>f(x)</b></td><td>−</td><td style="color:#c0552b">−</td><td>0</td><td style="color:#2d5fa8">+</td><td>0</td><td style="color:#c0552b">−</td><td>0</td><td style="color:#2d5fa8">+</td><td>+</td></tr></table><p>Zeros: −4,5; 0; 4. Contradomínio: [−2, 3]. Ordenada na origem: f(0) = 0.</p>`},
 {t:'Zeros, monotonia e extremos',h:`<div class="box b1"><b>Zeros e sinal</b><p><b>Zero</b> = objeto cuja imagem é 0 → onde o gráfico <b>toca o eixo x</b>. Resolve-se f(x) = 0.</p><p><b>Positiva:</b> gráfico acima do eixo x. <b>Negativa:</b> abaixo.</p></div><div class="box b2"><b>Monotonia</b><p><b>Crescente:</b> quando x aumenta, f(x) aumenta (o gráfico "sobe" da esquerda para a direita).</p><p><b>Decrescente:</b> "desce". <b>Constante:</b> fica igual (segmento horizontal).</p></div><div class="box b3"><b>Extremos</b><p><b>Absoluto:</b> o maior/menor valor de toda a função. <b>Relativo:</b> o maior/menor só ali à volta.</p><p>O <b>máximo</b> é um y; o <b>maximizante</b> é o x onde acontece.</p></div><div class="warn">Os intervalos de monotonia escrevem-se com valores de <b>x</b>; o contradomínio escreve-se com valores de <b>y</b>. Um extremo absoluto é sempre também relativo.</div>`},
],
3:[
 {t:'Função afim f(x) = mx + b',h:`<p>O gráfico é uma <b>reta</b>.</p><ul class="dots"><li><b>m = declive:</b> m &gt; 0 crescente · m &lt; 0 decrescente · m = 0 constante.</li><li><b>b = ordenada na origem</b> (onde corta o eixo y).</li><li><b>Zero:</b> mx + b = 0 ⇔ x = −b/m (se m ≠ 0).</li><li>A partir de 2 pontos: <b>m = (y₂ − y₁) / (x₂ − x₁)</b>.</li><li>Se b = 0: f(x) = mx é <b>linear</b> (proporcionalidade direta).</li></ul>${G3(mini(x=>x*0.8+0.3,'m &gt; 0 ↗'),mini(x=>-x*0.8+0.3,'m &lt; 0 ↘'),mini(()=>1,'m = 0 →'))}`},
 {t:'Quadrática: 3 formas de escrever',h:`<p>O gráfico é uma <b>parábola</b>. A mesma função pode aparecer escrita de 3 formas, e cada uma "mostra" uma coisa diferente:</p><div class="box"><b>Forma geral: ax² + bx + c</b><p>a ≠ 0. Mostra a ordenada na origem: f(0) = c.</p><p class="note">Ex.: x² − 2x − 3</p></div><div class="box"><b>Forma canónica: a(x − h)² + k</b><p>Mostra o vértice V(h, k) e o eixo x = h.</p><p class="note">Ex.: (x − 1)² − 4</p></div><div class="box"><b>Forma fatorizada: a(x − x₁)(x − x₂)</b><p>Mostra os zeros x₁ e x₂ (só existe se houver zeros).</p><p class="note">Ex.: (x + 1)(x − 3)</p></div>`},
 {t:'Exemplo: f(x) = x² − 2x − 3',h:`<div class="fig">${PL({r:[-3,5,-5,5],h:220,c:[{f:x=>x*x-2*x-3},{p:[[1,-5],[1,5]],col:'var(--muted)',dash:1,w:1}],pt:[[-1,0,0,'zero',-24,-6],[3,0,0,'zero',4,-6],[1,-4,0,'V(1, −4)',6,4],[0,-3,0,'f(0) = −3',-52,4]],lab:[[1.1,4.5,'eixo: x = 1']]})}</div><ol class="num"><li><b>Vértice:</b> h = −b / (2a) = 2/2 = 1 e k = f(1) = −4.</li><li><b>Concavidade</b> (sinal de a): a &gt; 0 ∪ → tem mínimo · a &lt; 0 ∩ → tem máximo.</li><li><b>Zeros:</b> −1 e 3. <b>D′</b> = [−4, +∞[. Decrescente em ]−∞, 1], crescente em [1, +∞[.</li></ol><div class="warn"><b>Truque:</b> os zeros são simétricos em relação ao eixo. O vértice está a meio: h = (x₁ + x₂)/2 = (−1 + 3)/2 = 1.</div>`},
 {t:'Concavidade',h:`<div class="two"><div style="text-align:center">${PL({r:[-3,3,-3,3],h:140,ticks:false,c:[{f:x=>x*x-2}]})}<b>a &gt; 0 ∪</b>tem mínimo</div><div style="text-align:center">${PL({r:[-3,3,-3,3],h:140,ticks:false,c:[{f:x=>-x*x+2}]})}<b>a &lt; 0 ∩</b>tem máximo</div></div>`},
],
4:[
 {t:'Fórmula resolvente',h:`<p>Para ax² + bx + c = 0, com a ≠ 0:</p><div class="formula" style="font-size:18px">x = <span style="display:inline-block;vertical-align:middle;text-align:center"><span style="display:block;border-bottom:1.5px solid currentColor;padding:0 4px">−b ± √(b² − 4ac)</span><span style="display:block">2a</span></span></div><p>O que está dentro da raiz é o <b>binómio discriminante</b>:</p><div class="formula">Δ = b² − 4ac</div>`},
 {t:'O discriminante diz quantos zeros há',h:`<p><b>a &gt; 0</b> (∪)</p>${G3(`<div style="text-align:center;font-size:12px">${PL({r:[-3,3,-3,3],h:260,ticks:false,c:[{f:x=>x*x-2,w:4}]})}<b>Δ &gt; 0</b><br>2 zeros</div>`,`<div style="text-align:center;font-size:12px">${PL({r:[-3,3,-3,3],h:260,ticks:false,c:[{f:x=>x*x,w:4}]})}<b>Δ = 0</b><br>1 zero (duplo)</div>`,`<div style="text-align:center;font-size:12px">${PL({r:[-3,3,-3,3],h:260,ticks:false,c:[{f:x=>x*x+1,w:4}]})}<b>Δ &lt; 0</b><br>nenhum zero</div>`)}<p><b>a &lt; 0</b> (∩)</p>${G3(`<div style="text-align:center;font-size:12px">${PL({r:[-3,3,-3,3],h:260,ticks:false,c:[{f:x=>-x*x+2,w:4}]})}<b>Δ &gt; 0</b><br>2 zeros</div>`,`<div style="text-align:center;font-size:12px">${PL({r:[-3,3,-3,3],h:260,ticks:false,c:[{f:x=>-x*x,w:4}]})}<b>Δ = 0</b><br>1 zero (duplo)</div>`,`<div style="text-align:center;font-size:12px">${PL({r:[-3,3,-3,3],h:260,ticks:false,c:[{f:x=>-x*x-1,w:4}]})}<b>Δ &lt; 0</b><br>nenhum zero</div>`)}<div class="warn">Δ &lt; 0 não quer dizer "erro": a função existe, só que o gráfico nunca toca o eixo x (é sempre positiva ou sempre negativa).</div>`},
 {t:'Equações incompletas (sem fórmula!)',h:`<div class="box"><b>Sem c: ax² + bx = 0</b><p>Põe x em evidência: x(ax + b) = 0 ⇔ x = 0 ∨ x = −b/a</p></div><div class="box"><b>Sem b: ax² + c = 0</b><p>⇔ x² = −c/a → x = ±√(−c/a) (se −c/a ≥ 0)</p></div><div class="box"><b>Já fatorizada</b><p>Lei do anulamento do produto: A·B = 0 ⇔ A = 0 ∨ B = 0</p></div>`},
 {t:'Inequações do 2.º grau em 4 passos',h:`<p class="note">Ex.: x² − x − 6 ≤ 0</p><ol class="num"><li>Passar tudo para um lado (do outro fica 0).</li><li>Achar os zeros: Δ = 1 + 24 = 25 → x = (1 ± 5)/2 → −2 e 3.</li><li>Esboçar a parábola: a = 1 &gt; 0 → ∪.</li><li>Ler onde está abaixo (≤ 0) ou acima (≥ 0) do eixo.</li></ol><div class="fig">${PL({r:[-4,5,-7,7],h:200,ty:2,c:[{f:x=>x*x-x-6}],seg:[[-2,3,'#2f7d5b']],pt:[[-2,0,0,'−2',-14,-6],[3,0,0,'3',4,-6]],lab:[[0.5,-4.5,'≤ 0 aqui','middle']]})}</div><p><b>≤ 0</b> → x ∈ [−2, 3] ("entre os zeros")<br><b>&gt; 0</b> → x ∈ ]−∞, −2[ ∪ ]3, +∞[ ("fora")</p><div class="warn">Com ≤ ou ≥ os zeros entram (parêntese reto [ ] virado para dentro); com &lt; ou &gt; ficam de fora.</div>`},
],
5:[
 {t:'A regra de ouro',h:`<div class="warn"><b>Mexer fora de f</b> → afeta o y (vertical, faz o que parece).<br><b>Mexer dentro</b> → afeta o x (horizontal, faz o contrário).</div><p class="note">Nos gráficos seguintes: tracejado = gráfico original de f · cheio = gráfico transformado.</p>`},
 {t:'Translações',h:`${(()=>{const f=x=>0.5*(x-0)*(x-0)-1.5;return `<div class="two"><div><b>f(x) + 1 · translação vertical</b>${PL({r:[-3,3,-3,3],h:140,ticks:false,c:[{f,dash:1,col:'var(--muted)'},{f:x=>f(x)+1,col:'#3b82d6'}]})}Sobe 1. Se fosse −1, descia.<br>Ponto: (x, y) → (x, y + 1)</div><div><b>f(x + 2) · translação horizontal</b>${PL({r:[-4,3,-3,3],h:140,ticks:false,c:[{f,dash:1,col:'var(--muted)'},{f:x=>f(x+2),col:'#3b82d6'}]})}Anda 2 para a <strong>esquerda</strong>! O sinal é o contrário do que parece.<br>Ponto: (x, y) → (x − 2, y)</div></div>`})()}`},
 {t:'Dilatação e contração',h:`${(()=>{const f=x=>Math.sin(x*1.2)*1.2;return `<div class="two"><div><b>2 · f(x) · dilatação vertical</b>${PL({r:[-3,3,-3,3],h:140,ticks:false,c:[{f,dash:1,col:'var(--muted)'},{f:x=>2*f(x),col:'#3b82d6'}]})}Estica na vertical. Com 0 &lt; a &lt; 1 encolhe. Os zeros não mudam.<br>Ponto: (x, y) → (x, 2y)</div><div><b>f(2x) · contração horizontal</b>${PL({r:[-3,3,-3,3],h:140,ticks:false,c:[{f,dash:1,col:'var(--muted)'},{f:x=>f(2*x),col:'#3b82d6'}]})}Aperta na horizontal (divide os x por 2). A ordenada na origem não muda.<br>Ponto: (x, y) → (x/2, y)</div></div>`})()}`},
 {t:'Reflexões',h:`${(()=>{const f=x=>0.4*x*x*x/2+0.5*x+0.6;return `<div class="two"><div><b>−f(x) · reflexão no eixo x</b>${PL({r:[-3,3,-3,3],h:140,ticks:false,c:[{f,dash:1,col:'var(--muted)'},{f:x=>-f(x),col:'#3b82d6'}]})}Vira de cima para baixo (é o caso a = −1).<br>Ponto: (x, y) → (x, −y)</div><div><b>f(−x) · reflexão no eixo y</b>${PL({r:[-3,3,-3,3],h:140,ticks:false,c:[{f,dash:1,col:'var(--muted)'},{f:x=>f(-x),col:'#3b82d6'}]})}Espelha esquerda ↔ direita (é o caso b = −1).<br>Ponto: (x, y) → (−x, y)</div></div>`})()}`},
 {t:'Tudo junto: a forma canónica',h:`<p><b>y = a(x − h)² + k</b> parte de y = x² e:</p><ul class="dots"><li><b>a:</b> estica/encolhe e, se negativo, vira ao contrário;</li><li><b>h:</b> anda h na horizontal (repara no menos: (x − 1) → direita 1);</li><li><b>k:</b> sobe ou desce k.</li></ul><div class="fig">${PL({r:[-3,4,-4,5],h:200,c:[{f:x=>x*x,dash:1,col:'var(--muted)'},{f:x=>2*(x-1)*(x-1)-3,col:'#3b82d6'}],pt:[[1,-3,0,'V(1, −3)',6,4]],lab:[[-2.9,4.4,'y = x²']]})}</div><p>Ex.: 2(x − 1)² − 3: o vértice passa de (0, 0) para (1, −3), e a parábola fica mais "fechada".</p><div class="formula">Ordem segura: primeiro esticar/refletir, depois transladar.</div>`},
],
6:[
 {t:'Funções definidas por ramos',h:`<p>Uma expressão diferente para cada parte do domínio.</p><div class="formula" style="text-align:left">f(x) = { x + 3 &nbsp;se x &lt; −1<br><span style="padding-left:46px">x² &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;se x ≥ −1</span></div><div class="fig">${PL({r:[-4,3,-2,5],h:200,c:[{f:x=>x+3,d:[-4,-1]},{f:x=>x*x,d:[-1,2.3]}],pt:[[-1,2,1,'não pertence',-58,-6],[-1,1,0,'pertence',6,10]]})}</div><ul class="dots"><li>Para calcular f(a): ver em que ramo cai a. <b>f(−1) = (−1)² = 1</b></li><li>● bola cheia: o ponto pertence · ○ bola vazia: não pertence.</li><li><b>Zeros:</b> resolver em cada ramo e confirmar se a solução está nesse ramo.</li></ul>`},
 {t:'Função módulo',h:`<p><b>|x| = distância de x a 0.</b> Nunca é negativa.</p><div class="formula" style="text-align:left">|x| = { x &nbsp;&nbsp;se x ≥ 0<br><span style="padding-left:34px">−x se x &lt; 0</span></div><div class="fig">${PL({r:[-3,5,-1,3.5],h:170,c:[{f:Math.abs},{f:x=>Math.abs(x-2),col:'#3b82d6'}],lab:[[-2.9,3.1,'y = |x|'],[3.2,2.6,'y = |x − 2|']]})}</div><p>Gráfico em V, vértice na origem; D′ = [0, +∞[.</p><p>|x − 2| = distância de x a 2: o V anda 2 para a direita.</p><p class="note">|5| = 5 · |−5| = 5 · |0| = 0</p>`},
 {t:'Equações e inequações com módulo',h:`<p class="note">Para k &gt; 0 (ex.: k = 3):</p><table class="st"><tr><td><b>|x| = 3</b></td><td>x = 3 ∨ x = −3</td></tr><tr><td><b>|x| &lt; 3</b> → "entre"</td><td>−3 &lt; x &lt; 3</td></tr><tr><td><b>|x| &gt; 3</b> → "fora"</td><td>x &lt; −3 ∨ x &gt; 3</td></tr><tr><td><b>|x| = 0</b></td><td>⇔ x = 0</td></tr><tr><td><b>|x| = −2</b></td><td>impossível</td></tr></table><div class="box"><b>Funciona igual com expressões</b><p>|x − 2| &lt; 3 ⇔ −3 &lt; x − 2 &lt; 3 ⇔ −1 &lt; x &lt; 5</p></div>`},
 {t:'Os 6 erros que mais custam pontos',h:`<ol class="num"><li>f(x + 2) anda para a <b>esquerda</b>, não para a direita.</li><li>Contradomínio ≠ conjunto de chegada.</li><li>Máximo é um <b>y</b>; maximizante é um <b>x</b>.</li><li>(x − 3)² tem vértice em x = 3, não em −3.</li><li>Esquecer de passar tudo para um lado antes de resolver uma inequação.</li><li>Nos ramos: esquecer de ver se a solução pertence ao ramo.</li></ol><p class="note">Pode também aparecer, conforme a escola e o professor: paridade (funções pares e ímpares), polinómios (divisão, regra de Ruffini) e taxa média de variação. Confirma no manual.</p>`},
],
};

['m3','mon','Uma função afim f(x) = ax + b é crescente quando…','a > 0',['b > 0','a < 0','b < 0'],'É o declive a que decide a monotonia: a > 0 crescente, a < 0 decrescente, a = 0 constante. O b só diz onde a reta corta o eixo y.'],
['m3','mon','A função f(x) = 4 − 2x é…','decrescente',['crescente','constante','crescente e depois decrescente'],'Escrita como f(x) = −2x + 4, tem declive a = −2 < 0, por isso é decrescente. Cuidado com a ordem: o declive é o número que acompanha o x, esteja onde estiver.'],
['m3','zero','Qual é o zero de f(x) = 2x − 6?','3',['−6','−3','6'],'Zero: f(x) = 0 ⇔ 2x − 6 = 0 ⇔ 2x = 6 ⇔ x = 3. O −6 é a ordenada na origem, não o zero.'],
['m3','zero','Qual é o zero de f(x) = −2x − 1?','−1/2',['1/2','−1','2'],'−2x − 1 = 0 ⇔ −2x = 1 ⇔ x = −1/2. Também se pode usar x = −b/a = −(−1)/(−2) = −1/2.'],
['m3','zero','Quantos zeros tem a função f(x) = 3?','Nenhum',['Um','Dois','Uma infinidade'],'f(x) = 3 é constante e nunca vale 0. Uma função constante f(x) = b com b ≠ 0 não tem zeros.'],
['m3','zero','Quantos zeros tem a função f(x) = 0?','Uma infinidade',['Nenhum','Um','Dois'],'Todos os números reais têm imagem 0, por isso todos são zeros: f tem uma infinidade de zeros.'],
['m3','sinal','Para que valores de x a função f(x) = 2x − 6 é negativa?','x ∈ ]−∞, 3[',['x ∈ ]3, +∞[','x ∈ ]−∞, −6[','x ∈ ]−6, +∞['],'O zero é 3 e a função é crescente (a = 2 > 0): antes do zero é negativa, depois é positiva. Logo f(x) < 0 para x < 3.'],
['m3','sinal','Para que valores de x a função f(x) = −x + 4 é positiva?','x ∈ ]−∞, 4[',['x ∈ ]4, +∞[','x ∈ ]−4, +∞[','x ∈ ]−∞, −4['],'O zero é 4 (−x + 4 = 0 ⇔ x = 4). Como a = −1 < 0, a reta desce: é positiva antes do zero e negativa depois.'],
['m3','sinal','Se f(x) = b com b ≠ 0, então o sinal de f…','é igual ao sinal de b para todo o x',['muda no ponto x = b','é positivo para x > 0 e negativo para x < 0','é sempre positivo'],'Uma função constante vale sempre b. Se b > 0 é sempre positiva, se b < 0 é sempre negativa.'],
['m3','dom','Qual é o contradomínio de f(x) = 3x + 1?','ℝ',['[1, +∞[','{1}','{3}'],'Se a ≠ 0, a reta é inclinada e atinge todos os valores reais: D′ = ℝ.'],
['m3','dom','Qual é o contradomínio de f(x) = −4?','{−4}',['ℝ',']−∞, −4]','{0}'],'Se a = 0, a função é constante e a única imagem é b: D′ = {b} = {−4}.'],
['m3','graf','Qual é a expressão analítica da função afim representada?','f(x) = 2x + 1',['f(x) = x + 2','f(x) = 2x − 1','f(x) = x/2 + 1'],'A reta corta o eixo y em 1, logo b = 1. Passa de (0, 1) para (1, 3): quando x aumenta 1, y aumenta 2, logo a = 2.','m3_g1'],
['m3','graf','Observa a reta, gráfico de f(x) = ax + b. Que sinais têm a e b?','a > 0 e b < 0',['a > 0 e b > 0','a < 0 e b < 0','a < 0 e b > 0'],'A reta sobe da esquerda para a direita, logo a > 0. Corta o eixo y abaixo da origem, logo b < 0.','m3_g2'],
['m3','graf','Observa a reta, gráfico de f(x) = ax + b. Que sinais têm a e b?','a < 0 e b > 0',['a > 0 e b > 0','a < 0 e b < 0','a > 0 e b < 0'],'A reta desce da esquerda para a direita, logo a < 0. Corta o eixo y acima da origem, logo b > 0.','m3_g3'],
['m3','graf','Qual é a expressão da função representada?','f(x) = 2',['f(x) = 2x','x = 2','f(x) = x + 2'],'A reta é horizontal à altura 2: todos os objetos têm imagem 2. É a função constante f(x) = 2 (a = 0, b = 2). x = 2 seria uma reta vertical, que nem sequer é função.','m3_g4'],
['m3','par','Uma reta passa nos pontos (1, 2) e (3, 8). Qual é o seu declive?','3',['2','6','1/3'],'Declive = (y₂ − y₁)/(x₂ − x₁) = (8 − 2)/(3 − 1) = 6/2 = 3. Se dividires ao contrário (2/6) obténs 1/3, que está errado.'],
// ===================== NÍVEL 4 · 4.4 y = ax² =====================
['m4','def','Uma função quadrática tem expressão f(x) = ax² + bx + c, com…','a ≠ 0',['b ≠ 0','c ≠ 0','a > 0'],'Se a fosse 0, desaparecia o x² e a função passava a ser afim. b e c podem ser 0, e a pode ser negativo.'],
['m4','def','Qual destas funções é quadrática?','f(x) = 3x − x²',['f(x) = 2x + 1','f(x) = 5/x','f(x) = x³ + 1'],'3x − x² = −x² + 3x é da forma ax² + bx + c com a = −1 ≠ 0. A ordem dos termos não importa.'],
['m4','car','Qual é o vértice da parábola de f(x) = 5x²?','(0, 0)',['(5, 0)','(0, 5)','(1, 5)'],'Todas as funções do tipo y = ax² têm vértice na origem. O a só muda a abertura e o sentido da parábola.'],
['m4','car','Qual é o eixo de simetria da parábola de f(x) = −3x²?','O eixo Oy, de equação x = 0',['O eixo Ox, de equação y = 0','A reta x = −3','A reta y = −3'],'Para y = ax², o vértice é (0, 0) e o eixo de simetria é a reta vertical que passa por ele: x = 0, que é o eixo Oy.'],
['m4','car','A parábola de f(x) = −2x² tem a concavidade…','voltada para baixo',['voltada para cima','voltada para a esquerda','depende do valor de x'],'O sinal de a decide: a > 0 concavidade para cima, a < 0 concavidade para baixo. Aqui a = −2 < 0.'],
['m4','car','Qual é o contradomínio de f(x) = 2x²?','[0, +∞[',['ℝ','[2, +∞[',']−∞, 0]'],'Com a > 0 a parábola abre para cima e o ponto mais baixo é o vértice (0, 0). As imagens são todas ≥ 0: D′ = [0, +∞[ = ℝ₀⁺.'],
['m4','car','Qual é o contradomínio de f(x) = −x²/2?',']−∞, 0]',['[0, +∞[','ℝ',']−∞, −1/2]'],'Com a < 0 a parábola abre para baixo e o ponto mais alto é o vértice (0, 0). As imagens são todas ≤ 0: D′ = ]−∞, 0] = ℝ₀⁻.'],
['m4','car','Qual é o extremo da função f(x) = 4x²?','Mínimo 0',['Máximo 0','Mínimo 4','Não tem extremos'],'Com a = 4 > 0, a concavidade é para cima e o vértice (0, 0) é o ponto mais baixo: mínimo 0, atingido em x = 0.'],
['m4','mon','Qual é a monotonia de f(x) = −x²?','Crescente em ]−∞, 0] e decrescente em [0, +∞[',['Decrescente em ]−∞, 0] e crescente em [0, +∞[','Sempre decrescente','Crescente em ℝ'],'Com a < 0 a parábola é um “monte”: sobe até ao vértice (x = 0) e depois desce.'],
['m4','sin','Qual é o conjunto de todos os valores de x para os quais f(x) = 3x² é positiva?','ℝ \\ {0}',['ℝ',']0, +∞[','∅'],'x² é positivo para qualquer x ≠ 0, e multiplicar por 3 não muda o sinal. Em x = 0 a função vale 0, por isso não é positiva aí.'],
['m4','calc','Seja f(x) = 3x². Qual é o valor de f(−2)?','12',['−12','36','−36'],'f(−2) = 3 × (−2)² = 3 × 4 = 12. Primeiro a potência, depois a multiplicação. (−2)² = 4 é positivo.'],
['m4','graf','Na figura estão os gráficos de y = x², y = 2x² e y = x²/2. Qual das curvas é o gráfico de y = 2x²?','A curva A',['A curva B','A curva C','Não é possível saber'],'Quanto maior |a|, mais “fechada” é a parábola. Para x = 1: x² dá 1, 2x² dá 2 e x²/2 dá 0,5. A curva mais fechada, A, é a de y = 2x².','m4_g1'],
['m4','graf','Qual pode ser a expressão da função representada?','y = −x²/2',['y = x²/2','y = −x²/2 + 1','y = −2x²'],'Vértice na origem e concavidade para baixo: y = ax² com a < 0. Passa em (2, −2): a × 4 = −2, logo a = −1/2.','m4_g2'],
['m4','tra','O gráfico de g(x) = 3x² obtém-se do gráfico de f(x) = x² por…','uma dilatação vertical de coeficiente 3',['uma contração vertical de coeficiente 3','uma translação de 3 unidades para cima','uma reflexão em relação ao eixo Ox'],'g(x) = 3 · f(x): todas as ordenadas são multiplicadas por 3. Como 3 > 1, é uma dilatação vertical (a parábola fica mais fechada).'],
['m4','tra','O gráfico de g(x) = x²/4 obtém-se do gráfico de f(x) = x² por…','uma contração vertical de coeficiente 1/4',['uma dilatação vertical de coeficiente 4','uma translação de vetor (0, 1/4)','uma reflexão em relação ao eixo Oy'],'As ordenadas são multiplicadas por 1/4. Como 0 < 1/4 < 1, é uma contração vertical: a parábola fica mais aberta.'],
['m4','tra','O gráfico de g(x) = −2x² obtém-se do gráfico de f(x) = x² por…','uma reflexão em relação ao eixo Ox seguida de uma dilatação vertical de coeficiente 2',['uma reflexão em relação ao eixo Oy seguida de uma dilatação vertical de coeficiente 2','uma contração vertical de coeficiente 2','uma translação de vetor (0, −2)'],'O sinal menos vira a parábola para baixo (reflexão no eixo Ox) e o 2 estica-a na vertical (|a| = 2 > 1).'],

['m5','vert','Qual é o vértice da parábola de g(x) = −(x + 2)²?','(−2, 0)',['(2, 0)','(0, −2)','(−1, −2)'],'Escreve (x + 2) como (x − (−2)): h = −2. O vértice é (−2, 0). O erro clássico é responder 2.'],
['m5','vert','Qual é o zero de f(x) = 2(x − 3)²?','3',['−3','2','6'],'2(x − 3)² = 0 ⇔ x − 3 = 0 ⇔ x = 3. O único zero é a abcissa do vértice, h.'],
['m5','vert','Qual é a equação do eixo de simetria da parábola de f(x) = 5(x + 4)²?','x = −4',['x = 4','y = −4','x = 5'],'O eixo de simetria é a reta vertical que passa pelo vértice (h, 0) = (−4, 0): x = −4.'],
['m5','tra','O gráfico de y = a(x − 5)² obtém-se do de y = ax² por uma translação de vetor…','(5, 0)',['(−5, 0)','(0, 5)','(0, −5)'],'y = a(x − h)² resulta de y = ax² por uma translação de vetor (h, 0): desloca-se h na horizontal. Com (x − 5), h = 5, ou seja, 5 unidades para a direita.'],
['m5','car','Qual é o contradomínio de f(x) = 4(x − 7)²?','[0, +∞[',['[7, +∞[','ℝ',']−∞, 0]'],'Como a = 4 > 0, a parábola abre para cima e o mínimo é 0 (o vértice (7, 0) está no eixo x). D′ = [0, +∞[. O 7 é um x, não um y.'],
['m5','car','Qual é o sinal de g(x) = −(x + 2)²?','Negativa em ℝ \\ {−2}',['Positiva em ℝ \\ {−2}','Negativa em ℝ','Negativa em ]−2, +∞['],'Com a < 0 a parábola fica toda abaixo do eixo x, exceto o vértice (−2, 0), onde vale 0.'],
['m5','mon','Qual é a monotonia de f(x) = 2(x − 3)²?','Decrescente em ]−∞, 3] e crescente em [3, +∞[',['Crescente em ]−∞, 3] e decrescente em [3, +∞[','Decrescente em ]−∞, −3] e crescente em [−3, +∞[','Crescente em ℝ'],'Com a > 0 a parábola é um “vale”: desce até ao vértice (x = 3) e depois sobe.'],
['m5','car','Qual é o extremo de g(x) = −(x + 2)²?','Máximo 0, em x = −2',['Mínimo 0, em x = −2','Máximo −2, em x = 0','Máximo 0, em x = 2'],'Com a < 0 o vértice (−2, 0) é o ponto mais alto. O máximo é o valor de y (0); o maximizante é o valor de x (−2).'],
['m5','calc','Seja f(x) = 2(x − 1)². Qual é o valor de f(3)?','8',['16','4','10'],'f(3) = 2 × (3 − 1)² = 2 × 2² = 2 × 4 = 8. Primeiro o parêntese, depois a potência e só depois a multiplicação.'],
['m5','car','Uma função f(x) = a(x − h)², com a > 0, tem mínimo igual a…','0',['h','a','−h'],'O vértice (h, 0) está sempre no eixo x. Com a > 0 é o ponto mais baixo, por isso o mínimo (um valor de y) é 0. O h é o minimizante.'],
['m5','sin','Para que valores de x é f(x) = (x − 5)² positiva?','x ∈ ℝ \\ {5}',['x ∈ ℝ','x ∈ ]5, +∞[','x ∈ ]−5, +∞['],'Um quadrado é positivo exceto quando a base é 0. (x − 5)² = 0 só para x = 5.'],
['m5','car','Qual é a concavidade da parábola de y = −3(x − 2)²?','Voltada para baixo',['Voltada para cima','Voltada para a direita','Voltada para baixo só para x > 2'],'O sinal de a decide a concavidade, esteja a parábola onde estiver. a = −3 < 0.'],
['m5','graf','Qual é a expressão da função representada?','y = (x + 1)²',['y = (x − 1)²','y = x² + 1','y = x² − 1'],'O vértice é (−1, 0), no eixo x: é do tipo a(x − h)² com h = −1, ou seja (x + 1)². Passa em (0, 1), o que confirma a = 1.','m5_g'],
['m5','qv','Qual das funções tem este quadro de variação?','f(x) = −(x + 2)²',['f(x) = (x + 2)²','f(x) = −(x − 2)²','f(x) = −x² − 2'],'Cresce e depois decresce, com máximo 0 em x = −2: concavidade para baixo (a < 0) e vértice (−2, 0). Em −x² − 2 o máximo seria −2, em x = 0.','m5_qv'],

['m6','zero','Quais são os zeros de f(x) = x² − 9?','−3 e 3',['Só 3','9 e −9','Não tem zeros'],'x² − 9 = 0 ⇔ x² = 9 ⇔ x = 3 ∨ x = −3. Atenção: um quadrado igual a 9 tem duas soluções.'],
['m6','zero','Quantos zeros tem f(x) = 2x² + 3?','Nenhum',['Um','Dois','Três'],'2x² + 3 = 0 ⇔ x² = −3/2, impossível (um quadrado não é negativo). Visto de outra forma: a > 0 e o vértice (0, 3) está acima do eixo x.'],
['m6','zero','Quais são os zeros de g(x) = −2x² + 8?','−2 e 2',['−4 e 4','Só 2','Não tem zeros'],'−2x² + 8 = 0 ⇔ x² = 4 ⇔ x = 2 ∨ x = −2. Como a < 0 e k > 0 (sinais opostos), há dois zeros.'],

['m6','mon','Qual é a monotonia de g(x) = −3/4 x² + 3?','Crescente em ]−∞, 0] e decrescente em [0, +∞[',['Decrescente em ]−∞, 0] e crescente em [0, +∞[','Crescente em ]−∞, 3] e decrescente em [3, +∞[','Decrescente em ℝ'],'a < 0: a parábola sobe até ao vértice (0, 3) e depois desce. A mudança é em x = 0 (abcissa do vértice), não em 3.'],

['m6','calc','Seja f(x) = 2x² − 1. Qual é o valor de f(−3)?','17',['35','−19','19'],'f(−3) = 2 × (−3)² − 1 = 2 × 9 − 1 = 17. O quadrado aplica-se só ao −3, não ao 2 × (−3).'],
['m6','sin','Para que valores de x é f(x) = x² − 4 positiva?','x ∈ ]−∞, −2[ ∪ ]2, +∞[',['x ∈ ]−2, 2[','x ∈ ]4, +∞[','x ∈ ]2, +∞['],'Zeros −2 e 2, concavidade para cima: positiva fora dos zeros. Não esquecer a parte da esquerda.'],
['m6','zero','A parábola de y = −x² − 1 corta o eixo x?','Não, fica toda abaixo do eixo x',['Sim, em x = −1','Sim, em x = 1 e x = −1','Toca-o só no vértice'],'a < 0 e o vértice é (0, −1), já abaixo do eixo x. Como abre para baixo, nunca chega ao eixo x: −x² − 1 = 0 ⇔ x² = −1, impossível.'],

["ga6","def","Qual destas pessoas faz parte da população ativa?","Um desempregado de 40 anos à procura de emprego",["Um reformado de 70 anos","Um estudante de 16 anos que só estuda e não procura trabalho","Uma criança de 12 anos"],"Os desempregados contam como ativos porque estão disponíveis e à procura de trabalho."],
["ga6","def","Qual é a fórmula da taxa de atividade?","População ativa ÷ população total × 100",["População empregada ÷ população ativa × 100","População ativa ÷ população com 65 e mais × 100","População desempregada ÷ população ativa × 100"],"É o número de ativos por cada cem habitantes."],
["ga6","calc","Uma região tem 400 000 habitantes, dos quais 200 000 são ativos. Qual é a taxa de atividade?","50%",["5%","200%","0,5%"],"Taxa de atividade = 200 000 ÷ 400 000 × 100 = 50%."],
["ga6","set","O que é a estrutura profissional?","A composição da população ativa por setores de atividade",["A composição da população por idades e por género","O número de empresas por região","A distribuição dos salários pelas várias profissões"],"Divide os ativos pelos setores primário, secundário e terciário."],
["ga6","set","Em que setor de atividade se inclui a construção civil?","Secundário",["Primário","Terciário","Em nenhum"],"O secundário inclui indústria, produção de energia, construção civil e obras públicas."],
["ga6","set","Em que setor de atividade se inclui a pesca?","Primário",["Secundário","Terciário","Em nenhum"],"O primário extrai recursos naturais e obtém alimentos: agricultura, pesca, entre outras."],
["ga6","set","Em que setor de atividade se inclui a produção de energia?","Secundário",["Primário","Terciário","Em nenhum"],"Produção de energia é uma atividade de transformação, do setor secundário."],
["ga6","set","Em que setor de atividade se incluem o turismo e a banca?","Terciário",["Secundário","Primário","Em nenhum"],"O terciário inclui transação de bens e capitais e prestação de serviços."],
["ga6","set","O que é a terciarização da economia?","O domínio do setor terciário no emprego e na produção de riqueza",["A passagem de trabalhadores da indústria para a agricultura","A divisão da economia em três setores com o mesmo número de trabalhadores","O aumento das exportações de produtos agrícolas"],"Em Portugal o terciário emprega cerca de 70% da população ativa."],
["ga6","set","Observa o quadro. Como se repartia o emprego pelos três setores em 1974?","Quase igualmente pelos três setores",["Quase todo no setor terciário","Quase todo no setor primário","Metade no secundário e metade no terciário"],"A estrutura alterou-se sobretudo depois da adesão à UE.","ge_set"],
["ga6","set","Porque sofreu o setor primário uma grande redução?","Devido ao êxodo rural e à crescente mecanização e modernização da agricultura",["Devido à deslocalização de fábricas para países com menores custos de produção","Devido à Expo 98 e ao Euro 2004","Devido ao aumento do turismo rural"],"Saiu gente do campo e as máquinas substituíram mão de obra. Hoje o primário tem menos de 10% dos ativos."],
["ga6","set","Porque começou a decrescer o setor secundário neste século?","Modernização da indústria, deslocalização de fábricas e menos obras públicas",["Êxodo rural e mecanização da agricultura","Expansão do comércio e dos serviços de saúde, de educação, de turismo e de lazer em todo o país","Aumento da emigração para França"],"Depois da Expo 98 e do Euro 2004 a construção civil e as obras públicas reduziram-se."],
["ga6","set","Observa o quadro. Que percentagem aproximada da população ativa emprega hoje o setor terciário?","Cerca de 70%",["Cerca de 30%","Cerca de 10%","Cerca de 50%"],"O primário tem menos de 10% e o secundário cerca de 30%.","ge_set"],
["ga6","ev","Seleciona TODOS os fatores de que depende a população ativa.",["Participação da mulher no mercado de trabalho","Saldo migratório","Situação económica"],["Clima do país","Número de turistas estrangeiros"],"Também dependem da estrutura etária e da valorização da formação escolar e profissional."],
["ga6","ev","Porque aumentou muito o número de ativos a partir da década de 1970?","Sobretudo pela generalização da atividade profissional feminina",["Sobretudo pela emigração","Sobretudo pelo aumento da natalidade","Sobretudo pelo alargamento da escolaridade obrigatória até ao 12.º ano de escolaridade"],"Depois do 25 de Abril e com a emancipação da mulher, muitas mulheres entraram no mercado de trabalho."],
["ga6","ev","Porque voltou a aumentar a população ativa entre 1995 e 2005?","Devido à imigração",["Devido ao êxodo rural","Devido à crise de 2008","Devido ao regresso das ex-colónias"],"Os imigrantes estavam em idade ativa."],
["ga6","ev","Que efeito teve a crise económica de 2008-2015 na população ativa?","Diminuiu ligeiramente, por o saldo migratório ter ficado negativo",["Aumentou muito, pela chegada de imigrantes do Brasil e da Europa de Leste","Não teve qualquer efeito","Duplicou, pela entrada de jovens"],"Numa crise falta emprego, emigra-se mais e chegam menos imigrantes."],
["ga6","ev","Como influencia a valorização da formação escolar e profissional a população ativa?","Adia a entrada dos jovens adultos na vida ativa",["Faz os jovens entrar mais cedo na vida ativa e aumenta a taxa de atividade","Aumenta o número de reformados","Não tem qualquer influência"],"Quem estuda mais anos começa a trabalhar mais tarde, o que também acentua o envelhecimento dos ativos."],
["ga6","esc","O que é a taxa de alfabetização?","A população de 15 ou mais anos que sabe ler e escrever um pequeno texto, compreendendo o seu significado",["A percentagem de jovens que concluiu o ensino secundário","A população com curso superior","O número de alunos que já sabe ler e escrever corretamente ao terminar o 1.º ciclo do ensino básico"],"Portugal elevou muito esta taxa e os níveis de escolaridade."],
["ga6","esc","Observa a tabela. Em que nível de escolaridade Portugal tem uma percentagem maior do que a UE27?","Ensino básico",["Ensino secundário e pós-secundário","Ensino superior","Em nenhum"],"Portugal tem 42,1% de ativos só com o básico, contra 16,7% na UE27: é aí que está o atraso.","ga_esc"],
["ga6","esc","Observa a tabela. Que percentagem dos ativos portugueses tinha pelo menos o ensino secundário em 2019?","57,9%",["29,3%","42,1%","83,3%"],"Secundário 29,3% + superior 28,6% = 57,9%. Mais de metade, mas abaixo dos 83,3% da UE27.","ga_esc"],
["ga6","esc","O que evidencia a evolução dos níveis de escolaridade da população ativa?","Menos desigualdade de género, mais escolaridade obrigatória e acesso ao superior",["Mais desigualdade entre homens e mulheres no acesso ao ensino","Redução da escolaridade obrigatória","Diminuição do número de licenciados, sobretudo entre as mulheres mais jovens"],"Em 2019 há até mais mulheres do que homens com ensino superior na população ativa."],
["ga6","esc","O que permitiu o ensino recorrente?","Que muitos adultos concluíssem o ensino básico ou secundário em horário pós-laboral",["Que as crianças entrassem mais cedo na escola","Que os jovens repetissem o ano","Que os alunos fizessem parte do ensino secundário no estrangeiro, com bolsas do Estado"],"Junto com os cursos profissionais e o Programa Qualifica, ajudou a elevar a escolaridade dos ativos."],
["ga6","esc","Que programa substituiu o Novas Oportunidades em 2017?","O Programa Qualifica",["O Programa Erasmus","O Serviço Nacional de Saúde","O Plano Nacional de Leitura"],"O Qualifica capitaliza formações e competências adquiridas ao longo da vida e dá uma qualificação reconhecida em todo o mercado de trabalho comunitário."],
["ga6","reg","Porque é que no Centro e no Alentejo o setor primário é menos reduzido?","Pela maior dimensão de áreas agrícolas e florestais e maior proporção de idosos",["Porque têm mais indústrias, algumas que ainda empregam muita mão de obra","Porque têm mais turismo","Porque recebem mais imigrantes qualificados"],"Nestas regiões a agricultura e a floresta ainda ocupam uma parte maior dos ativos."],
["ga6","reg","Observa o quadro. Em que regiões se evidencia o setor secundário?","Norte e Centro",["AM de Lisboa e Algarve","Madeira e Açores","Alentejo e Algarve"],"Há numerosas indústrias, algumas que ainda empregam muita mão de obra.","ge_setreg"],
["ga6","reg","Porque se destaca a AM de Lisboa no setor terciário?","Pela concentração de serviços administrativos, financeiros e turísticos",["Pela grande área agrícola e florestal","Pela indústria têxtil e do calçado, que emprega muita mão de obra","Pela pesca"],"O Algarve e a Madeira destacam-se também no terciário, pela importância do turismo."],
["ga6","reg","A estrutura etária da população ativa está a envelhecer em todas as regiões, sobretudo no interior.","Verdadeiro",["Falso"],"É uma das conclusões do Essencial sobre a população ativa por regiões."],

["ga7","dep","O que é a população dependente?","A população inativa, composta maioritariamente por jovens e idosos",["A população desempregada","A população com 15 a 64 anos","A população estrangeira que ainda não tem autorização de residência"],"A população ativa produz riqueza e sustenta economicamente a vida de um país."],
["ga7","dep","Qual é a fórmula do índice de dependência de idosos?","População com 65 e mais ÷ população dos 15 aos 64 × 100",["População com 65 e mais ÷ população dos 0 aos 14 × 100","População dos 15 aos 64 ÷ população com 65 e mais × 100","População com 65 e mais ÷ população total × 100"],"Dividir os idosos pelos jovens dá o índice de envelhecimento, não o de dependência."],

["ga7","calc","Um país tem 1 400 000 jovens, 2 300 000 idosos e 6 600 000 pessoas dos 15 aos 64 anos. Qual é o índice de dependência total?","56,1",["34,8","21,2","178,4"],"IDT = (1 400 000 + 2 300 000) ÷ 6 600 000 × 100 = 3 700 000 ÷ 6 600 000 × 100 ≈ 56,1."],
["ga7","dep","Observa a tabela. Entre 1960 e 1981, o índice de dependência total era elevado sobretudo por causa…","dos jovens",["dos idosos","dos desempregados","dos imigrantes"],"Em 1960 o IDJ era 46,4 e o IDI só 12,7.","ga_id"],

["ga7","dep","Observa a tabela. Porque aumenta o índice de dependência total desde 2001?","Pelo crescimento do índice de dependência de idosos",["Pelo crescimento do índice de dependência de jovens","Pela redução do número de idosos","Pelo aumento da população ativa"],"O IDI passou de 24,2 para 34,5 entre 2001 e 2019.","ga_id"],
["ga7","dep","Observa a tabela. Que região tinha o índice de dependência de idosos mais alto em 2019?","Alentejo",["AM Lisboa","Açores","Norte"],"O Alentejo tem a estrutura etária mais envelhecida das regiões: 41,2.","ga_idreg"],
["ga7","dep","Observa a tabela. Que região tinha o índice de dependência de idosos mais baixo em 2019?","Açores",["Alentejo","Centro","Algarve"],"Os Açores têm maior proporção de jovens: o IDI é 21,4, e até é mais baixo do que o IDJ.","ga_idreg"],
["ga7","sus","O que mede o índice de sustentabilidade potencial?","O número de pessoas em idade ativa por cada idoso",["O número de idosos por cada cem jovens","O número de jovens por cada idoso","O número de pensões pagas por ano pela Segurança Social"],"Em Portugal passou de 4,1 em 2001 para 2,9 em 2019: há cada vez menos ativos por idoso.","ga_isp"],
["ga7","sus","O que mede o índice de renovação da população ativa?","O número dos que entram na idade ativa por cada cem que saem",["O número de idosos por cada cem jovens","O número de novos empregos criados por ano","O número de ativos por cada idoso da população residente"],"Relaciona quem está a entrar na idade ativa com quem está a sair.","ga_isp"],

["ga7","sus","Porque é que o envelhecimento põe em risco os sistemas de pensões?","As despesas com pensões e saúde aumentam e as contribuições dos ativos diminuem",["Os idosos pagam demasiados impostos","A natalidade aumenta","Os jovens recebem pensões e as despesas do Estado com a educação aumentam todos os anos"],"Isto gera desequilíbrio financeiro na Segurança Social e na Caixa Geral de Aposentações, que podem entrar em rutura."],
["ga7","sus","Que efeito tem uma população ativa envelhecida?","Menor capacidade de empreender e inovar",["Maior capacidade de inovação e de criar empresas","Aumento da natalidade","Redução das despesas do Estado"],"É um dos problemas do envelhecimento demográfico referidos no Verifica se sabes."],
["ga7","prod","O que é a produtividade?","A relação entre o valor da produção e o tempo de trabalho utilizado",["O número de horas trabalhadas por semana","O lucro total de uma empresa num ano","O número de trabalhadores de uma empresa a tempo inteiro e parcial"],"Pode ser do trabalho humano ou dos equipamentos, chamada produtividade do capital fixo."],
["ga7","prod","Como se calcula a produtividade do trabalho?","Valor do VAB ÷ número de horas trabalhadas",["Número de horas trabalhadas ÷ valor do VAB","Valor da produção × número de trabalhadores","Valor do VAB ÷ número de empresas"],"Mede quanto valor é criado por cada hora de trabalho."],
["ga7","prod","O que é o VAB, Valor Acrescentado Bruto?","A diferença entre o valor da produção e o valor dos gastos com a produção",["A soma de todos os salários pagos pela empresa","O valor total das exportações","O valor dos impostos pagos pelas empresas ao Estado em cada ano civil"],"É o valor que a empresa realmente acrescenta."],
["ga7","prod","De que depende a produtividade do capital fixo?","Da utilização intensiva do equipamento da empresa e do seu grau de modernização e automatização",["Do número de horas trabalhadas pelos empregados","Do nível de escolaridade dos clientes","Do número de trabalhadores contratados e do valor dos seus salários, prémios e subsídios anuais e mensais"],"Capital fixo são os equipamentos, as máquinas."],
["ga7","prod","Como se reflete a falta de qualificação nos empregadores?","Em défice de organização, gestão financeira pouco eficaz e menor capacidade de inovação",["Em salários mais altos para os trabalhadores","Em maior acesso a programas de apoio e a novas tecnologias de produção","Em mais exportações"],"Também têm mais dificuldade em aderir a novos processos e tecnologias e aceder a programas de apoio."],
["ga7","prod","Porque têm os empresários portugueses níveis médios de qualificação mais baixos do que os trabalhadores?","Pelo elevado peso de micro, pequenas e médias empresas e pela industrialização tardia do país",["Porque as grandes empresas não contratam licenciados","Porque os empresários são todos estrangeiros","Porque não existem cursos de gestão em Portugal e os empresários têm de ir estudar para o estrangeiro"],"É uma questão de escala referida num documento do manual."],
["ga7","prod","Porque é que a produtividade influencia a competitividade?","Uma empresa mais produtiva pode vender os produtos a um preço mais baixo",["Uma empresa mais produtiva paga menos impostos","A produtividade só depende dos preços","Uma empresa mais produtiva precisa de menos trabalhadores qualificados e paga salários mais baixos"],"Portugal, com produtividade abaixo da média da UE, tem dificuldades em competir no mercado europeu."],
["ga7","emp","Seleciona TODAS as razões pelas quais o défice de qualificação reduz a empregabilidade.",["Limita as opções e oportunidades de emprego","Dificulta a reconversão profissional","Coloca os trabalhadores na primeira linha dos despedimentos em crise"],["Aumenta os salários de entrada","Facilita a progressão na carreira"],"Também reduz a possibilidade de progressão profissional e salarial."],
["ga7","emp","O que é a reconversão profissional?","A mudança de profissão",["A reforma antecipada","A passagem de desempregado a empregado na mesma profissão","A formação dos jovens antes de entrarem na vida ativa"],"Quem tem pouca qualificação tem mais dificuldade em mudar de profissão quando a empresa se reestrutura."],
["ga7","emp","Quem é considerado desempregado?","Pessoas com mais de 15 anos sem trabalho, disponíveis e à procura de emprego",["Todas as pessoas que não trabalham, incluindo reformados e estudantes","Todos os estudantes com mais de 15 anos","Pessoas que trabalham a tempo parcial e gostariam de trabalhar a tempo inteiro"],"Um reformado ou um estudante que não procura trabalho não é desempregado."],
["ga7","emp","Qual é a fórmula da taxa de desemprego?","N.º de desempregados ÷ população ativa × 100",["N.º de desempregados ÷ população total × 100","N.º de empregados ÷ população ativa × 100","N.º de desempregados ÷ população empregada × 100"],"A taxa de desemprego compara-se com a população ativa, não com a total."],

["ga7","emp","O que é uma recessão económica?","Crescimento do PIB inferior a zero, ou seja, PIB inferior ao do ano anterior",["Uma subida rápida dos preços","Um aumento do desemprego acima de 10% durante mais de um ano","Um período de crescimento económico rápido"],"Em recessão a taxa de desemprego sobe; em crescimento económico desce."],
["ga7","emp","O que é uma conjuntura?","Uma situação, num período limitado, com fatores que influenciam a economia",["Uma lei que fixa o salário mínimo","Uma tendência permanente e de longo prazo da economia e da demografia de um país","Um tipo de contrato de trabalho"],"A taxa de desemprego reflete as situações conjunturais da economia."],
["ga7","emp","Observa o gráfico. Em que ano a taxa de desemprego atingiu o valor mais alto?","2013",["1986","2000","2019"],"Por volta de 2013 chegou a cerca de 16%, na sequência da crise económica: em recessão o desemprego sobe. Por volta de 2000, com obras públicas e imigração em alta, estava nos valores mais baixos.","ge_desemp"],
["ga7","emp","Seleciona TODOS os grupos com maior risco de desemprego.",["As mulheres, sobretudo as menos qualificadas","Os ativos com menor formação escolar e profissional","Os jovens até aos 25 anos"],["Os ativos com ensino superior entre os 30 e os 40 anos","Os trabalhadores com contrato permanente"],"Também os ativos com mais de 35 anos estão mais sujeitos ao desemprego de longa duração."],
["ga7","emp","Porque é que os jovens até aos 25 anos têm maior risco de desemprego?","Os empregadores exigem experiência e há pouca ligação entre o ensino e as empresas",["Os jovens não querem trabalhar","A lei proíbe contratar jovens com menos de 25 anos a tempo inteiro em empresas privadas","Os jovens têm todos ensino superior"],"Por isso a taxa de desemprego dos menores de 25 anos é muito mais alta do que a dos outros grupos."],
["ga7","emp","Porque é que os ativos com mais de 35 anos estão mais em desemprego de longa duração?","Em regra, têm menor escolaridade e menos capacidade de adaptação a novas atividades",["Porque já recebem pensões","Porque não estão disponíveis para trabalhar","Porque são os mais qualificados e as empresas preferem contratar jovens sem experiência"],"Desemprego de longa duração é estar desempregado há mais de um ano."],
["ga7","emp","Porque é que na AM de Lisboa o desemprego não é baixo, apesar de haver mais oferta de emprego?","A procura inclui ativos de todo o país e há mais trabalho temporário",["Porque não há empresas na AM de Lisboa","Porque a população é muito idosa","Porque não há imigrantes e as empresas não conseguem encontrar trabalhadores"],"As diferenças regionais relacionam-se com a demografia e com o equilíbrio entre oferta e procura de emprego."],
["ga7","emp","Quem participa mais em atividades de formação ao longo da vida?","As pessoas mais qualificadas",["As pessoas sem escolaridade","Os mais velhos, dos 55 aos 64 anos","Ninguém: a participação é igual para todos"],"Quem tem mais qualificação tem maior apetência para aprender e mais desejo de progredir na carreira."],
["ga7","emp","O défice de formação escolar e profissional reduz a competitividade da economia.","Verdadeiro",["Falso"],"Prejudica a produtividade, a inovação e a modernização das atividades económicas."],

["pc5","int","Lê o excerto. Na frase «a perda comum vencendo de todo a piedade», o que se quer dizer?","A necessidade de todos venceu a compaixão",["A piedade venceu a fome","O povo perdeu a fé em Deus","Os castelhanos tiveram pena dos expulsos e deixaram-nos ficar no arraial"],"A situação era tão grave que a compaixão deu lugar a uma decisão dura.","cr_c"],
["pc5","int","Lê o excerto. Como trataram os castelhanos os expulsos de Lisboa?","Primeiro acolheram-nos; depois mandaram-nos de volta à força",["Mataram-nos a todos à chegada","Deram-lhes trigo para levar para a cidade","Ignoraram-nos sempre e nunca os deixaram aproximar-se do acampamento castelhano"],"O rei percebeu que, devolvendo-os, a cidade gastaria os mantimentos mais depressa.","cr_d"],
["pc5","int","Lê o excerto. Porque é que o rei de Castela mandou devolver os expulsos à cidade?","Para que a cidade gastasse mais depressa os mantimentos",["Por pena das pessoas","Porque não tinha espaço no arraial","Porque eram doentes e podiam contagiar os soldados castelhanos"],"«por gastar mais a cidade»: é uma estratégia de guerra.","cr_d"],
["pc5","int","Lê o excerto. Alguns saíam por vontade própria para o arraial. Porquê?","Preferiam ser cativos a morrer de fome",["Queriam lutar ao lado dos castelhanos","Tinham família no arraial","Iam buscar trigo para levar de volta para a cidade"],"«querendo ante de todo seer cativos, que assi perecerem morrendo de fame».","cr_d"],
["pc5","int","Lê o excerto. O que comiam as pessoas por falta de trigo?","Pão de bagaço de azeitona, malvas, raízes de ervas e melaço",["Peixe do Tejo e frutas","Carne dos cavalos que os castelhanos abandonavam junto às muralhas","Apenas pão de trigo racionado"],"Coisas «desacostumadas», «pouco amigas da natureza».","cr_e"],
["pc5","int","Lê o excerto. O que faziam homens e moços no lugar onde se vendia o trigo?","Esgravatavam a terra à procura de grãos para comer",["Vendiam o trigo a preços baixos","Faziam guarda aos armazéns","Distribuíam pão e esmolas pelos pobres que ali se juntavam"],"Se encontravam alguns grãos, metiam-nos logo na boca.","cr_e"],
["pc5","int","Lê o excerto. Porque apareciam homens e rapazes mortos e inchados nas praças?","Enchiam-se de ervas e de água para enganar a fome",["Tinham sido mortos pelos castelhanos","Tinham peste","Tinham caído das muralhas durante os ataques noturnos"],"É um pormenor chocante que mostra o desespero.","cr_e"],
["pc5","rec","Lê o excerto. Que recurso expressivo há em «tamanho pam come ũa noz»?","Comparação",["Metáfora","Apóstrofe","Hipérbato"],"Usa «come», como, para comparar o pedaço de pão a uma noz: mostra como era pequeno.","cr_f"],
["pc5","vis","Lê o excerto. A descrição dos meninos de três e quatro anos a pedir pão é um exemplo de…","plano de pormenor",["plano de conjunto","comentário do cronista","apelo ao leitor"],"O cronista aproxima-se de um grupo concreto e de gestos particulares para comover.","cr_f"],
["pc5","int","Lê o excerto. Porque é que as mães choravam a morte dos filhos «ante que os a morte privasse da vida»?","Sabiam que os filhos iam morrer e não os podiam socorrer",["Os filhos já tinham morrido no cerco","Os filhos tinham sido levados pelos castelhanos para o arraial","Tinham medo de ser expulsas da cidade"],"Faltava-lhes o leite e não tinham com que acudir aos filhos.","cr_f"],
["pc5","rec","Lê o excerto. Em «choravom […] sobr’eles a morte ante que os a morte privasse da vida», a repetição de «morte» e a oposição morte/vida…","reforçam o sofrimento antecipado das mães",["tornam a cena cómica","mostram que as crianças acabaram por sobreviver ao cerco","elogiam o rei de Castela"],"A morte é chorada antes de acontecer: o efeito é trágico.","cr_f"],
["pc5","vis","Lê o excerto. «Toda a cidade era dada a nojo» é um exemplo de…","plano de conjunto",["plano de pormenor","discurso direto","apóstrofe"],"Mostra a cidade inteira mergulhada em tristeza. «Nojo» significa tristeza.","cr_g"],
["pc5","int","Lê o excerto. O que acontecia quando os sinos repicavam?","Ninguém mostrava fome: todos eram fortes contra os inimigos",["Todos fugiam para as igrejas","Começava a distribuição de pão","Os doentes e os mais fracos eram levados para fora das muralhas"],"Apesar da fome, o povo mantinha a coragem: é a força da consciência coletiva.","cr_g"],
["pc5","rec","Lê o excerto. A frase «assi como é natural cousa a mão ir ameúde onde see a door, assi uũs homẽes falando com outros, nom podiam em al departir senom em na mingua» contém…","uma comparação",["uma apóstrofe","uma interrogação retórica","uma ironia"],"Tal como a mão vai onde dói, a conversa ia sempre dar à fome.","cr_g"],
["pc5","int","Lê o excerto. As palavras de consolo resolviam a tristeza?","Não: nenhuma palavra doce acalmava tal dor",["Sim, o povo ficava animado","Sim, sobretudo as dos padres nas missas e pregações","Não, porque ninguém falava"],"«nom prestava conforto de palavras, nem podia tal door seer amansada com neũas doces razões».","cr_g"],
["pc5","int","Lê o excerto. As orações eram atendidas?","Não, as preces não eram atendidas",["Sim, chegava trigo logo a seguir","Sim, os castelhanos foram embora no dia seguinte","Não, porque ninguém rezava"],"«suas prezes nom eram compridas!» O desespero leva alguns a desejar a morte.","cr_h"],
["pc5","rec","Lê o excerto. O que transmitem as frases exclamativas «Ó quantas vezes…!» e «…suas prezes nom eram compridas!»?","A emoção do cronista perante o sofrimento",["A alegria do povo pela vitória","A indiferença do cronista perante os factos que relata","A raiva do rei de Castela"],"É a dimensão subjetiva do relato.","cr_h"],
["pc5","int","Lê o excerto. Porque é que alguns rogavam à morte que os levasse?","Preferiam morrer a sofrer cada dia novos padecimentos",["Queriam ir para o céu mais cedo por devoção religiosa","Tinham sido condenados pelo Mestre","Estavam doentes com peste"],"«melhor lhe fora morrer, que lhe seerem cada dia renovados desvairados padecimentos».","cr_h"],
["pc5","rec","Lê o excerto. Que recurso há em «padeciam duas grandes guerras»?","Metáfora",["Comparação","Apóstrofe","Interrogação retórica"],"A fome é apresentada como uma segunda guerra, além da dos inimigos.","cr_i"],
["pc5","int","Lê o excerto. Quais são as «duas grandes guerras» que o povo sofria?","A dos inimigos que cercavam a cidade e a da falta de mantimentos",["A guerra com Castela e a guerra com Leão","A guerra no mar contra as galés e a guerra em terra contra o arraial","A guerra dos nobres e a guerra do clero"],"Tinham de se defender da morte de duas maneiras.","cr_i"],
["pc5","int","Lê o excerto. Além da fome, o que mais temiam os pais e mães?","A cruel vingança do rei de Castela",["A chegada da frota do Porto","A peste no arraial castelhano","A expulsão pelo Mestre de todos os que não tinham pão"],"«medo grande da cruel vingança que entendiam que el-Rei de Castela deles havia de tomar».","cr_i"],
["pc5","rec","Lê o excerto. «viiam estalar de fame os filhos» é um exemplo de…","hipérbole",["eufemismo","comparação","apóstrofe"],"Exagero expressivo que mostra a gravidade da fome.","cr_i"],
["pc5","int","Lê o excerto. Segundo o cronista, qual era a causa da fome?","O excesso de gente na cidade e os mantimentos serem poucos",["A duração muito longa do cerco","A traição do homem de Almada","A peste que matou os animais e estragou o trigo guardado nas covas da cidade"],"O cronista diz expressamente que não era por o cerco ser longo: «nom havia tanto tempo que Lixboa era cercada».","cr_j"],
["pc5","rec","Lê o excerto. «Ora esguardae como se fossees presente» é um exemplo de…","apelo direto ao leitor ou ouvinte",["diálogo entre personagens","descrição de paisagem","comparação entre o passado e o presente"],"O cronista pede ao leitor que imagine a cena, para o envolver emocionalmente. «Esguardae» significa olhai.","cr_j"],
["pc5","rec","Lê o excerto. A quem se dirige a apóstrofe «Ó geeraçom que depois veo»?","Às gerações seguintes, que não viveram aqueles males",["Aos castelhanos do arraial","Ao Mestre de Avis e aos membros do seu Conselho de guerra","A Deus"],"Chama-lhe «poboo bem aventuirado», feliz por não ter sofrido aquilo.","cr_j"],
["pc5","rec","Lê o excerto. «quem sofria ondas de taes aflições» contém…","uma metáfora",["uma comparação","uma enumeração","uma apóstrofe"],"As aflições são vistas como ondas: chegavam umas atrás das outras, sem parar.","cr_j"],
["pc5","voc","Lê o excerto. O que significa «feúza»?","Confiança",["Fealdade","Fome","Fé religiosa"],"«sem neũa certa feúza de seu livramento»: sem nenhuma confiança segura de ser libertada.","cr_j"],
["pc5","voc","Lê o excerto. O que significa «quinhoeiro»?","Participante",["Inimigo","Cozinheiro","Mensageiro"],"O povo que veio depois não foi participante daqueles sofrimentos.","cr_j"],
["pc5","voc","O que significa «arreal» no capítulo 148?","Acampamento",["Muralha","Igreja","Barco"],"O arraial era o acampamento do exército castelhano fora da cidade."],
["pc5","voc","O que significa «mingua» em «per mingua de mantimentos»?","Falta",["Abundância","Venda","Preço"],"«Mingua» é falta, escassez; daí o verbo minguar."],
["pc5","voc","O que significa «nojo» em «Toda a cidade era dada a nojo»?","Tristeza",["Repugnância","Raiva","Alegria"],"Em português antigo, «nojo» era tristeza, luto. O sentido de repugnância é posterior."],
["pc5","sin","Seleciona TODAS as afirmações verdadeiras sobre o capítulo 148.",["O povo é a personagem principal do capítulo","O cronista comenta e explica os acontecimentos","Há momentos de plano de conjunto e de plano de pormenor"],["O Mestre fica indiferente ao sofrimento do povo","O capítulo termina com a vitória em Aljubarrota"],"O Mestre e o seu Conselho sabiam dos males e era-lhes doloroso ouvi-los. Aljubarrota é de 1385."],
["pc5","sin","Como reagiam o Mestre e o seu Conselho às notícias do sofrimento?","Doía-lhes ouvi-las, mas não as podiam remediar",["Ficavam indiferentes","Mandavam castigar todos os que se queixavam da fome","Fugiam da cidade"],"«eram-lhe doorosas d’ouvir taes novas, e veendo estes males a que acorrer nom podiam, çarravom suas orelhas»."],
["pc5","sin","Um dia correu o boato de que o Mestre mandava expulsar quem não tivesse pão. Era verdade?","Não, e saber isso já foi algum conforto",["Sim, e muitos foram expulsos","Sim, mas só os castelhanos que viviam na cidade","Não, porque ninguém tinha pão"],"«Porem sabendo que nom era assi, foi-lhe já quanto de conforto»."],
