<style>
/* Sóbrio, uma coluna, pensado para telemóvel. Tema claro e escuro. */
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#18202e; --muted:#5d6676; --line:#e1e4ea; --soft:#eef1f5;
  --accent:#1d2b44; --accent-ink:#ffffff; --accent-soft:#e6ebf3;
  --ok:#1b7f4b; --ok-soft:#e5f3eb; --bad:#c0392b; --bad-soft:#fbeae8;
  --font:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --card:#171e29; --ink:#e7eaf0; --muted:#98a1b1; --line:#283244; --soft:#1e2734;
  --accent:#8fb0e8; --accent-ink:#0f141c; --accent-soft:#1f2b3e;
  --ok:#4cc38a; --ok-soft:#14291f; --bad:#ef7a6c; --bad-soft:#31191a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto;padding-block:max(16px,env(safe-area-inset-top,0px)) 48px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;font-weight:700}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{cursor:default}
.muted{color:var(--muted)} .small{font-size:13px}
.top{display:flex;align-items:center;gap:12px;min-height:40px}
.top h2{min-width:0;flex:1}
.back{width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:20px;display:grid;place-items:center;flex:none;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hello h1{font-size:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subj{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:104px}
.subj .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.subj h3{font-size:15px}
.subj .tag{font-size:12px;color:var(--muted)}
.subj.off{opacity:.5}
.subj.on:hover{border-color:var(--muted)}
.testcard{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:4px}
.testcard .t{font-size:19px;font-weight:700}
.testcard .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.cd{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600}
.cd b{min-width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:18px;font-variant-numeric:tabular-nums}
.cd.hot{border-color:var(--bad)} .cd.hot b{background:var(--bad);color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.topic{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:12px 14px;width:100%}
.topic>div{flex:1;min-width:0}
.topic .n{font-weight:600}
.topic .s{font-size:13px;color:var(--muted)}
.topic .best{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.35}
.topic .best b{color:var(--ink);font-size:14px}
.cov{display:flex;align-items:center;gap:8px;margin-top:6px}
.cov span{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:10px;padding:3px}
.seg button{min-width:48px;padding:6px 10px;border-radius:8px;font-weight:600;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pill2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill2 button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600;text-align:center}
.pill2 button span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.pill2 button:disabled{opacity:.45}
.prep .pp{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.prep .bar{height:8px}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.bm{width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none}
.bm.on{color:var(--accent);border-color:var(--accent)}
.qchip{align-self:flex-start;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.qtext{font-size:19px;font-weight:600;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:500;display:flex;gap:12px;align-items:center;width:100%}
.opt .l{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;color:var(--muted)}
.opt:not(:disabled):hover{border-color:var(--muted)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)} .opt.right .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)} .opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;border:1.5px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)} .fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb h3{font-size:16px} .fb.ok h3{color:var(--ok)} .fb.no h3{color:var(--bad)}
.big{width:100%;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px;font-weight:700;font-size:17px;text-align:center}
.ghost{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;font-weight:600;text-align:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)} .opt.sel .l{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.chk .l{border-radius:5px}
.opt.right.miss{background:var(--card);border-style:dashed}
.multihint{font-size:13px;color:var(--muted);margin-top:-4px}
.keys{font-size:12px;color:var(--muted);text-align:center}
@media (hover:none){.keys{display:none}}
/* resultado / evolução */
.score{font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--soft);border-radius:10px;padding:10px;text-align:center}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.trow .bar{grid-column:1/-1;height:8px}
.trow .nm{font-weight:600;font-size:14px;min-width:0}
.trow .v{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wk{display:flex;justify-content:space-between;gap:8px;background:var(--bad-soft);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500;width:100%}
.wk span:last-child{white-space:nowrap;color:var(--bad);font-weight:600}
.err{border-top:1px solid var(--line);padding-top:10px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.err:first-of-type{border-top:0;padding-top:0}
.err .a{color:var(--ok);font-weight:600}
.chart svg{width:100%;height:auto;display:block}
.empty{text-align:center;color:var(--muted)}
.calcbtn{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:600;color:var(--accent);border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px}
.calc{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.calc .disp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:right;min-height:58px;display:flex;flex-direction:column;justify-content:flex-end}
.calc .ex{font-size:14px;color:var(--muted);word-break:break-all;min-height:18px}
.calc .rs{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;word-break:break-all}
.calc .keys4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc .keys4 button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 0;font-size:18px;font-weight:600;text-align:center}
.calc .keys4 button.op{color:var(--accent)}
.calc .keys4 button.eq{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.fig{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.fig .ft{font-weight:600;font-size:13px}
.fig .poem{font-style:italic;font-size:14px;line-height:1.5}
.fig .poem .r{padding-left:22px}
.fig .poem .st{margin-bottom:8px}
.fig p{margin:0;font-size:14px;line-height:1.55}
.fig .fs{font-size:11px;color:var(--muted)}
.fig table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.fig th,.fig td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}
.fig th:first-child,.fig td:first-child{text-align:left}
.fig th{font-weight:600;color:var(--muted);font-size:12px}
.fbar{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center}
.fbar .t{height:14px;border-radius:4px;background:var(--line);overflow:hidden}.fbar .t i{display:block;height:100%;background:var(--accent)}
.fbar span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// Português — 1.º teste (10.º ano). Fonte: matriz do teste e ficha informativa 2 do manual.
// [tópico, subtópico, pergunta, resposta certa, [erradas], explicação]
const QS_PT = [
["p1","epoca","A poesia trovadoresca galego-portuguesa desenvolveu-se aproximadamente entre…","finais do século XII e meados do século XIV",["o início do século X e meados do século XI","o início do século XV e o final do século XVI","meados do século XIV e o final do século XV"],"Período trovadoresco: de finais do séc. XII a meados do séc. XIV."],
["p1","epoca","As cantigas trovadorescas foram escritas em…","galego-português",["latim","português moderno","provençal"],"A língua comum da Galiza e do norte de Portugal na época: o galego-português."],
["p1","epoca","A lírica trovadoresca tem uma forte influência da poesia…","provençal (sul de França)",["italiana do Renascimento","castelhana do século XVI","árabe do Oriente"],"Os trovadores provençais influenciaram a poesia da Península; as peregrinações a Santiago e as cortes ajudaram a difundi-la."],
["p1","epoca","Um dos caminhos por onde a poesia provençal chegou à Península Ibérica foi…","as peregrinações a Santiago de Compostela",["as viagens marítimas para a Índia","a imprensa","as universidades do século XVI"],"Peregrinos, jograis e nobres circulavam pelo Caminho de Santiago e levavam a poesia de corte em corte."],
["p1","epoca","Um rei português que foi também trovador é…","D. Dinis",["D. Afonso Henriques","D. Manuel I","D. João II"],"D. Dinis (séc. XIII–XIV) é um dos trovadores mais importantes, com cantigas de amor e de amigo."],
["p1","canc","As cantigas chegaram até nós sobretudo através de…","cancioneiros (coletâneas manuscritas)",["livros impressos na época dos trovadores","gravações feitas pelos próprios jograis","crónicas oficiais dos reis de Portugal"],"Os cancioneiros reuniram as cantigas: Cancioneiro da Ajuda, da Biblioteca Nacional e da Vaticana."],
["p1","canc","Qual destes NÃO é um cancioneiro da lírica galego-portuguesa?","Cancioneiro Geral",["Cancioneiro da Ajuda","Cancioneiro da Vaticana","Cancioneiro da Biblioteca Nacional"],"O Cancioneiro Geral (Garcia de Resende, 1516) é posterior e não pertence à lírica trovadoresca."],
["p1","canc","O Cancioneiro da Ajuda reúne quase só…","cantigas de amor",["cantigas de amigo","cantigas de escárnio","romances"],"O da Ajuda tem sobretudo cantigas de amor; as cantigas de amigo estão nos da Vaticana e da Biblioteca Nacional."],
["p1","canc","Os Cancioneiros da Vaticana e da Biblioteca Nacional são…","cópias feitas em Itália no século XVI",["originais escritos pelos trovadores","livros impressos em Lisboa","cópias feitas no século XX"],"Ambos foram copiados em Itália no séc. XVI e preservam cantigas de amigo, de amor e satíricas."],
["p1","autores","Na época, as cantigas eram feitas para ser…","cantadas, com acompanhamento musical",["lidas em silêncio","apenas escritas em cancioneiros","declamadas sem música"],"Cantiga = texto para cantar. Poesia e música eram inseparáveis."],
["p1","autores","O trovador era, geralmente…","um nobre que compunha cantigas",["um músico pago que só tocava instrumentos","um monge copista","um camponês que cantava nas feiras"],"Trovador: autor de condição nobre, que compunha letra e música."],
["p1","autores","O jogral era…","um intérprete de condição inferior, que cantava e tocava",["um nobre que compunha, mas nunca cantava em público","o rei que protegia e pagava aos trovadores da corte","o monge que copiava as cantigas para os cancioneiros"],"Jogral: executante, de origem popular, que atuava a troco de pagamento."],
["p1","autores","Os géneros da poesia trovadoresca são…","lírica (cantigas de amor e de amigo) e satírica (escárnio e maldizer)",["épica (feitos heroicos) e dramática (autos e farsas)","lírica (só cantigas de amigo) e narrativa (romances)","satírica (sonetos) e religiosa (cantigas de santa)"],"Lírica: amor e amigo. Satírica: escárnio e maldizer."],
["p1","autores","A cantiga de amigo tem origem…","numa antiga tradição peninsular de canções em voz feminina",["exclusivamente na poesia dos trovadores provençais","na poesia latina clássica, estudada nos mosteiros","nos romances populares castelhanos do século XVI"],"A cantiga de amor segue o modelo provençal; a de amigo vem de uma tradição peninsular mais antiga."],
["p1","autores","Quem escrevia as cantigas de amigo?","trovadores (homens) que davam voz a uma donzela",["mulheres da corte que falavam dos seus amores","apenas jograis anónimos, sem qualquer formação","monges que as copiavam nos mosteiros"],"O autor é um homem, mas o sujeito poético é feminino."],
["p1","amor","Na cantiga de AMOR, o sujeito poético é…","um homem que se dirige à \"senhor\"",["uma donzela que fala do amigo","a mãe da donzela","a natureza personificada"],"Cantiga de amor: voz masculina, dirige-se à \"mia senhor\" — é o contrário da cantiga de amigo."],
["p1","amor","O ambiente típico da cantiga de amor é…","cortês, aristocrático",["rural e popular","marítimo e costeiro","religioso, de romaria"],"Amor: ambiente da corte. Amigo: ambiente rural/natural, mais popular."],
["p1","amor","Na cantiga de amor, a \"coita\" é…","o sofrimento amoroso",["a alegria do encontro","a dança","o nome da amada"],"Coita = sofrimento por amor. Também aparece na cantiga de amigo, causada pela ausência do amigo."],
["p2","suj","Na cantiga de amigo, o sujeito poético é…","uma donzela",["um cavaleiro","um trovador que fala de si","um rei"],"Voz feminina: a donzela (jovem apaixonada) fala do seu \"amigo\"."],
["p2","suj","Na cantiga de amigo, a palavra \"amigo\" significa…","namorado, amado",["colega","irmão","senhor feudal"],"\"Amigo\" = namorado. Variantes nas cantigas: \"amado\", \"meu amigo\"."],
["p2","suj","A quem se pode dirigir a donzela nas cantigas de amigo?","à mãe, às amigas, ao amigo ou à natureza",["apenas ao rei, de quem o amigo é vassalo","apenas a Deus, em forma de oração","apenas à \"senhor\", a dama da corte"],"Interlocutores frequentes: mãe, amigas, irmã, o amigo, e a natureza (ondas, flores, aves…)."],
["p2","suj","O interlocutor é…","a entidade a quem o sujeito poético se dirige",["o trovador que escreveu a cantiga","o jogral que canta a cantiga em público","a personagem de quem o sujeito poético fala"],"Sujeito poético = quem fala; interlocutor = a quem fala."],
["p2","suj","Quando a donzela fala com as ondas ou as flores, estes elementos funcionam como…","confidentes",["obstáculos","inimigos","narradores"],"A natureza personificada é confidente: ouve os desabafos e às vezes responde."],
["p2","suj","Ao falar com as ondas como se fossem pessoas, a donzela recorre à…","personificação (e à apóstrofe)",["hipérbole (e à comparação)","comparação (e à ironia)","ironia (e à metáfora)"],"Personificação: atribuir características humanas a seres não humanos. Apóstrofe: interpelar diretamente."],
["p2","suj","A apóstrofe é…","a interpelação direta de alguém ou de algo",["a repetição de palavras no início dos versos","um exagero","uma comparação com \"como\""],"Ex.: \"Ondas do mar de Vigo, / se vistes meu amigo?\" — a donzela chama as ondas."],
["p2","sent","O tema mais frequente nas cantigas de amigo é…","a ausência do amigo e a saudade",["a guerra entre reinos","a crítica a pessoas da corte","o elogio da senhor"],"Temas: ausência, saudade, espera, ansiedade, alegria do encontro, ciúme, zanga."],
["p2","sent","Qual destes sentimentos é típico da donzela na cantiga de amigo?","saudade e ansiedade pela espera",["desprezo e raiva pelo amigo","indiferença perante a partida","medo e ódio da natureza"],"A donzela sofre com a ausência (coita), espera, receia que ele não volte."],
["p2","sent","A \"coita\" da donzela é causada, normalmente, por…","a ausência ou o afastamento do amigo",["a pobreza da sua família","a doença grave do rei","uma guerra que o reino perdeu"],"O amigo partiu (para o mar, para o fossado, para longe) e ela sofre."],
["p2","sent","Para além da tristeza, a cantiga de amigo pode exprimir…","alegria, por exemplo pela notícia do regresso do amigo",["apenas raiva contra a mãe que a proíbe de sair","apenas medo da morte e do mar","apenas devoção religiosa, sem qualquer referência ao amor"],"Há cantigas alegres: a donzela feliz porque o amigo volta ou porque vai ao seu encontro."],
["p2","esp","O espaço típico das cantigas de amigo é…","natural e campestre (fontes, rios, mar, campos)",["o palácio e os salões da corte","a cidade grande e os seus mercados","o interior das igrejas e dos mosteiros"],"Ambiente rural, ao ar livre: fonte, rio, mar, campos, ermidas."],
["p2","esp","A linguagem das cantigas de amigo é…","simples, com muitas repetições",["erudita e cheia de latinismos","muito complexa e difícil","técnica"],"Linguagem simples, popular, com repetições — fácil de memorizar e de cantar."],
["p2","esp","As cantigas de amigo são, em geral…","curtas, com estrofes de dois ou três versos e refrão",["longas, com centenas de versos e várias personagens","escritas em prosa, sem rima nem refrão","sonetos de 14 versos, com rima interpolada"],"Estrofes breves (dísticos, muitas vezes) + refrão."],
["p2","doc","Dizer que uma cantiga tem \"valor documental\" significa que…","dá informação sobre a vida e os costumes da época",["é um documento oficial assinado pelo rei","foi escrita em pergaminho e guardada num arquivo","conta acontecimentos totalmente inventados"],"As cantigas mostram costumes, espaços, festas, trabalhos e a condição da mulher na Idade Média."],
["p2","doc","As cantigas de romaria documentam…","as festas e peregrinações a santuários",["as batalhas navais contra os mouros","as leis do reino e os tribunais","a vida quotidiana dentro dos mosteiros"],"Romarias eram ocasiões de convívio e de encontro entre namorados."],
["p2","doc","As cantigas em que o amigo partiu para o \"fossado\" mostram…","que os homens partiam em expedições militares ao serviço do rei",["que os homens iam estudar para universidades longínquas","que as mulheres também partiam para a guerra","que eram comuns as viagens de lazer pelo reino"],"Fossado = expedição militar. A cantiga documenta a vida das mulheres que ficavam à espera."],
["p2","doc","A referência a lugares reais (Vigo, San Simón, Lisboa) contribui para…","o valor documental da cantiga",["a rima e a métrica da cantiga","a construção do refrão","o tom satírico da cantiga"],"Lugares concretos ligam a cantiga à realidade geográfica e social da época."],
["p2","doc","As cantigas de amigo mostram a mulher medieval muitas vezes…","dependente da autorização da mãe e à espera do amigo",["a governar o reino na ausência do rei","a partir para a guerra ao lado do amigo","a viajar sozinha e livremente pelo mundo"],"A mãe aparece como figura de autoridade que autoriza ou proíbe o encontro."],
["p2","tipos","Uma cantiga de amigo passada junto ao mar chama-se…","barcarola ou marinha",["bailia ou bailada","alba ou alvorada","cantiga de romaria"],"Barcarola/marinha: o mar e as ondas como cenário e confidentes."],
["p2","tipos","Uma cantiga de amigo em que as donzelas dançam chama-se…","bailia",["barcarola","alba","cantiga de romaria"],"Bailia ou bailada: convite à dança."],
["p2","tipos","Uma cantiga de amigo passada ao amanhecer chama-se…","alba ou alvorada",["bailia","barcarola","cantiga de romaria"],"Alba/alvorada: o raiar do dia, muitas vezes a separação dos namorados."],
["p2","tipos","Uma cantiga de amigo em que a donzela vai a um santuário chama-se…","cantiga de romaria",["barcarola ou marinha","alba ou alvorada","bailia ou bailada"],"Romaria: ida a uma igreja/ermida em festa, ocasião para ver o amigo."],
["p2","tipos","\"Bailemos nós ja todas tres, ai amigas\" é o início de uma…","bailia",["barcarola","alba","cantiga de amor"],"O convite à dança (\"bailemos\") identifica a bailia."],
["p3","par","O paralelismo consiste em…","repetir ideias e versos de estrofe para estrofe, com pequenas variações",["usar rimas diferentes em cada estrofe, sem repetir versos","contar uma história longa, com princípio, meio e fim","evitar repetições, para que cada estrofe traga ideias novas"],"Paralelismo: estrofes aos pares que dizem quase o mesmo, mudando poucas palavras."],
["p3","par","No paralelismo, as estrofes organizam-se muitas vezes…","aos pares, mudando só a palavra final do verso",["de forma totalmente diferente umas das outras","em quadras soltas, sem ligação entre si","por ordem alfabética do primeiro verso"],"Ex.: \"amigo\" / \"amado\"; \"Vigo\" / \"levado\"."],
["p3","par","Em \"se vistes meu amigo?\" / \"se vistes meu amado?\", a troca de \"amigo\" por \"amado\" é um exemplo de…","paralelismo",["leixa-pren","refrão","hipérbole"],"Mesma frase, palavra final diferente (sinónima) — paralelismo."],
["p3","par","O leixa-pren (\"deixa-prende\") consiste em…","retomar o 2.º verso de uma estrofe no início de outra",["repetir o refrão no início de cada estrofe seguinte","acabar todas as estrofes com a mesma palavra rimada","mudar de interlocutor a cada nova estrofe"],"O verso \"deixado\" numa estrofe é \"prendido\" mais à frente."],
["p3","par","Em \"Ondas do mar de Vigo\", o verso \"se vistes meu amigo?\" (estrofe 1) reaparece no início da estrofe 3. Isto é…","leixa-pren",["refrão","rima interna","apóstrofe"],"2.º verso da estrofe 1 → 1.º verso da estrofe 3: leixa-pren.","c_ondas"],
["p3","par","Qual é o efeito principal do paralelismo?","dar musicalidade e insistir na ideia, que avança devagar",["tornar a cantiga mais curta e fácil de escrever","esconder o sentimento da donzela ao ouvinte","criar suspense sobre o final da história"],"A repetição com variação cria ritmo, facilita a memorização e intensifica o sentimento."],
["p3","par","A repetição dos mesmos versos ajudava também a…","memorizar a cantiga, que circulava sobretudo oralmente",["imprimir mais depressa os cancioneiros","traduzir a cantiga para latim","encurtar o texto para caber no pergaminho"],"Numa cultura oral, a repetição facilitava a memória de quem cantava e de quem ouvia."],
["p3","ref","O refrão é…","um verso ou conjunto de versos repetidos no fim de cada estrofe",["o primeiro verso de cada cantiga, que lhe dá o título","o verso que muda de estrofe para estrofe","a última estrofe, onde se resume a história"],"Refrão: repetição fixa no fim das estrofes."],
["p3","ref","Em \"Ondas do mar de Vigo\", o refrão é…","\"E ai Deus, se verrá cedo!\"",["\"Ondas do mar de Vigo\"","\"se vistes meu amigo?\"","\"por que ei gran cuidado?\""],"O verso repetido no fim de todas as estrofes.","c_ondas"],
["p3","ref","Em \"Ai flores, ai flores do verde pino\", o refrão é…","\"Ai Deus, e u é?\"",["\"se sabedes novas do meu amigo\"","\"Ai flores, ai flores do verde ramo\"","\"que é san' e vivo\""],"\"e u é?\" = \"e onde está?\"","c_flores"],
["p3","ref","Uma função habitual do refrão é…","sintetizar e intensificar o sentimento dominante",["introduzir uma personagem nova em cada estrofe","contar o desfecho da história ao ouvinte","mudar o tema da cantiga a meio"],"O refrão concentra o estado de espírito (ansiedade, saudade) e reforça-o pela repetição."],
["p3","ref","A interjeição \"ai\" no refrão exprime…","emoção (lamento, ansiedade)",["indiferença perante a situação","uma ordem dada ao interlocutor","uma comparação com a natureza"],"\"Ai\" é marca de emotividade: dor, ansiedade, desejo."],
["p3","ref","O sentido do refrão pode mudar ao longo da cantiga porque…","os versos à sua volta mudam o contexto (ex.: da espera à aflição)",["as palavras do refrão mudam sempre em cada estrofe","o refrão deve ser lido de trás para a frente","depende apenas da voz do jogral que o canta"],"As palavras são iguais, mas a situação muda — por isso o refrão ganha novos sentidos."],
["p3","prog","Progressão temática é…","a evolução do assunto e do sentimento ao longo da cantiga",["a numeração das estrofes ao longo da cantiga","a mudança de autor a meio da cantiga","a passagem do latim ao português nas cantigas"],"Apesar das repetições, a cantiga avança: a situação e o sentimento mudam."],
["p3","prog","Na cantiga \"Sedia-m' eu na ermida de Sam Simiom\", a progressão vai…","da espera tranquila do amigo à certeza da morte no mar",["da tristeza da partida à alegria do casamento","do riso com as amigas à zanga com a mãe","da dança na romaria à oração na ermida"],"Espera → cerco das ondas → sem barqueiro → \"morrerei fremosa no mar maior\".","c_ermida"],
["p3","prog","Na cantiga \"Sedia-m' eu na ermida…\", os tempos verbais mostram a progressão porque passam…","do passado ao presente e ao futuro",["do futuro ao passado","sempre no presente","do imperativo ao conjuntivo"],"\"cercarom\" (passado) → \"nom ei\" (presente) → \"morrerei\" (futuro).","c_ermida"],
["p3","prog","Em \"Ai flores, ai flores do verde pino\", a progressão vai…","das perguntas ansiosas da donzela à resposta das flores",["da alegria do encontro à notícia da morte do amigo","do convite à dança à zanga entre as amigas","do elogio do amigo à crítica da sua mentira"],"1.ª parte: pergunta e queixa; 2.ª parte: as flores respondem que ele está \"san' e vivo\".","c_flores"],
["p3","prog","Mesmo depois da resposta das flores, o refrão \"Ai Deus, e u é?\" mostra que…","a dúvida e a saudade da donzela persistem",["a donzela deixou de se interessar pelo amigo","as flores lhe deram a notícia da morte do amigo","a cantiga acaba com a zanga entre os dois"],"O refrão mantém a pergunta até ao fim: ela só sossega quando o vir.","c_flores"],
["p4","ondas","\"Ondas do mar de Vigo, / se vistes meu amigo?\" — quem fala?","uma donzela",["as ondas do mar","o amigo ausente","a mãe da donzela"],"\"meu amigo\" → voz feminina: a donzela.","c_ondas"],
["p4","ondas","\"Ondas do mar de Vigo, / se vistes meu amigo?\" — a quem se dirige?","às ondas do mar",["ao amigo","a Deus","à mãe"],"A donzela interpela as ondas (apóstrofe/personificação).","c_ondas"],
["p4","ondas","Quem é o autor de \"Ondas do mar de Vigo\"?","Martim Codax",["D. Dinis","Meendinho","Pero Meogo"],"Martim Codax, jogral galego; as suas cantigas estão no Pergaminho Vindel, com música.","c_ondas"],
["p4","ondas","\"Ondas do mar levado\" — \"levado\" significa…","agitado, encapelado",["calmo, sereno","distante, longínquo","gelado, frio"],"Mar levado = mar alto, agitado.","c_ondas"],
["p4","ondas","\"por que ei gran cuidado\" exprime…","preocupação",["alegria","desprezo","cansaço físico"],"\"cuidado\" = preocupação, inquietação.","c_ondas"],
["p4","ondas","\"o por que eu sospiro\" exprime…","saudade e amor",["raiva","medo do mar","arrependimento"],"Suspirar pelo amigo = sentir a falta dele.","c_ondas"],
["p4","ondas","\"Ondas do mar de Vigo\" é uma barcarola porque…","o mar é o cenário e o confidente",["fala de uma dança entre amigas","se passa ao raiar da madrugada","se passa numa romaria a um santuário"],"Barcarola/marinha: o mar como espaço e confidente.","c_ondas"],
["p4","ondas","No refrão \"E ai Deus, se verrá cedo!\", \"verrá\" significa…","virá",["verá","voltará a partir","vencerá"],"Forma antiga do futuro de \"vir\".","c_ondas"],
["p4","flores","\"Ai flores, ai flores do verde pino\" — \"pino\" é…","pinheiro",["pino de bowling","pinho cortado","monte"],"Verde pino = pinheiro verde.","c_flores"],
["p4","flores","\"se sabedes novas do meu amigo\" — \"novas\" significa…","notícias",["coisas novas","roupas","flores novas"],"Novas = notícias.","c_flores"],
["p4","flores","Quem é o autor de \"Ai flores, ai flores do verde pino\"?","D. Dinis",["Martim Codax","Meendinho","Airas Nunes"],"Cantiga de amigo de D. Dinis.","c_flores"],
["p4","flores","\"aquel que mentiu do que pôs comigo\" mostra que a donzela…","se queixa porque o amigo não cumpriu o que combinou",["elogia a honestidade e a lealdade do amigo","já se esqueceu do amigo e não o espera","quer casar com outro pretendente"],"Ele faltou ao combinado (não apareceu no prazo).","c_flores"],
["p4","flores","\"Vós me preguntades polo voss' amigo?\" — quem fala neste verso?","as flores",["a donzela","o amigo","a mãe"],"A partir da 5.ª estrofe são as flores que respondem: estrutura dialogada.","c_flores"],
["p4","flores","\"e seerá vosc' ant' o prazo saído\" significa que o amigo…","estará com ela antes de terminar o prazo",["morreu antes de terminar o prazo","nunca mais voltará para junto dela","partiu com outra donzela para longe"],"\"seerá vosc'\" = estará convosco; \"ant' o prazo saído\" = antes de acabar o prazo.","c_flores"],
["p4","flores","A cantiga \"Ai flores…\" tem uma estrutura dialogada porque…","há perguntas da donzela e respostas das flores",["foi escrita por dois trovadores diferentes","mistura duas línguas, o latim e o galego","é cantada sempre por dois jograis"],"Diálogo: donzela (estrofes 1–4) e flores (estrofes 5–8).","c_flores"],
["p4","ermida","\"Sedia-m' eu na ermida de Sam Simiom\" — \"ermida\" é…","uma pequena igreja em lugar isolado",["uma casa de pescadores junto ao mar","um castelo construído numa ilha","uma ilha deserta, sem construções"],"Ermida: capela isolada. San Simón é uma ilha na ria de Vigo.","c_ermida"],
["p4","ermida","Quem é o autor de \"Sedia-m' eu na ermida de Sam Simiom\"?","Meendinho",["D. Dinis","Martim Codax","João Zorro"],"Meendinho: a única cantiga que se conhece dele.","c_ermida"],
["p4","ermida","\"Sedia-m' eu\" significa…","estava eu (sentada)",["saía eu (de casa)","sofria eu (de amor)","dormia eu (na ermida)"],"Do verbo \"seer/sedere\": estar sentado.","c_ermida"],
["p4","ermida","\"eu atendend' o meu amigo!\" — \"atendendo\" significa…","esperando",["ouvindo","tratando","servindo"],"\"Atender\" no galego-português = esperar.","c_ermida"],
["p4","ermida","\"nom ei [i] barqueiro, nem sei remar\" exprime…","isolamento e impotência",["alegria e liberdade","orgulho","cansaço"],"Ela está cercada pelo mar sem forma de sair.","c_ermida"],
["p4","ermida","\"morrerei [eu] fremosa no mar maior\" — o adjetivo \"fremosa\" revela que a donzela…","tem consciência da sua beleza",["está gravemente doente","é já uma mulher idosa","se considera feia e sozinha"],"Mesmo perante a morte, refere a sua beleza: traço típico da donzela.","c_ermida"],
["p4","outras","\"Mia irmana fremosa, treides comigo / a la igreja de Vig', u é o mar salido\" — a interlocutora é…","a irmã",["a mãe","o amigo","as ondas"],"\"Mia irmana\" — a donzela convida a irmã para ir à igreja de Vigo (romaria)."],
["p4","outras","\"treides comigo / a la igreja de Vig'\" é um…","convite (vinde comigo)",["pedido de desculpas","lamento pela morte","insulto"],"\"treides\" = vinde. Convite para a romaria."],
["p4","outras","\"Digades, filha, mia filha velida, / porque tardastes na fontana fria?\" — quem fala?","a mãe",["a donzela","o amigo","as amigas"],"A mãe pergunta à filha porque se atrasou na fonte (Pero Meogo)."],
["p4","outras","Na cantiga de Pero Meogo, a \"fontana fria\" simboliza…","o lugar do encontro amoroso",["a doença da donzela","a morte do amigo","a pobreza da família"],"A fonte é espaço de encontro dos namorados.","c_meogo"],
["p4","outras","\"Levantou-s' a velida, / levantou-s' alva\" (D. Dinis) — o cenário é…","o amanhecer (alba)",["a noite de tempestade","uma dança na corte","uma batalha"],"\"alva\" = madrugada: cantiga de tipo alba."],
["p4","outras","\"velida\" significa…","bela, formosa",["velha","vestida","vencida"],"Velida = bela. É frequente nas cantigas de amigo."],
["p4","outras","Em \"Bailemos nós ja todas tres, ai amigas\", a donzela dirige-se…","às amigas",["ao amigo","à mãe","ao mar"],"\"ai amigas\" — interpelação às amigas (bailia de Airas Nunes)."],
["p5","ins","A prótese é…","a inserção de um som no início da palavra",["a inserção de um som no final da palavra","a queda de um som no início da palavra","a troca de posição de sons na palavra"],"Prótese: + início. Ex.: scutu- > escudo."],
["p5","ins","A epêntese é…","a inserção de um som no interior da palavra",["a inserção de um som no início da palavra","a queda de um som no interior da palavra","a fusão de duas vogais numa só vogal"],"Epêntese: + interior. Ex.: creo > creio."],
["p5","ins","A paragoge é…","a inserção de um som no final da palavra",["a queda de um som no final da palavra","a inserção de um som no início da palavra","a troca de posição de sílabas na palavra"],"Paragoge: + final. Ex.: ante > antes."],
["p5","sup","A aférese é…","a supressão de um som no início da palavra",["a supressão de um som no final da palavra","a inserção de um som no início da palavra","a supressão de um som no interior da palavra"],"Aférese: − início. Ex.: attonitu- > tonto."],
["p5","sup","A síncope é…","a supressão de um som no interior da palavra",["a supressão de um som no início da palavra","a supressão de um som no final da palavra","a inserção de um som no interior da palavra"],"Síncope: − interior. Ex.: legale- > leal."],
["p5","sup","A apócope é…","a supressão de um som no final da palavra",["a supressão de um som no interior da palavra","a inserção de um som no final da palavra","a supressão de um som no início da palavra"],"Apócope: − final. Ex.: male- > mal."],
["p5","alt","A metátese é…","a deslocação de sons ou sílabas dentro da palavra",["a perda de um som no interior da palavra","a fusão de duas vogais iguais numa só","a passagem de uma consoante surda a sonora"],"Metátese: muda de lugar. Ex.: feria- > feira."],
["p5","alt","A assimilação é…","a mudança de um som por influência de outro próximo, tornando-o igual ou semelhante",["a passagem de dois sons iguais ou semelhantes a sons diferentes","a passagem de uma consoante a vogal ou semivogal","a queda de um som no interior da palavra, junto a outro"],"Assimilação: aproxima. Ex.: persona- > pessoa (rs > ss)."],
["p5","alt","A dissimilação é…","a diferenciação de dois sons iguais ou semelhantes",["a igualização de dois sons próximos um do outro","a inserção de um som entre dois sons iguais","a queda de uma vogal entre duas consoantes"],"Dissimilação: afasta. Ex.: liliu- > lírio (l…l > l…r)."],
["p5","alt","A sonorização é…","a passagem de uma consoante surda a sonora",["a passagem de uma consoante sonora a surda","a passagem de uma consoante a vogal","a queda de uma consoante no interior"],"p > b, t > d, c > g. Ex.: lupu- > lobo."],
["p5","alt","A vocalização é…","a passagem de uma consoante a vogal (semivogal)",["a passagem de uma vogal a consoante","a queda de uma vogal no interior","a passagem de surda a sonora"],"Ex.: octo > oito (c > i)."],
["p5","alt","A palatalização é…","a evolução de um som ou grupo para um som palatal (ch, lh, nh, j)",["a passagem de uma consoante a vogal ou semivogal (ex.: c > i)","a queda de um som no interior da palavra (ex.: d > Ø)","a fusão de duas vogais iguais numa só (ex.: aa > a)"],"Ex.: clamare > chamar; folia- > folha."],
["p5","alt","A crase é…","a fusão de duas vogais (iguais) numa só",["a passagem de duas vogais a ditongo","a inserção de uma vogal","a troca de duas vogais"],"Ex.: pala- > paa > pá."],
["p5","alt","A sinérese é…","a passagem de duas vogais em hiato a um ditongo",["a fusão de duas vogais iguais numa só vogal","a queda de uma vogal no interior da palavra","a inserção de uma vogal entre duas outras"],"Ex.: ego > eo > eu."],
["p5","alt","A crase e a sinérese são dois tipos de…","contração",["inserção","supressão","metátese"],"Contração: as vogais juntam-se (numa só = crase; num ditongo = sinérese)."],
["p5","alt","A redução vocálica é…","o enfraquecimento de uma vogal em posição átona",["a queda de uma vogal tónica no final da palavra","a passagem de uma vogal a consoante","a fusão de duas vogais átonas numa só"],"Ex.: v[ɔ]to / v[u]tação: a vogal átona é pronunciada mais fechada."],
["p5","alt","Prótese, epêntese e paragoge são processos de…","inserção",["supressão","alteração","contração"],"Inserção (+): início, interior, final."],
["p5","alt","Aférese, síncope e apócope são processos de…","supressão",["inserção","alteração","palatalização"],"Supressão (−): início, interior, final."],
["p5","alt","Sonorização, vocalização e palatalização são processos de…","alteração",["inserção","supressão","apenas contração"],"Alteração (≠): o som muda, mas não é acrescentado nem eliminado."],
["p5","alt","A grafia (forma escrita) das palavras…","nem sempre mostra as mudanças já ocorridas na pronúncia",["mostra sempre, com exatidão, a pronúncia atual","muda sempre ao mesmo tempo que a pronúncia","nunca muda, desde o latim até hoje"],"Há grafias conservadoras que não refletem mudanças já ocorridas."],
["p5","alt","Em \"voto / votação\", a vogal destacada \"o\" de votação…","é pronunciada [u] por estar em posição átona",["é pronunciada [ɔ], tal como em voto","desaparece por completo na pronúncia","passa a ditongo por estar átona"],"Redução vocálica: na sílaba átona, a vogal enfraquece."],
["p5","alt","A redução vocálica explica a pronúncia de…","\"candidatura\" em comparação com \"candidato\"",["\"escudo\" em comparação com \"scutu-\"","\"lobo\" em comparação com \"lupu-\"","\"chave\" em comparação com \"clave\""],"Nas formas derivadas, a vogal que fica átona enfraquece."],
["p6","ins","scutu- > escudo: no início da palavra ocorreu…","prótese",["epêntese","paragoge","aférese"],"Acrescentou-se e- no início."],
["p6","ins","scala- > escala:","prótese",["aférese","epêntese","metátese"],"e- acrescentado no início."],
["p6","ins","stare > estar: no início da palavra ocorreu…","prótese",["paragoge","epêntese","assimilação"],"e- acrescentado no início (e queda do -e final: apócope)."],
["p6","ins","spatha- > espada: no início da palavra ocorreu…","prótese",["aférese","epêntese","síncope"],"e- inicial acrescentado (e t > d: sonorização)."],
["p6","ins","stella- > estrela: no início da palavra ocorreu…","prótese",["paragoge","aférese","síncope"],"e- inicial acrescentado."],
["p6","ins","creo > creio:","epêntese",["prótese","paragoge","sinérese"],"Acrescentou-se i no interior."],
["p6","ins","umeru- > omro > ombro: na passagem de omro a ombro ocorreu…","epêntese",["prótese","paragoge","assimilação"],"Acrescentou-se b no interior."],
["p6","ins","humile- > humilde: o d resulta de…","epêntese",["paragoge","prótese","sonorização"],"d acrescentado no interior."],
["p6","ins","arena > area > areia: na passagem de area a areia ocorreu…","epêntese",["síncope","crase","prótese"],"Acrescentou-se i no interior."],

const ALL=()=>'all:'+cur, ERR=()=>'err:'+cur, SAV=()=>'sav:'+cur;

const $=s=>document.querySelector(s);

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const idsOf=k=>QS.map((q,i)=>q[0]===k?i:-1).filter(i=>i>=0);

function stratified(ids,n){const g={};shuffle(ids).forEach(i=>{const k=QS[i][1];(g[k]=g[k]||[]).push(i)});
 const keys=shuffle(Object.keys(g)),out=[];let r=0;
 while(out.length<n&&keys.some(k=>g[k].length>r)){keys.forEach(k=>{if(out.length<n&&g[k][r]!==undefined)out.push(g[k][r])});r++}
 return shuffle(out)}
function fresh(ids,n){const un=ids.filter(i=>!S.seen[i]);if(un.length>=n)return stratified(un,n);return shuffle(un.concat(stratified(ids.filter(i=>S.seen[i]),n-un.length)))}
function cover(k){const ids=idsOf(k);const s=ids.filter(i=>S.seen[i]).length;return {s,n:ids.length,p:ids.length?Math.round(s/ids.length*100):0}}
function build(t){
 if(t.startsWith('sub:')){const key=t.slice(4);return fresh(QS.map((q,i)=>(q[0]+':'+q[1])===key?i:-1).filter(i=>i>=0),size())}
 if(t===SAV())return shuffle(S.saved.filter(inCur)).slice(0,size());
 if(t===ERR())return shuffle(S.wrong.filter(inCur)).slice(0,size());
 if(t===ALL()){const ks=T_().mix||T_().keys,n=size();let o=[];ks.forEach((k,j)=>{const per=Math.floor(n/ks.length)+(j<n%ks.length?1:0);o=o.concat(fresh(idsOf(k),per))});return shuffle(o)}
 return fresh(idsOf(t),size())}
function tname(t){if(t.startsWith('sub:'))return SUBN[t.slice(4)]||'Treino';if(t.startsWith('all:'))return 'Mistura (como no teste)';if(t.startsWith('err:'))return 'Os meus erros';if(t.startsWith('sav:'))return 'Guardadas';return TOPICS[t].n}

function daysTo(d){if(!d)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(d+'T00:00:00')-t)/864e5)}
function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString('pt-PT',{day:'numeric',month:'long'})}
function cdBox(T){const n=daysTo(T.when);if(n===null||n<0)return '';
 const txt=n===0?'O teste é hoje.':n===1?'O teste é amanhã.':`Faltam ${n} dias para o teste (${fmtDate(T.when)}).`;
 return `<div class="cd ${n<=2?'hot':''}"><b>${n}</b><span>${txt}</span></div>`}
function tagFor(k){const L=Object.entries(TESTS).filter(([,T])=>T.subj===k);if(!L.length)return 'Em breve';
 const up=L.map(([,T])=>daysTo(T.when)).filter(n=>n!==null&&n>=0).sort((a,b)=>a-b);
 if(up.length)return up[0]===0?'Teste hoje':up[0]===1?'Teste amanhã':`Teste daqui a ${up[0]} dias`;
 return L.some(([,T])=>!T.when)?'Teste com data por definir':''}

let lastAct=0;
function tick(){const now=Date.now();if(view.name==='quiz'&&lastAct&&cur){const d=Math.min((now-lastAct)/1000,120);S.time[cur]=(S.time[cur]||0)+d;
 const day=new Date().toISOString().slice(0,10);if(!S.tday||S.tday.d!==day)S.tday={d:day};S.tday[cur]=(S.tday[cur]||0)+d}lastAct=now}
function fmtT(s){s=Math.round(s/60);if(s<1)return 'menos de 1 min';const h=Math.floor(s/60),m=s%60;return h?`${h} h ${m} min`:`${m} min`}
function recAdd(k,good){const r=S.rec[k]=S.rec[k]||[];r.push(good?1:0);if(r.length>20)r.shift()}
function prep(){const ks=T_().mix||T_().keys;let tot=0,weak=null,ws=2;ks.forEach(k=>{const cv=cover(k).p/100;const r=S.rec[k]||[];const acc=r.length?r.reduce((a,b)=>a+b,0)/r.length:0;const conf=Math.min(r.length/10,1);const sc=0.4*cv+0.6*acc*conf;tot+=sc;if(sc<ws){ws=sc;weak=TOPICS[k].n}});return {p:Math.round(tot/ks.length*100),weak}}
function stats(t){const h=S.history.filter(x=>x.t===t);if(!h.length)return null;const p=h.map(x=>Math.round(x.c/x.n*100));return {n:h.length,last:p[p.length-1],best:Math.max(...p),avg:Math.round(p.reduce((a,b)=>a+b,0)/p.length),prev:p.length>1?p[p.length-2]:null}}

function cParse(str){let i=0;const s=str.replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'.').replace(/−/g,'-');
 const peek=()=>s[i],num=()=>{let j=i;while(i<s.length&&/[0-9.]/.test(s[i]))i++;if(j===i)throw 0;return parseFloat(s.slice(j,i))};
 function fac(){if(peek()==='-'){i++;return -fac()}if(peek()==='('){i++;const v=expr();if(s[i]!==')')throw 0;i++;return pct(v)}return pct(num())}
 function pct(v){if(s[i]==='%'){i++;return v/100}return v}
 function term(){let v=fac();while(peek()==='*'||peek()==='/'){const o=s[i++];const r=fac();v=o==='*'?v*r:v/r}return v}
 function expr(){let v=term();while(peek()==='+'||peek()==='-'){const o=s[i++];const r=term();v=o==='+'?v+r:v-r}return v}
 const v=expr();if(i!==s.length||!isFinite(v))throw 0;return v}
function cFmt(v){return Number(v.toFixed(6)).toLocaleString('pt-PT',{maximumFractionDigits:6})}
function cKey(k){if(k==='C'){calc.ex='';calc.rs=''}else if(k==='⌫'){calc.ex=calc.ex.slice(0,-1)}
 else if(k==='='){try{calc.rs=cFmt(cParse(calc.ex))}catch(e){calc.rs='Erro'}}
 else{if(calc.rs&&calc.rs!=='Erro'&&/[+−×÷%]/.test(k)&&calc.ex&&calc.lastEq){calc.ex=calc.rs.replace(/\s/g,'')}if(calc.lastEq&&/[0-9,(]/.test(k)){calc.ex='';}calc.ex+=k;calc.rs=''}
 calc.lastEq=k==='=';const d=$('#calc');if(d)d.outerHTML=calcHTML()}
function calcHTML(){const K=['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','0',',','⌫','='];
 return `<div class="calc" id="calc"><div class="disp"><div class="ex">${esc(calc.ex)||'&nbsp;'}</div><div class="rs">${calc.rs||'&nbsp;'}</div></div>
 <div class="keys4">${K.map(k=>`<button class="${'÷×−+'.includes(k)?'op':k==='='?'eq':''}" onclick="cKey('${k}')">${k}</button>`).join('')}</div></div>`}

 <div class="row"><span class="muted small">Perguntas por ronda</span><div class="seg">${[10,20,30].map(n=>`<button class="${size()===n?'on':''}" onclick="setSize(${n})">${n}</button>`).join('')}</div></div>
 <div class="list">
 <button class="topic" style="--c:var(--accent)" onclick="start('${ALL()}')"><div><div class="n">Mistura tudo</div><div class="s">${T.mix?'Só a matéria da matriz, como no teste':'Um pouco de cada matéria, como no teste'}</div></div><span class="best">${sa?`<b>${sa.best}%</b><br>melhor`:'—'}</span></button>
 ${tl}</div>
 <div class="pill2"><button onclick="start('${ERR()}')" ${nw?'':'disabled'}>Os meus erros<span>${nw} para rever</span></button>
 <button onclick="start('${SAV()}')" ${ns?'':'disabled'}>Guardadas<span>${ns} para rever</span></button></div>
 <button class="ghost" onclick="go('prog')">Evolução <span class="muted">· ${rounds} rondas feitas</span></button>
 <p class="muted small" style="text-align:center">A app mostra primeiro as perguntas que ainda não viste.</p>
 <button class="muted small" style="text-align:center;padding:6px" onclick="resetTest()">${confirmReset?'<b style="color:var(--bad)">Toca outra vez para apagar o progresso deste teste</b>':'Recomeçar este teste do zero'}</button>`}

function qview(){const id=quiz.ids[quiz.i],q=QS[id],P=TOPICS[q[0]];
 const multi=isMulti(q),vf=isVF(q);quiz.sel=quiz.sel||[];
 if(!quiz.opts)quiz.opts=vf?['Verdadeiro','Falso']:multi?shuffle([...q[3],...q[4]]):shuffle([q[3],...q[4]]);
 const n=quiz.ids.length,done=quiz.answered!==null,good=done&&quiz.good,sv=S.saved.includes(id);
 const isRight=o=>multi?q[3].includes(o):o===q[3];
 const opts=quiz.opts.map((o,j)=>{const picked=multi?quiz.sel.includes(j):j===quiz.answered;let c='';
  if(done){if(isRight(o))c=multi&&!picked?'right miss':'right';else if(picked)c='wrong'}else if(multi&&picked)c='sel';
  const lab=vf?o[0]:multi?(picked?'✓':''):'ABCD'[j];
  return `<button class="opt ${c} ${multi?'chk':''}" ${done?'disabled':''} onclick="answer(${j})"><span class="l">${lab}</span><span>${esc(o)}</span></button>`}).join('');
 const fb=done?`<div class="fb ${good?'ok':'no'}" id="fb"><h3>${good?'Certo':'Errado'}</h3>${good?'':`<p>Resposta certa: <b>${esc(ansTxt(q))}</b></p>`}<p>${esc(q[5])}</p></div>
  <button class="big" onclick="next()">${quiz.i+1<n?'Seguinte':'Ver resultado'}</button>`:(multi?`<button class="big" onclick="confirmMulti()" ${quiz.sel.length?'':'disabled style="opacity:.45"'}>Confirmar</button>`:'');
 const hint=multi?`<p class="multihint">Pode haver mais do que uma certa. Seleciona todas e confirma.</p>`:'';
 return `<div class="qtop"><button class="back" aria-label="Sair" onclick="go('test')">×</button><div class="prog"><i style="width:${(quiz.i+(done?1:0))/n*100}%"></i></div><span class="count">${quiz.i+1}/${n}</span>
 <button class="bm ${sv?'on':''}" aria-label="${sv?'Remover das guardadas':'Guardar pergunta'}" onclick="toggleSave()"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 3h12v18l-6-4-6 4z" fill="${sv?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button></div>
 <div class="card"><span class="qchip">${esc(P.n)}</span><div class="qtext">${esc(q[2])}</div>${q[6]&&FIGS[q[6]]?`<div class="fig">${FIGS[q[6]]}</div>`:''}${needsCalc(q)?`<button class="calcbtn" onclick="toggleCalc()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h4"/></svg>${calc.open?'Fechar calculadora':'Calculadora'}</button>${calc.open?calcHTML():''}`:''}${hint}<div class="opts">${opts}</div></div>${fb}
 <p class="keys">Teclado: 1–4 para responder · Enter para avançar</p>`}

function result(){const n=quiz.ids.length,p=Math.round(quiz.ok/n*100);
 const errs=quiz.wrongs.map(i=>QS[i]);
 return `<div class="card" style="align-items:center;text-align:center"><span class="muted small">${esc(tname(quiz.t))}</span><div class="score">${p}%</div><p class="muted" style="font-size:18px;font-weight:600">${quiz.ok}/${n} certas</p></div>
 ${errs.length?`<div class="card"><h3>Para rever (${errs.length})</h3>${errs.map(q=>`<div class="err"><span>${esc(q[2])}</span><span class="a">${esc(ansTxt(q))}</span></div>`).join('')}</div>`:''}
 <button class="big" onclick="start('${quiz.t}')">Nova ronda</button>
 ${S.wrong.filter(inCur).length?`<button class="ghost" onclick="start('${ERR()}')">Rever os meus erros (${S.wrong.filter(inCur).length})</button>`:''}
 <button class="ghost" onclick="go('test')">Voltar às matérias</button>`}

function prog(){const T=T_();const TK=[...T.keys,ALL(),ERR(),SAV()];
 const H=S.history.filter(x=>TK.includes(x.t)||(x.t.startsWith('sub:')&&T.keys.includes(x.t.slice(4).split(':')[0])));
 if(!H.length)return `${header("go('test')",'Evolução')}<div class="card empty">Ainda não há rondas feitas neste teste.</div>`;
 const pcts=H.map(x=>Math.round(x.c/x.n*100)),avg=Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length);
 const last=H.slice(-15),W=320,Hh=150,pl=32,pr=10,pt=10,pb=22;
 const xs=i=>pl+(last.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(last.length-1)),ys=v=>pt+(100-v)/100*(Hh-pt-pb);
 const pts=last.map((x,i)=>[xs(i),ys(Math.round(x.c/x.n*100))]);
 const css=getComputedStyle(document.documentElement),ac=css.getPropertyValue('--accent').trim(),ln=css.getPropertyValue('--line').trim(),mu=css.getPropertyValue('--muted').trim();
 const grid=[0,50,100].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${ys(v)}" y2="${ys(v)}" stroke="${ln}"/><text x="${pl-6}" y="${ys(v)+4}" font-size="10" text-anchor="end" fill="${mu}">${v}%</text>`).join('');
 const chart=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Percentagem de acertos nas últimas rondas">${grid}<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${ac}" stroke-width="2"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:3}" fill="${ac}"/>`).join('')}<text x="${pl}" y="${Hh-5}" font-size="10" fill="${mu}">mais antiga</text><text x="${W-pr}" y="${Hh-5}" font-size="10" text-anchor="end" fill="${mu}">última</text></svg>`;
 const rows=T.keys.map(k=>{const P=TOPICS[k];let ok=0,n=0;for(const [kk,v] of Object.entries(S.sub))if(kk.startsWith(k+':')){ok+=v[0];n+=v[1]}
  if(!n)return `<div class="trow" style="--c:${P.c}"><span class="nm">${P.n}</span><span class="v">sem respostas</span><div class="bar"><i style="width:0"></i></div></div>`;
  const p=Math.round(ok/n*100),st=stats(k);const tr=st&&st.prev!==null?(st.last>st.prev?' · a subir':st.last<st.prev?' · a descer':''):'';
  return `<div class="trow" style="--c:${P.c}"><span class="nm">${P.n}</span><span class="v">${p}% (${n})${tr}</span><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('');
 const weak=Object.entries(S.sub).filter(([k,v])=>v[1]>=3&&SUBN[k]&&T.keys.includes(k.split(':')[0])).map(([k,v])=>[k,Math.round(v[0]/v[1]*100)]).filter(x=>x[1]<80).sort((a,b)=>a[1]-b[1]).slice(0,5);
 const f5=pcts.slice(0,5),l5=pcts.slice(-5),evo=pcts.length>=6?Math.round(l5.reduce((a,b)=>a+b,0)/l5.length-f5.reduce((a,b)=>a+b,0)/f5.length):null;
 return `${header("go('test')",'Evolução')}
 <div class="card"><div class="kpis"><div class="kpi"><b>${H.length}</b><span>rondas</span></div><div class="kpi"><b>${avg}%</b><span>média</span></div><div class="kpi"><b>${fmtT(S.time[cur]||0).replace('menos de 1 min','<1 min')}</b><span>estudo</span></div></div>
 <p class="small muted">${evo!==null?`Últimas 5 rondas vs. primeiras 5: <b style="color:var(--ink)">${evo>0?'+':''}${evo} pontos percentuais</b>.`:'Com 6 ou mais rondas aparece a comparação entre as primeiras e as últimas.'}</p></div>
 <div class="card chart"><h3>Acertos nas últimas ${last.length} rondas</h3>${chart}</div>
 <div class="card"><h3>Por matéria</h3>${rows}</div>
 <div class="card"><h3>Pontos fracos</h3>${weak.length?`<p class="muted small">Abaixo de 80% (com pelo menos 3 respostas). Toca para treinar só isso.</p>${weak.map(([k,p])=>`<button class="wk" onclick="start('sub:${k}')"><span>${esc(SUBN[k])}</span><span>${p}% · treinar</span></button>`).join('')}`:'<p class="muted small">Nada abaixo de 80% (com pelo menos 3 respostas).</p>'}</div>`}

render();
</script>
</body>
</html>
