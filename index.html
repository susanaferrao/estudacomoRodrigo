// Cartões de estudo — Filosofia, Lógica formal (a partir do resumo da Susana)
const EX=(l,c)=>`<div class="ex">${l.map(x=>`<div>${x}</div>`).join('')}<div class="cc">${c}</div></div>`;
const STUDY_FI={
1:[
 {t:'Para que serve a lógica formal?',h:`<p>Serve para <b>distinguir os bons argumentos dos maus</b>, através de regras formais (quase como na matemática).</p><p>O que conta é a <b>forma</b> (o modo como o argumento está construído), não o assunto de que fala.</p><div class="quote">«Do mesmo modo que a matemática é o instrumento da ciência, também a lógica é o instrumento da filosofia.»<span>A. C. Grayling</span></div>`},
 {t:'Problema → Tese → Argumento',h:`<div class="steps"><div><b>1 · Problema</b>Uma pergunta filosófica.<br><i>Ex.: Somos responsáveis pelo que fazemos?</i></div><div><b>2 · Tese</b>A posição defendida, a resposta ao problema. É a <b>conclusão</b> do argumento.</div><div><b>3 · Argumento</b>As boas razões que justificam a tese (é isso que a distingue de uma opinião).</div></div>`},
 {t:'Anatomia de um argumento',h:`<p>Conjunto de proposições: uma ou mais <b>premissas</b> (as razões) das quais se tira uma <b>única conclusão</b>.</p><table class="st"><tr><td>Premissa 1</td><td>Todos os homens são mortais.</td></tr><tr><td>Premissa 2</td><td>Sócrates é homem.</td></tr><tr><td><b>Conclusão</b></td><td><b>Logo, Sócrates é mortal.</b></td></tr></table><div class="two"><div><b>Anunciam a conclusão</b>logo · portanto · por conseguinte · por isso · então</div><div><b>Anunciam premissas</b>porque · pois · dado que · visto que · já que</div></div>`},
 {t:'O que é uma proposição?',h:`<p>Uma <b>frase declarativa com valor de verdade</b>: pode ser verdadeira ou falsa.</p><ul class="ck"><li class="y">Lisboa é a capital de Portugal. (V)</li><li class="y">Todos os peixes voam. (F, mas é proposição!)</li><li class="n">Fecha a porta. (ordem)</li><li class="n">Que horas são? (pergunta)</li><li class="n">Oxalá chova. (desejo / prece)</li></ul><p class="note">Ordens, perguntas, pedidos, desejos e preces não são verdadeiros nem falsos.</p>`},
 {t:'Argumentos dedutivos e indutivos',h:`<div class="box"><b>Dedutivo</b><p>Premissas verdadeiras → conclusão <b>necessariamente</b> verdadeira. A lógica formal estuda estes.</p>${EX(['Se chover, a rua ficará molhada.','Está a chover.'],'Logo, a rua ficará molhada.')}</div><div class="box"><b>Indutivo</b><p>A conclusão é apenas <b>provável</b>: vai além do que as premissas garantem (generaliza ou prevê).</p>${EX(['Nos últimos dez testes, o João teve positiva.'],'Portanto, o João terá positiva no próximo teste.')}</div>`},
],
2:[
 {t:'Verdade, validade e solidez',h:`<div class="box b1"><b>Verdade</b><p>É das <b>proposições</b> (premissas e conclusão), não dos argumentos. Depende do <b>conteúdo</b>: corresponde ou não à realidade?</p><span class="tag">proposições: V ou F</span></div><div class="box b2"><b>Validade</b><p>É dos <b>argumentos</b>. Depende só da <b>forma</b>: a conclusão segue-se <b>necessariamente</b> das premissas?</p><span class="tag">argumentos: válido ou inválido</span></div><div class="box b3"><b>Solidez</b><p>Argumento <b>válido</b> + <b>premissas verdadeiras</b>. É o "bom argumento" que a filosofia procura.</p><span class="tag">sólido = válido + tudo V</span></div>`},
 {t:'O teste da validade',h:`<div class="warn"><b>É possível as premissas serem verdadeiras e a conclusão falsa?</b><br>Se <b>sim</b> → inválido. Se <b>não</b> (é impossível) → válido.</div><p><b>A única combinação impossível:</b> argumento válido, premissas verdadeiras e conclusão falsa.</p>`},
 {t:'Os 4 casos',h:`<div class="case ok"><span>SÓLIDO</span><b>Válido + premissas verdadeiras</b>${EX(['Todas as novelas são obras narrativas.','Amor de Perdição é uma novela.'],'Logo, Amor de Perdição é uma obra narrativa.')}</div><div class="case mid"><span>NÃO SÓLIDO</span><b>Válido + premissa falsa</b>${EX(['Todos os ditadores são imperadores. (F)','Júlio César foi ditador.'],'Logo, Júlio César foi imperador. (F)')}</div><div class="case no"><span>NÃO SÓLIDO</span><b>Inválido, mesmo com tudo V</b>${EX(['Se Pessoa escreveu Mensagem, então era escritor.','Pessoa era escritor.'],'Logo, Pessoa escreveu Mensagem.')}</div><div class="case no"><span>NÃO SÓLIDO</span><b>Inválido + conclusão falsa</b>${EX(['Se A Noite Estrelada é uma aguarela, então é uma pintura.','A Noite Estrelada não é uma aguarela.'],'Logo, não é uma pintura. (F)')}</div>`},
 {t:'Regras de ouro',h:`<ul class="dots"><li>Todo o argumento sólido é válido; <b>nem todo o válido é sólido</b>.</li><li>Premissas e conclusão verdadeiras <b>não</b> tornam um argumento válido.</li><li>Uma conclusão falsa não prova que o argumento é inválido: pode ter uma premissa falsa.</li><li>Conclusão "solta", sem ligação às premissas → inválido. Ex.: "David é uma personagem bíblica. Logo, Da Vinci era crente."</li></ul>`},
 {t:'Formas a reconhecer logo',h:`<table class="st"><tr><th>Forma</th><th>Esquema</th><th></th></tr><tr><td>Modus ponens</td><td>P→Q, P ∴ Q</td><td class="g">válido</td></tr><tr><td>Modus tollens</td><td>P→Q, ¬Q ∴ ¬P</td><td class="g">válido</td></tr><tr><td>Afirmar o consequente</td><td>P→Q, Q ∴ P</td><td class="r">inválido</td></tr><tr><td>Negar o antecedente</td><td>P→Q, ¬P ∴ ¬Q</td><td class="r">inválido</td></tr></table><p class="note">O exemplo de Pessoa é "afirmar o consequente"; o da Noite Estrelada é "negar o antecedente".</p>`},
],
3:[
 {t:'Proposição categórica',h:`<p>Afirma ou nega algo <b>sem condições e sem alternativas</b> (sem "se", sem "ou"). Tem sempre a forma:</p><div class="formula">quantificador + sujeito (S) + é / não é + predicado (P)</div><div class="two"><div><b>Quantidade</b> (olha para o sujeito)<br>Universal: fala de <b>todos</b> os S (A, E).<br>Particular: fala de <b>alguns</b>, ou seja, de pelo menos um S (I, O).</div><div><b>Qualidade</b> (olha para o verbo)<br>Afirmativa: "é" (A, I).<br>Negativa: "não é" (E, O).<br><i>Truque: AffIrmo (A, I) · nEgO (E, O).</i></div></div>`},
 {t:'Os quatro tipos',h:`<div class="aeio"><div><span>A</span><b>Universal afirmativa</b> · Todo o S é P<br>Todo o aluno é estudioso.<i>Pistas: todos · qualquer · cada</i></div><div><span>E</span><b>Universal negativa</b> · Nenhum S é P<br>Nenhum aluno é estudioso.<i>Pistas: nenhum · não há · todo o S não é</i></div><div><span>I</span><b>Particular afirmativa</b> · Algum S é P<br>Alguns alunos são estudiosos.<i>Pistas: alguns · certos · há pelo menos um</i></div><div><span>O</span><b>Particular negativa</b> · Algum S não é P<br>Alguns alunos não são estudiosos.<i>Pistas: alguns não · muitos não · existe um que não</i></div></div>`},
 {t:'Traduzir frases do dia a dia',h:`<table class="st"><tr><td>Os mamíferos bebem leite.</td><td class="k">A</td></tr><tr><td>Qualquer mamífero bebe leite.</td><td class="k">A</td></tr><tr><td>Não há mamífero que voe.</td><td class="k">E</td></tr><tr><td>A maior parte dos mamíferos não tem penas.</td><td class="k">O</td></tr><tr><td>Certos mamíferos são aquáticos.</td><td class="k">I</td></tr><tr><td>Há pelo menos um mamífero que põe ovos.</td><td class="k">I</td></tr><tr><td>Existe pelo menos um mamífero que não amamenta.</td><td class="k">O</td></tr><tr><td>Muitos mamíferos não são aquáticos.</td><td class="k">O</td></tr></table>`},
 {t:'Atenção ao "alguns"',h:`<div class="warn">Em lógica, "alguns" = <b>pelo menos um</b>. Não quer dizer "a maior parte", nem "só alguns".</div><p>"A maior parte" e "muitos" entram nas particulares (I ou O), mas I não significa "a maior parte".</p><p>"Todo o S não é P" = Nenhum S é P → <b>tipo E</b>.</p>`},
],
4:[
 {t:'O quadrado da oposição',h:`<div class="sq"><div class="c a"><span>A</span>Todo o acto é premeditado.<i>universal afirmativa</i></div><div class="c e"><span>E</span>Nenhum acto é premeditado.<i>universal negativa</i></div><div class="c i"><span>I</span>Alguns actos são premeditados.<i>particular afirmativa</i></div><div class="c o"><span>O</span>Alguns actos não são premeditados.<i>particular negativa</i></div></div><p class="note">A–E: contrárias · I–O: subcontrárias · diagonais (A–O, E–I): contraditórias · A→I e E→O: subalternas.</p>`},
 {t:'Como negar uma proposição',h:`<p>A negação de uma proposição é a sua <b>contraditória</b> (a diagonal). Trocam-se duas coisas ao mesmo tempo:</p><ul class="dots"><li>a <b>quantidade</b>: universal ↔ particular (todos ↔ alguns);</li><li>a <b>qualidade</b>: afirmativa ↔ negativa (é ↔ não é).</li></ul><div class="formula">A "Todos são" ⟷ O "Alguns não são"<br>E "Nenhum é" ⟷ I "Alguns são"</div><div class="warn">Negar "Todos os políticos mentem" <b>não</b> é "Nenhum mente": é "<b>Alguns não mentem</b>".</div>`},
 {t:'As quatro relações',h:`<div class="box"><b>Contraditórias (A–O, E–I)</b><p>Têm sempre valores de verdade opostos: uma é V e a outra é F. Nunca as duas V, nunca as duas F.</p></div><div class="box"><b>Contrárias (A–E)</b><p>Não podem ser ambas verdadeiras, mas podem ser ambas falsas. Ex.: as duas são F se só alguns actos forem premeditados.</p></div><div class="box"><b>Subcontrárias (I–O)</b><p>Não podem ser ambas falsas, mas podem ser ambas verdadeiras. Pelo menos uma é V.</p></div><div class="box"><b>Subalternas (A→I, E→O)</b><p>Se a universal é V, a particular também é V (a verdade "desce"). Se a particular é F, a universal também é F.</p></div>`},
],
5:[
 {t:'O que é uma conectiva?',h:`<p>Uma conectiva (ou <b>operador verofuncional</b>) liga ou altera proposições. Com ela formamos proposições <b>complexas</b> (compostas) a partir de proposições <b>simples</b> (elementares), que representamos com letras: P, Q, R…</p><div class="formula">P: Está sol · Q: Vou à praia</div>`},
 {t:'As seis conectivas',h:`<table class="st"><tr><th></th><th>Nome</th><th>Em português</th><th>Forma</th></tr><tr><td class="k">¬</td><td>Negação</td><td>não · não é verdade que · é falso que · é mentira que</td><td>¬P</td></tr><tr><td class="k">∧</td><td>Conjunção</td><td>e · mas · tanto… como… · contudo · embora</td><td>P∧Q</td></tr><tr><td class="k">∨</td><td>Disjunção inclusiva</td><td>ou (pode ser um, outro ou os dois)</td><td>P∨Q</td></tr><tr><td class="k">⊻</td><td>Disjunção exclusiva</td><td>ou… ou… (um ou outro, não os dois)</td><td>P⊻Q</td></tr><tr><td class="k">→</td><td>Condicional</td><td>se… então… · Q se P · Q caso P</td><td>P→Q</td></tr><tr><td class="k">↔</td><td>Bicondicional</td><td>se e só se · quando e só quando</td><td>P↔Q</td></tr></table>`},
 {t:'Formalizar em 3 passos',h:`<ol class="num"><li>Encontrar as proposições simples e escrevê-las na <b>afirmativa</b> (o "não" fica para o símbolo ¬).</li><li>Fazer o <b>dicionário</b>: P = …, Q = …, R = …</li><li>Identificar as conectivas e usar <b>parênteses</b> para mostrar o que vai junto.</li></ol><div class="box"><p>"Se Galileu defendeu o heliocentrismo, então entrou em conflito com as ideias da época e foi julgado."</p><p class="note">P: Galileu defendeu o heliocentrismo · Q: entrou em conflito… · R: foi julgado</p><div class="formula">P → (Q ∧ R)</div></div>`},
 {t:'As armadilhas',h:`<ul class="dots"><li>"mas", "contudo", "embora" = conjunção <b>∧</b>.</li><li>"Q se P" = <b>P → Q</b>. A condição (o que vem a seguir ao "se") é sempre o antecedente.<br><i>"Amanhã não vais à escola se te constipares" → P → ¬Q</i> (P = te constipares; Q = vais à escola)</li><li>"Não é verdade que…" no início nega tudo: <b>¬(P ∧ Q)</b> ≠ ¬P ∧ Q, que só nega o P.</li><li>"ou… ou…" → <b>⊻</b> · "ou" sozinho → <b>∨</b>.</li><li>"nem… nem…" = <b>¬P ∧ ¬Q</b>.</li><li>"Tanto existe maldade como bondade" = <b>P ∧ Q</b>.</li></ul>`},
 {t:'Exemplos dos exercícios',h:`<div class="box"><p>Não é verdade que a Revolução Francesa tenha influenciado a política europeia e não tenha alterado a sociedade francesa.</p><div class="formula">¬(P ∧ ¬Q)</div></div><div class="box"><p>Se Platão influenciou a filosofia e Aristóteles a ciência medieval, então a cultura europeia não se desenvolveu sem a herança grega.</p><div class="formula">(P ∧ Q) → ¬R</div></div>`},
],
6:[
 {t:'Quando é que cada conectiva é verdadeira',h:`<div class="tts"><table class="st tt"><tr><th>P</th><th>¬P</th></tr><tr><td>V</td><td>F</td></tr><tr><td>F</td><td>V</td></tr><tr><td colspan="2" class="cap">Negação: troca o valor</td></tr></table>${[['∧','Conjunção','VFFF','Só é V se as duas forem V.'],['∨','Disjunção inclusiva','VVVF','Só é F se as duas forem F.'],['⊻','Disjunção exclusiva','FVVF','É F se as duas tiverem o mesmo valor.'],['→','Condicional','VFVV','Só é F se P for V e Q for F.'],['↔','Bicondicional','VFFV','É V se as duas tiverem o mesmo valor.']].map(([s,n,c,d])=>`<table class="st tt"><tr><th>P</th><th>Q</th><th>${s}</th></tr>${['VV','VF','FV','FF'].map((r,i)=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="k">${c[i]}</td></tr>`).join('')}<tr><td colspan="3" class="cap"><b>${n}</b>: ${d}</td></tr></table>`).join('')}</div>`},
 {t:'Truque para a condicional',h:`<p>Pensa numa <b>promessa</b>: "Se tiveres positiva, então dou-te um prémio."</p><p>Só mentiste (F) se ele <b>teve positiva e não recebeu o prémio</b>.</p><p>Se não teve positiva, a promessa não foi quebrada (V).</p>`},
 {t:'Quantas linhas tem a tabela?',h:`<p>Com <b>n</b> proposições simples há <b>2ⁿ</b> linhas: 2 letras → 4 · 3 letras → 8 · 4 letras → 16.</p><p>Na 1.ª coluna, metade V e metade F; em cada coluna seguinte, os blocos ficam com metade do tamanho. A última coluna alterna V, F, V, F… Assim aparecem todas as combinações, sem repetir nenhuma.</p><table class="st tt"><tr><th>P</th><th>Q</th><th>R</th></tr>${['VVV','VVF','VFV','VFF','FVV','FVF','FFV','FFF'].map(r=>`<tr>${[...r].map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`},
 {t:'Exemplo resolvido: ¬(P ∧ ¬Q)',h:`<p>Resolve-se de dentro para fora, uma coluna de cada vez:</p><ol class="num"><li>Colunas de P e Q (4 combinações).</li><li>¬Q: troca os valores de Q.</li><li>P ∧ ¬Q: V só quando P e ¬Q são V.</li><li>¬(…): troca o resultado do passo 3.</li></ol><table class="st tt"><tr><th>P</th><th>Q</th><th>¬Q</th><th>P∧¬Q</th><th>¬(P∧¬Q)</th></tr><tr><td>V</td><td>V</td><td>F</td><td>F</td><td class="k">V</td></tr><tr><td>V</td><td>F</td><td>V</td><td>V</td><td class="k">F</td></tr><tr><td>F</td><td>V</td><td>F</td><td>F</td><td class="k">V</td></tr><tr><td>F</td><td>F</td><td>V</td><td>F</td><td class="k">V</td></tr></table><p class="note">Curiosidade: o resultado (V F V V) é igual ao de P → Q. As duas fórmulas são equivalentes.</p>`},
],
};

// Matemática A — Funções: cartões de estudo (a partir do resumo da Susana). Gráficos desenhados em SVG.
function PL(o){
 const W=300,H=o.h||200,pad=16,[x0,x1,y0,y1]=o.r;
 const X=x=>pad+(x-x0)/(x1-x0)*(W-2*pad), Y=y=>H-pad-(y-y0)/(y1-y0)*(H-2*pad);
 let g='';
 if(o.grid!==false){for(let x=Math.ceil(x0);x<=x1;x++)g+=`<line x1="${X(x)}" y1="${Y(y0)}" x2="${X(x)}" y2="${Y(y1)}" style="stroke:var(--line)" stroke-width=".6"/>`;
  for(let y=Math.ceil(y0);y<=y1;y++)g+=`<line x1="${X(x0)}" y1="${Y(y)}" x2="${X(x1)}" y2="${Y(y)}" style="stroke:var(--line)" stroke-width=".6"/>`}
 g+=`<line x1="${X(x0)}" y1="${Y(0)}" x2="${X(x1)}" y2="${Y(0)}" style="stroke:var(--muted)" stroke-width="1.2"/><line x1="${X(0)}" y1="${Y(y0)}" x2="${X(0)}" y2="${Y(y1)}" style="stroke:var(--muted)" stroke-width="1.2"/>`;
 g+=`<text x="${X(x1)-4}" y="${Y(0)-5}" font-size="10" text-anchor="end" style="fill:var(--muted)" font-style="italic">x</text><text x="${X(0)+5}" y="${Y(y1)+10}" font-size="10" style="fill:var(--muted)" font-style="italic">y</text>`;
 if(o.ticks!==false){for(let x=Math.ceil(x0);x<=x1;x++)if(x&&(o.tx||1)&&x%(o.tx||1)===0)g+=`<text x="${X(x)}" y="${Y(0)+11}" font-size="8" text-anchor="middle" style="fill:var(--muted)">${String(x).replace('-','−')}</text>`;
  for(let y=Math.ceil(y0);y<=y1;y++)if(y&&y%(o.ty||1)===0)g+=`<text x="${X(0)-4}" y="${Y(y)+3}" font-size="8" text-anchor="end" style="fill:var(--muted)">${String(y).replace('-','−')}</text>`}
 (o.c||[]).forEach(c=>{let pts=c.p;if(c.f){pts=[];const a=c.d?c.d[0]:x0,b=c.d?c.d[1]:x1;for(let i=0;i<=120;i++){const x=a+(b-a)*i/120,y=c.f(x);if(y>=y0-1&&y<=y1+1)pts.push([x,y]);else pts.push(null)}}
  let d='',pen=false;pts.forEach(p=>{if(!p){pen=false;return}d+=(pen?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)+' ';pen=true});
  g+=`<path d="${d}" fill="none" style="stroke:${c.col||'var(--ink)'}" stroke-width="${c.w||2}" ${c.dash?'stroke-dasharray="4 3"':''} stroke-linejoin="round"/>`});
 (o.seg||[]).forEach(([a,b,col])=>{g+=`<line x1="${X(a)}" y1="${Y(0)}" x2="${X(b)}" y2="${Y(0)}" style="stroke:${col}" stroke-width="4"/>`});
 (o.pt||[]).forEach(([x,y,open,lab,dx,dy])=>{g+=`<circle cx="${X(x)}" cy="${Y(y)}" r="3.4" style="fill:${open?'var(--card)':'var(--accent)'};stroke:var(--accent)" stroke-width="1.5"/>`;if(lab)g+=`<text x="${X(x)+(dx||5)}" y="${Y(y)+(dy||-6)}" font-size="9" font-weight="600" style="fill:var(--accent)">${lab}</text>`});
 (o.lab||[]).forEach(([x,y,t,anc])=>{g+=`<text x="${X(x)}" y="${Y(y)}" font-size="9" text-anchor="${anc||'start'}" style="fill:var(--ink)">${t}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:420px;display:block;margin:0 auto" font-family="inherit">${g}</svg>`}
const mini=(f,cap,col)=>`<div style="text-align:center;font-size:12px">${PL({r:[-3,3,-3,3],h:120,ticks:false,c:[{f,col:col||'var(--ink)'}]})}${cap}</div>`;
const G3=(a,b,c)=>`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${a}${b}${c}</div>`;
const MODEL=PL({r:[-6,7,-3,4],h:220,c:[{p:[[-5,-1],[-3,3],[2,-2],[6,2]]}],seg:[[-4.5,0,'#2d5fa8'],[4,6,'#2d5fa8'],[-5,-4.5,'#c0552b'],[0,4,'#c0552b']],
 pt:[[-5,-1,0,'mín. rel. −1',-20,14],[-3,3,0,'máx. abs. 3',-28,-7],[2,-2,0,'mín. abs. −2',-22,15],[6,2,0,'máx. rel. 2',-48,-7],[-4.5,0,0],[0,0,0],[4,0,0]]});
const STUDY_MA={
1:[
 {t:'A ideia principal',h:`<p>Uma <b>função f de A em B</b> é uma regra que associa a <b>cada</b> elemento x de A <b>um e um só</b> elemento y = f(x) de B.</p><div class="formula">f : A → B, &nbsp;x ↦ f(x)</div><div class="warn">Cada objeto tem só uma imagem. Dois objetos podem ter a mesma imagem — isso é permitido.</div><div class="box"><b>Exemplo: f(x) = 2x</b><p>A = {1, 2, 3} &nbsp;→&nbsp; B = {2, 4, 6, 8}<br>1 ↦ 2 · 2 ↦ 4 · 3 ↦ 6</p><p class="note">O 8 não é imagem de ninguém: o contradomínio é {2, 4, 6} e o conjunto de chegada é {2, 4, 6, 8}.</p></div>`},
 {t:'Vocabulário',h:`<table class="st"><tr><td><b>Objeto</b></td><td>Um valor x do domínio (variável independente).</td></tr><tr><td><b>Imagem</b></td><td>O valor f(x) que corresponde a x (variável dependente).</td></tr><tr><td><b>Domínio D<sub>f</sub></b></td><td>Conjunto de todos os objetos (os valores que podemos usar).</td></tr><tr><td><b>Conjunto de chegada</b></td><td>Onde as imagens "podem cair" (no exemplo, B).</td></tr><tr><td><b>Contradomínio D′<sub>f</sub></b></td><td>Conjunto das imagens que são mesmo atingidas. Está dentro do conjunto de chegada.</td></tr><tr><td><b>Gráfico</b></td><td>Conjunto de todos os pontos (x, f(x)) com x no domínio.</td></tr></table>`},
 {t:'4 formas de representar a mesma função',h:`<div class="two"><div><b>Tabela</b><table class="st tt"><tr><td>x</td><td>1</td><td>2</td><td>3</td></tr><tr><td>f(x)</td><td>2</td><td>4</td><td>6</td></tr></table></div><div><b>Expressão</b>f(x) = 2x, com x ∈ {1, 2, 3}</div><div><b>Gráfico</b>${PL({r:[-0.5,4,-0.5,7],h:150,pt:[[1,2],[2,4],[3,6]],ty:2})}</div><div><b>Em palavras</b>"A cada número de A faz corresponder o seu dobro."</div></div>`},
 {t:'Teste da reta vertical',h:`<p>Um desenho é gráfico de uma função se <b>qualquer reta vertical</b> o cortar <b>no máximo uma vez</b>.</p><p>Se alguma reta vertical corta em 2 pontos, há um x com 2 imagens → <b>não é função</b>.</p><div class="two"><div style="text-align:center"><b style="color:var(--ok)">✓ É função</b>${PL({r:[-3,3,-3,3],h:140,ticks:false,c:[{f:x=>x*x/2-1.5},{p:[[1,-3],[1,3]],col:'var(--muted)',dash:1,w:1.2}]})}</div><div style="text-align:center"><b style="color:var(--bad)">✗ Não é função</b>${PL({r:[-3,3,-3,3],h:140,ticks:false,c:[{p:Array.from({length:61},(_,i)=>{const t=i/60*2*Math.PI;return[2*Math.cos(t),2*Math.sin(t)]})},{p:[[1,-3],[1,3]],col:'var(--muted)',dash:1,w:1.2}],pt:[[1,1.732],[1,-1.732]]})}</div></div>`},
 {t:'Domínio, imagens e objetos',h:`<div class="box"><b>Domínio a partir da expressão</b><p>Sem restrições, o domínio é ℝ (todos os reais).</p><p>Num contexto real só vale o que faz sentido (ex.: tempo t ≥ 0).</p></div><div class="box"><b>Calcular imagens e objetos</b><p><b>Imagem de 3:</b> substituir → f(3).</p><p><b>Objeto(s) com imagem 5:</b> resolver a equação f(x) = 5.</p></div>`},
],
2:[
 {t:'O exemplo-modelo',h:`<p>Quase tudo nos testes começa por <b>ler um gráfico</b>. Função f de domínio [−5, 6]:</p><div class="fig">${MODEL}<div class="fs"><span style="color:#2d5fa8">■</span> f(x) &gt; 0 (acima do eixo) · <span style="color:#c0552b">■</span> f(x) &lt; 0 (abaixo do eixo) · ● zeros: −4,5; 0; 4</div></div><p>Cresce em [−5, −3], decresce em [−3, 2], cresce em [2, 6].</p>`},
 {t:'Tabela de variação (monotonia)',h:`<div class="fig">${MODEL}</div><table class="st tt"><tr><th>x</th><th>−5</th><th></th><th>−3</th><th></th><th>2</th><th></th><th>6</th></tr><tr><td><b>f(x)</b></td><td>−1</td><td>↗</td><td>3</td><td>↘</td><td>−2</td><td>↗</td><td>2</td></tr><tr><td>ext.</td><td>mín.</td><td></td><td>máx.</td><td></td><td>mín.</td><td></td><td>máx.</td></tr></table><p>Crescente em [−5, −3] e em [2, 6]; decrescente em [−3, 2].</p>`},
 {t:'Tabela de sinal (zeros e sinal)',h:`<div class="fig">${MODEL}</div><table class="st tt"><tr><th>x</th><th>−5</th><th></th><th>−4,5</th><th></th><th>0</th><th></th><th>4</th><th></th><th>6</th></tr><tr><td><b>f(x)</b></td><td>−</td><td style="color:#c0552b">−</td><td>0</td><td style="color:#2d5fa8">+</td><td>0</td><td style="color:#c0552b">−</td><td>0</td><td style="color:#2d5fa8">+</td><td>+</td></tr></table><p>Zeros: −4,5; 0; 4. Contradomínio: [−2, 3]. Ordenada na origem: f(0) = 0.</p>`},
 {t:'Zeros, monotonia e extremos',h:`<div class="box b1"><b>Zeros e sinal</b><p><b>Zero</b> = objeto cuja imagem é 0 → onde o gráfico <b>toca o eixo x</b>. Resolve-se f(x) = 0.</p><p><b>Positiva:</b> gráfico acima do eixo x. <b>Negativa:</b> abaixo.</p></div><div class="box b2"><b>Monotonia</b><p><b>Crescente:</b> quando x aumenta, f(x) aumenta (o gráfico "sobe" da esquerda para a direita).</p><p><b>Decrescente:</b> "desce". <b>Constante:</b> fica igual (segmento horizontal).</p></div><div class="box b3"><b>Extremos</b><p><b>Absoluto:</b> o maior/menor valor de toda a função. <b>Relativo:</b> o maior/menor só ali à volta.</p><p>O <b>máximo</b> é um y; o <b>maximizante</b> é o x onde acontece.</p></div><div class="warn">Os intervalos de monotonia escrevem-se com valores de <b>x</b>; o contradomínio escreve-se com valores de <b>y</b>. Um extremo absoluto é sempre também relativo.</div>`},
],
3:[
 {t:'Função afim f(x) = mx + b',h:`<p>O gráfico é uma <b>reta</b>.</p><ul class="dots"><li><b>m = declive:</b> m &gt; 0 crescente · m &lt; 0 decrescente · m = 0 constante.</li><li><b>b = ordenada na origem</b> (onde corta o eixo y).</li><li><b>Zero:</b> mx + b = 0 ⇔ x = −b/m (se m ≠ 0).</li><li>A partir de 2 pontos: <b>m = (y₂ − y₁) / (x₂ − x₁)</b>.</li><li>Se b = 0: f(x) = mx é <b>linear</b> (proporcionalidade direta).</li></ul>${G3(mini(x=>x*0.8+0.3,'m &gt; 0 ↗'),mini(x=>-x*0.8+0.3,'m &lt; 0 ↘'),mini(()=>1,'m = 0 →'))}`},
 {t:'Quadrática: 3 formas de escrever',h:`<p>O gráfico é uma <b>parábola</b>. A mesma função pode aparecer escrita de 3 formas, e cada uma "mostra" uma coisa diferente:</p><div class="box"><b>Forma geral: ax² + bx + c</b><p>a ≠ 0. Mostra a ordenada na origem: f(0) = c.</p><p class="note">Ex.: x² − 2x − 3</p></div><div class="box"><b>Forma canónica: a(x − h)² + k</b><p>Mostra o vértice V(h, k) e o eixo x = h.</p><p class="note">Ex.: (x − 1)² − 4</p></div><div class="box"><b>Forma fatorizada: a(x − x₁)(x − x₂)</b><p>Mostra os zeros x₁ e x₂ (só existe se houver zeros).</p><p class="note">Ex.: (x + 1)(x − 3)</p></div>`},
 {t:'Exemplo: f(x) = x² − 2x − 3',h:`<div class="fig">${PL({r:[-3,5,-5,5],h:220,c:[{f:x=>x*x-2*x-3},{p:[[1,-5],[1,5]],col:'var(--muted)',dash:1,w:1}],pt:[[-1,0,0,'zero',-24,-6],[3,0,0,'zero',4,-6],[1,-4,0,'V(1, −4)',6,4],[0,-3,0,'f(0) = −3',-52,4]],lab:[[1.1,4.5,'eixo: x = 1']]})}</div><ol class="num"><li><b>Vértice:</b> h = −b / (2a) = 2/2 = 1 e k = f(1) = −4.</li><li><b>Concavidade</b> (sinal de a): a &gt; 0 ∪ → tem mínimo · a &lt; 0 ∩ → tem máximo.</li><li><b>Zeros:</b> −1 e 3. <b>D′</b> = [−4, +∞[. Decrescente em ]−∞, 1], crescente em [1, +∞[.</li></ol><div class="warn"><b>Truque:</b> os zeros são simétricos em relação ao eixo. O vértice está a meio: h = (x₁ + x₂)/2 = (−1 + 3)/2 = 1.</div>`},
 {t:'Concavidade',h:`<div class="two"><div style="text-align:center">${PL({r:[-3,3,-3,3],h:140,ticks:false,c:[{f:x=>x*x-2}]})}<b>a &gt; 0 ∪</b>tem mínimo</div><div style="text-align:center">${PL({r:[-3,3,-3,3],h:140,ticks:false,c:[{f:x=>-x*x+2}]})}<b>a &lt; 0 ∩</b>tem máximo</div></div>`},
],
4:[
 {t:'Fórmula resolvente',h:`<p>Para ax² + bx + c = 0, com a ≠ 0:</p><div class="formula" style="font-size:18px">x = <span style="display:inline-block;vertical-align:middle;text-align:center"><span style="display:block;border-bottom:1.5px solid currentColor;padding:0 4px">−b ± √(b² − 4ac)</span><span style="display:block">2a</span></span></div><p>O que está dentro da raiz é o <b>binómio discriminante</b>:</p><div class="formula">Δ = b² − 4ac</div>`},
 {t:'O discriminante diz quantos zeros há',h:`<p><b>a &gt; 0</b> (∪)</p>${G3(`<div style="text-align:center;font-size:12px">${PL({r:[-3,3,-3,3],h:260,ticks:false,c:[{f:x=>x*x-2,w:4}]})}<b>Δ &gt; 0</b><br>2 zeros</div>`,`<div style="text-align:center;font-size:12px">${PL({r:[-3,3,-3,3],h:260,ticks:false,c:[{f:x=>x*x,w:4}]})}<b>Δ = 0</b><br>1 zero (duplo)</div>`,`<div style="text-align:center;font-size:12px">${PL({r:[-3,3,-3,3],h:260,ticks:false,c:[{f:x=>x*x+1,w:4}]})}<b>Δ &lt; 0</b><br>nenhum zero</div>`)}<p><b>a &lt; 0</b> (∩)</p>${G3(`<div style="text-align:center;font-size:12px">${PL({r:[-3,3,-3,3],h:260,ticks:false,c:[{f:x=>-x*x+2,w:4}]})}<b>Δ &gt; 0</b><br>2 zeros</div>`,`<div style="text-align:center;font-size:12px">${PL({r:[-3,3,-3,3],h:260,ticks:false,c:[{f:x=>-x*x,w:4}]})}<b>Δ = 0</b><br>1 zero (duplo)</div>`,`<div style="text-align:center;font-size:12px">${PL({r:[-3,3,-3,3],h:260,ticks:false,c:[{f:x=>-x*x-1,w:4}]})}<b>Δ &lt; 0</b><br>nenhum zero</div>`)}<div class="warn">Δ &lt; 0 não quer dizer "erro": a função existe, só que o gráfico nunca toca o eixo x (é sempre positiva ou sempre negativa).</div>`},
 {t:'Equações incompletas (sem fórmula!)',h:`<div class="box"><b>Sem c: ax² + bx = 0</b><p>Põe x em evidência: x(ax + b) = 0 ⇔ x = 0 ∨ x = −b/a</p></div><div class="box"><b>Sem b: ax² + c = 0</b><p>⇔ x² = −c/a → x = ±√(−c/a) (se −c/a ≥ 0)</p></div><div class="box"><b>Já fatorizada</b><p>Lei do anulamento do produto: A·B = 0 ⇔ A = 0 ∨ B = 0</p></div>`},
 {t:'Inequações do 2.º grau em 4 passos',h:`<p class="note">Ex.: x² − x − 6 ≤ 0</p><ol class="num"><li>Passar tudo para um lado (do outro fica 0).</li><li>Achar os zeros: Δ = 1 + 24 = 25 → x = (1 ± 5)/2 → −2 e 3.</li><li>Esboçar a parábola: a = 1 &gt; 0 → ∪.</li><li>Ler onde está abaixo (≤ 0) ou acima (≥ 0) do eixo.</li></ol><div class="fig">${PL({r:[-4,5,-7,7],h:200,ty:2,c:[{f:x=>x*x-x-6}],seg:[[-2,3,'#2f7d5b']],pt:[[-2,0,0,'−2',-14,-6],[3,0,0,'3',4,-6]],lab:[[0.5,-4.5,'≤ 0 aqui','middle']]})}</div><p><b>≤ 0</b> → x ∈ [−2, 3] ("entre os zeros")<br><b>&gt; 0</b> → x ∈ ]−∞, −2[ ∪ ]3, +∞[ ("fora")</p><div class="warn">Com ≤ ou ≥ os zeros entram (parêntese reto [ ] virado para dentro); com &lt; ou &gt; ficam de fora.</div>`},
],
5:[
 {t:'A regra de ouro',h:`<div class="warn"><b>Mexer fora de f</b> → afeta o y (vertical, faz o que parece).<br><b>Mexer dentro</b> → afeta o x (horizontal, faz o contrário).</div><p class="note">Nos gráficos seguintes: tracejado = gráfico original de f · cheio = gráfico transformado.</p>`},
 {t:'Translações',h:`${(()=>{const f=x=>0.5*(x-0)*(x-0)-1.5;return `<div class="two"><div><b>f(x) + 1 · translação vertical</b>${PL({r:[-3,3,-3,3],h:140,ticks:false,c:[{f,dash:1,col:'var(--muted)'},{f:x=>f(x)+1,col:'#3b82d6'}]})}Sobe 1. Se fosse −1, descia.<br>Ponto: (x, y) → (x, y + 1)</div><div><b>f(x + 2) · translação horizontal</b>${PL({r:[-4,3,-3,3],h:140,ticks:false,c:[{f,dash:1,col:'var(--muted)'},{f:x=>f(x+2),col:'#3b82d6'}]})}Anda 2 para a <strong>esquerda</strong>! O sinal é o contrário do que parece.<br>Ponto: (x, y) → (x − 2, y)</div></div>`})()}`},
 {t:'Dilatação e contração',h:`${(()=>{const f=x=>Math.sin(x*1.2)*1.2;return `<div class="two"><div><b>2 · f(x) · dilatação vertical</b>${PL({r:[-3,3,-3,3],h:140,ticks:false,c:[{f,dash:1,col:'var(--muted)'},{f:x=>2*f(x),col:'#3b82d6'}]})}Estica na vertical. Com 0 &lt; a &lt; 1 encolhe. Os zeros não mudam.<br>Ponto: (x, y) → (x, 2y)</div><div><b>f(2x) · contração horizontal</b>${PL({r:[-3,3,-3,3],h:140,ticks:false,c:[{f,dash:1,col:'var(--muted)'},{f:x=>f(2*x),col:'#3b82d6'}]})}Aperta na horizontal (divide os x por 2). A ordenada na origem não muda.<br>Ponto: (x, y) → (x/2, y)</div></div>`})()}`},
 {t:'Reflexões',h:`${(()=>{const f=x=>0.4*x*x*x/2+0.5*x+0.6;return `<div class="two"><div><b>−f(x) · reflexão no eixo x</b>${PL({r:[-3,3,-3,3],h:140,ticks:false,c:[{f,dash:1,col:'var(--muted)'},{f:x=>-f(x),col:'#3b82d6'}]})}Vira de cima para baixo (é o caso a = −1).<br>Ponto: (x, y) → (x, −y)</div><div><b>f(−x) · reflexão no eixo y</b>${PL({r:[-3,3,-3,3],h:140,ticks:false,c:[{f,dash:1,col:'var(--muted)'},{f:x=>f(-x),col:'#3b82d6'}]})}Espelha esquerda ↔ direita (é o caso b = −1).<br>Ponto: (x, y) → (−x, y)</div></div>`})()}`},
 {t:'Tudo junto: a forma canónica',h:`<p><b>y = a(x − h)² + k</b> parte de y = x² e:</p><ul class="dots"><li><b>a:</b> estica/encolhe e, se negativo, vira ao contrário;</li><li><b>h:</b> anda h na horizontal (repara no menos: (x − 1) → direita 1);</li><li><b>k:</b> sobe ou desce k.</li></ul><div class="fig">${PL({r:[-3,4,-4,5],h:200,c:[{f:x=>x*x,dash:1,col:'var(--muted)'},{f:x=>2*(x-1)*(x-1)-3,col:'#3b82d6'}],pt:[[1,-3,0,'V(1, −3)',6,4]],lab:[[-2.9,4.4,'y = x²']]})}</div><p>Ex.: 2(x − 1)² − 3: o vértice passa de (0, 0) para (1, −3), e a parábola fica mais "fechada".</p><div class="formula">Ordem segura: primeiro esticar/refletir, depois transladar.</div>`},
],
6:[
 {t:'Funções definidas por ramos',h:`<p>Uma expressão diferente para cada parte do domínio.</p><div class="formula" style="text-align:left">f(x) = { x + 3 &nbsp;se x &lt; −1<br><span style="padding-left:46px">x² &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;se x ≥ −1</span></div><div class="fig">${PL({r:[-4,3,-2,5],h:200,c:[{f:x=>x+3,d:[-4,-1]},{f:x=>x*x,d:[-1,2.3]}],pt:[[-1,2,1,'não pertence',-58,-6],[-1,1,0,'pertence',6,10]]})}</div><ul class="dots"><li>Para calcular f(a): ver em que ramo cai a. <b>f(−1) = (−1)² = 1</b></li><li>● bola cheia: o ponto pertence · ○ bola vazia: não pertence.</li><li><b>Zeros:</b> resolver em cada ramo e confirmar se a solução está nesse ramo.</li></ul>`},
 {t:'Função módulo',h:`<p><b>|x| = distância de x a 0.</b> Nunca é negativa.</p><div class="formula" style="text-align:left">|x| = { x &nbsp;&nbsp;se x ≥ 0<br><span style="padding-left:34px">−x se x &lt; 0</span></div><div class="fig">${PL({r:[-3,5,-1,3.5],h:170,c:[{f:Math.abs},{f:x=>Math.abs(x-2),col:'#3b82d6'}],lab:[[-2.9,3.1,'y = |x|'],[3.2,2.6,'y = |x − 2|']]})}</div><p>Gráfico em V, vértice na origem; D′ = [0, +∞[.</p><p>|x − 2| = distância de x a 2: o V anda 2 para a direita.</p><p class="note">|5| = 5 · |−5| = 5 · |0| = 0</p>`},
 {t:'Equações e inequações com módulo',h:`<p class="note">Para k &gt; 0 (ex.: k = 3):</p><table class="st"><tr><td><b>|x| = 3</b></td><td>x = 3 ∨ x = −3</td></tr><tr><td><b>|x| &lt; 3</b> → "entre"</td><td>−3 &lt; x &lt; 3</td></tr><tr><td><b>|x| &gt; 3</b> → "fora"</td><td>x &lt; −3 ∨ x &gt; 3</td></tr><tr><td><b>|x| = 0</b></td><td>⇔ x = 0</td></tr><tr><td><b>|x| = −2</b></td><td>impossível</td></tr></table><div class="box"><b>Funciona igual com expressões</b><p>|x − 2| &lt; 3 ⇔ −3 &lt; x − 2 &lt; 3 ⇔ −1 &lt; x &lt; 5</p></div>`},
 {t:'Os 6 erros que mais custam pontos',h:`<ol class="num"><li>f(x + 2) anda para a <b>esquerda</b>, não para a direita.</li><li>Contradomínio ≠ conjunto de chegada.</li><li>Máximo é um <b>y</b>; maximizante é um <b>x</b>.</li><li>(x − 3)² tem vértice em x = 3, não em −3.</li><li>Esquecer de passar tudo para um lado antes de resolver uma inequação.</li><li>Nos ramos: esquecer de ver se a solução pertence ao ramo.</li></ol><p class="note">Pode também aparecer, conforme a escola e o professor: paridade (funções pares e ímpares), polinómios (divisão, regra de Ruffini) e taxa média de variação. Confirma no manual.</p>`},

function blank(){return {history:[],wrong:[],saved:[],sub:{},seen:{},rec:{},time:{},tday:null,size:20,updated:0}}

const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const idsOf=k=>QS.map((q,i)=>q[0]===k?i:-1).filter(i=>i>=0);

function stratified(ids,n){const g={};shuffle(ids).forEach(i=>{const k=QS[i][1];(g[k]=g[k]||[]).push(i)});
 const keys=shuffle(Object.keys(g)),out=[];let r=0;
 while(out.length<n&&keys.some(k=>g[k].length>r)){keys.forEach(k=>{if(out.length<n&&g[k][r]!==undefined)out.push(g[k][r])});r++}
 return shuffle(out)}
function fresh(ids,n){const un=ids.filter(i=>!S.seen[i]);if(un.length>=n)return stratified(un,n);return shuffle(un.concat(stratified(ids.filter(i=>S.seen[i]),n-un.length)))}
function cover(k){const ids=idsOf(k);const s=ids.filter(i=>S.seen[i]).length;return {s,n:ids.length,p:ids.length?Math.round(s/ids.length*100):0}}
function build(t){
 if(t.startsWith('unit:')){const ks=T_().units[+t.split(':')[2]].keys,n=size();let o=[];ks.forEach((k,j)=>{const per=Math.floor(n/ks.length)+(j<n%ks.length?1:0);o=o.concat(fresh(idsOf(k),per))});return shuffle(o)}
 if(t.startsWith('sub:')){const key=t.slice(4);return fresh(QS.map((q,i)=>(q[0]+':'+q[1])===key?i:-1).filter(i=>i>=0),size())}
 if(t===SAV())return shuffle(S.saved.filter(inCur)).slice(0,size());
 if(t===ERR())return shuffle(S.wrong.filter(inCur)).slice(0,size());
 if(t===ALL()){const ks=T_().mix||T_().keys,n=size();let o=[];ks.forEach((k,j)=>{const per=Math.floor(n/ks.length)+(j<n%ks.length?1:0);o=o.concat(fresh(idsOf(k),per))});return shuffle(o)}
 return fresh(idsOf(t),size())}
function tname(t){if(t.startsWith('unit:'))return T_().units[+t.split(':')[2]].n;if(t.startsWith('sub:'))return SUBN[t.slice(4)]||'Treino';if(t.startsWith('all:'))return 'Mistura (como no teste)';if(t.startsWith('err:'))return 'Os meus erros';if(t.startsWith('sav:'))return 'Guardadas';return TOPICS[t].n}

function daysTo(d){if(!d)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(d+'T00:00:00')-t)/864e5)}
function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString('pt-PT',{day:'numeric',month:'long'})}
function cdBox(T){const n=daysTo(T.when);if(n===null||n<0)return '';
 const txt=n===0?'O teste é hoje.':n===1?'O teste é amanhã.':`Faltam ${n} dias para o teste (${fmtDate(T.when)}).`;
 return `<div class="cd ${n<=2?'hot':''}"><b>${n}</b><span>${txt}</span></div>`}
function tagFor(k){const L=Object.entries(TESTS).filter(([,T])=>T.subj===k);if(!L.length)return 'Em breve';
 const up=L.map(([,T])=>daysTo(T.when)).filter(n=>n!==null&&n>=0).sort((a,b)=>a-b);
 if(up.length)return up[0]===0?'Teste hoje':up[0]===1?'Teste amanhã':`Teste daqui a ${up[0]} dias`;
 return L.some(([,T])=>!T.when&&T.keys.length)?'Teste com data por definir':L.some(([,T])=>!T.keys.length)?'Para estudar':''}

let lastAct=0;
function tick(){const now=Date.now();if(view.name==='quiz'&&lastAct&&cur){const d=Math.min((now-lastAct)/1000,120);S.time[cur]=(S.time[cur]||0)+d;
 const day=new Date().toISOString().slice(0,10);if(!S.tday||S.tday.d!==day)S.tday={d:day};S.tday[cur]=(S.tday[cur]||0)+d}lastAct=now}
function fmtT(s){s=Math.round(s/60);if(s<1)return 'menos de 1 min';const h=Math.floor(s/60),m=s%60;return h?`${h} h ${m} min`:`${m} min`}
function recAdd(k,good){const r=S.rec[k]=S.rec[k]||[];r.push(good?1:0);if(r.length>20)r.shift()}
function prep(){const ks=T_().mix||T_().keys;let tot=0,weak=null,ws=2;ks.forEach(k=>{const cv=cover(k).p/100;const r=S.rec[k]||[];const acc=r.length?r.reduce((a,b)=>a+b,0)/r.length:0;const conf=Math.min(r.length/10,1);const sc=0.4*cv+0.6*acc*conf;tot+=sc;if(sc<ws){ws=sc;weak=TOPICS[k].n}});return {p:Math.round(tot/ks.length*100),weak}}
function stats(t){const h=S.history.filter(x=>x.t===t);if(!h.length)return null;const p=h.map(x=>Math.round(x.c/x.n*100));return {n:h.length,last:p[p.length-1],best:Math.max(...p),avg:Math.round(p.reduce((a,b)=>a+b,0)/p.length),prev:p.length>1?p[p.length-2]:null}}

function cParse(str){let i=0;const s=str.replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'.').replace(/−/g,'-');
 const peek=()=>s[i],num=()=>{let j=i;while(i<s.length&&/[0-9.]/.test(s[i]))i++;if(j===i)throw 0;return parseFloat(s.slice(j,i))};
 function fac(){if(peek()==='-'){i++;return -fac()}if(peek()==='('){i++;const v=expr();if(s[i]!==')')throw 0;i++;return pct(v)}return pct(num())}
 function pct(v){if(s[i]==='%'){i++;return v/100}return v}
 function term(){let v=fac();while(peek()==='*'||peek()==='/'){const o=s[i++];const r=fac();v=o==='*'?v*r:v/r}return v}
 function expr(){let v=term();while(peek()==='+'||peek()==='-'){const o=s[i++];const r=term();v=o==='+'?v+r:v-r}return v}
 const v=expr();if(i!==s.length||!isFinite(v))throw 0;return v}
function cFmt(v){return Number(v.toFixed(6)).toLocaleString('pt-PT',{maximumFractionDigits:6})}
function cKey(k){if(k==='C'){calc.ex='';calc.rs=''}else if(k==='⌫'){calc.ex=calc.ex.slice(0,-1)}
 else if(k==='='){try{calc.rs=cFmt(cParse(calc.ex))}catch(e){calc.rs='Erro'}}
 else{if(calc.rs&&calc.rs!=='Erro'&&/[+−×÷%]/.test(k)&&calc.ex&&calc.lastEq){calc.ex=calc.rs.replace(/\s/g,'')}if(calc.lastEq&&/[0-9,(]/.test(k)){calc.ex='';}calc.ex+=k;calc.rs=''}
 calc.lastEq=k==='=';const d=$('#calc');if(d)d.outerHTML=calcHTML()}
function calcHTML(){const K=['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','0',',','⌫','='];
 return `<div class="calc" id="calc"><div class="disp"><div class="ex">${esc(calc.ex)||'&nbsp;'}</div><div class="rs">${calc.rs||'&nbsp;'}</div></div>
 <div class="keys4">${K.map(k=>`<button class="${'÷×−+'.includes(k)?'op':k==='='?'eq':''}" onclick="cKey('${k}')">${k}</button>`).join('')}</div></div>`}

  return `<div class="trow" style="--c:${P.c}"><span class="nm">${P.n}</span><span class="v">${p}% (${n})${tr}</span><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('');
 const weak=Object.entries(S.sub).filter(([k,v])=>v[1]>=3&&SUBN[k]&&T.keys.includes(k.split(':')[0])).map(([k,v])=>[k,Math.round(v[0]/v[1]*100)]).filter(x=>x[1]<80).sort((a,b)=>a[1]-b[1]).slice(0,5);
 const f5=pcts.slice(0,5),l5=pcts.slice(-5),evo=pcts.length>=6?Math.round(l5.reduce((a,b)=>a+b,0)/l5.length-f5.reduce((a,b)=>a+b,0)/f5.length):null;
 return `${header("go('test')",'Evolução')}
 <div class="card"><div class="kpis"><div class="kpi"><b>${H.length}</b><span>rondas</span></div><div class="kpi"><b>${avg}%</b><span>média</span></div><div class="kpi"><b>${fmtT(S.time[cur]||0).replace('menos de 1 min','<1 min')}</b><span>estudo</span></div></div>
 <p class="small muted">${evo!==null?`Últimas 5 rondas vs. primeiras 5: <b style="color:var(--ink)">${evo>0?'+':''}${evo} pontos percentuais</b>.`:'Com 6 ou mais rondas aparece a comparação entre as primeiras e as últimas.'}</p></div>
 <div class="card chart"><h3>Acertos nas últimas ${last.length} rondas</h3>${chart}</div>
 <div class="card"><h3>Por matéria</h3>${rows}</div>
 <div class="card"><h3>Pontos fracos</h3>${weak.length?`<p class="muted small">Abaixo de 80% (com pelo menos 3 respostas). Toca para treinar só isso.</p>${weak.map(([k,p])=>`<button class="wk" onclick="start('sub:${k}')"><span>${esc(SUBN[k])}</span><span>${p}% · treinar</span></button>`).join('')}`:'<p class="muted small">Nada abaixo de 80% (com pelo menos 3 respostas).</p>'}</div>`}

render();
</script>
</body>
</html>
