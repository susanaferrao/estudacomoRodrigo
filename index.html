<style>
/* Sóbrio, uma coluna, pensado para telemóvel. Tema claro e escuro. */
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#18202e; --muted:#5d6676; --line:#e1e4ea; --soft:#eef1f5;
  --accent:#1d2b44; --accent-ink:#ffffff; --accent-soft:#e6ebf3;
  --ok:#1b7f4b; --ok-soft:#e5f3eb; --bad:#c0392b; --bad-soft:#fbeae8;
  --font:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --card:#171e29; --ink:#e7eaf0; --muted:#98a1b1; --line:#283244; --soft:#1e2734;
  --accent:#8fb0e8; --accent-ink:#0f141c; --accent-soft:#1f2b3e;
  --ok:#4cc38a; --ok-soft:#14291f; --bad:#ef7a6c; --bad-soft:#31191a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto;padding-block:max(16px,env(safe-area-inset-top,0px)) 48px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;font-weight:700}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{cursor:default}
.muted{color:var(--muted)} .small{font-size:13px}
.top{display:flex;align-items:center;gap:12px;min-height:40px}
.top h2{min-width:0;flex:1}
.back{width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:20px;display:grid;place-items:center;flex:none;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hello h1{font-size:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subj{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:104px}
.subj .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.subj h3{font-size:15px}
.subj .tag{font-size:12px;color:var(--muted)}
.subj.off{opacity:.5}
.subj.on:hover{border-color:var(--muted)}
.testcard{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:4px}
.testcard .t{font-size:19px;font-weight:700}
.testcard .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.cd{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600}
.cd b{min-width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:18px;font-variant-numeric:tabular-nums}
.cd.hot{border-color:var(--bad)} .cd.hot b{background:var(--bad);color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.topic{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:12px 14px;width:100%}
.topic>div{flex:1;min-width:0}
.topic .n{font-weight:600}
.topic .s{font-size:13px;color:var(--muted)}
.topic .best{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.35}
.topic .best b{color:var(--ink);font-size:14px}
.cov{display:flex;align-items:center;gap:8px;margin-top:6px}
.cov span{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:10px;padding:3px}
.seg button{min-width:48px;padding:6px 10px;border-radius:8px;font-weight:600;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pill2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill2 button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600;text-align:center}
.pill2 button span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.pill2 button:disabled{opacity:.45}
.prep .pp{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.prep .bar{height:8px}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.bm{width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none}
.bm.on{color:var(--accent);border-color:var(--accent)}
.qchip{align-self:flex-start;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.qtext{font-size:19px;font-weight:600;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:500;display:flex;gap:12px;align-items:center;width:100%}
.opt .l{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;color:var(--muted)}
.opt:not(:disabled):hover{border-color:var(--muted)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)} .opt.right .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)} .opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;border:1.5px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)} .fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb h3{font-size:16px} .fb.ok h3{color:var(--ok)} .fb.no h3{color:var(--bad)}
.big{width:100%;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px;font-weight:700;font-size:17px;text-align:center}
.ghost{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;font-weight:600;text-align:center}
.keys{font-size:12px;color:var(--muted);text-align:center}
@media (hover:none){.keys{display:none}}
/* resultado / evolução */
.score{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--soft);border-radius:10px;padding:10px;text-align:center}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.trow .bar{grid-column:1/-1;height:8px}
.trow .nm{font-weight:600;font-size:14px;min-width:0}
.trow .v{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wk{display:flex;justify-content:space-between;gap:8px;background:var(--bad-soft);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500;width:100%}
.wk span:last-child{white-space:nowrap;color:var(--bad);font-weight:600}
.err{border-top:1px solid var(--line);padding-top:10px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.err:first-of-type{border-top:0;padding-top:0}
.err .a{color:var(--ok);font-weight:600}
.chart svg{width:100%;height:auto;display:block}
.empty{text-align:center;color:var(--muted)}
</style>
</head>

<script>
// Português — 1.º teste (10.º ano). Fonte: matriz do teste (poesia trovadoresca / cantiga de amigo; processos fonológicos) e ficha informativa 2 do manual.
// [tópico, subtópico, pergunta, resposta certa, [erradas], explicação]
const QS_PT = [
// ---------- P1 · A LÍRICA TROVADORESCA (contexto) ----------
['p1','epoca','A poesia trovadoresca galego-portuguesa desenvolveu-se aproximadamente entre…','finais do século XII e meados do século XIV',['o século X e o século XI','o século XV e o século XVI','meados do século XIV e o século XV'],'Período trovadoresco: de finais do séc. XII a meados do séc. XIV.'],
['p1','epoca','As cantigas trovadorescas foram escritas em…','galego-português',['latim','português moderno','provençal'],'A língua comum da Galiza e do norte de Portugal na época: o galego-português.'],
['p1','epoca','A lírica trovadoresca tem uma forte influência da poesia…','provençal (sul de França)',['italiana do Renascimento','castelhana do século XVI','árabe do Oriente'],'Os trovadores provençais influenciaram a poesia da Península; as peregrinações a Santiago e as cortes ajudaram a difundi-la.'],
['p1','epoca','Um dos caminhos por onde a poesia provençal chegou à Península Ibérica foi…','as peregrinações a Santiago de Compostela',['as viagens marítimas para a Índia','a imprensa','as universidades do século XVI'],'Peregrinos, jograis e nobres circulavam pelo Caminho de Santiago e levavam a poesia de corte em corte.'],
['p1','epoca','Um rei português que foi também trovador é…','D. Dinis',['D. Afonso Henriques','D. Manuel I','D. João II'],'D. Dinis (séc. XIII–XIV) é um dos trovadores mais importantes, com cantigas de amor e de amigo.'],
['p1','canc','As cantigas chegaram até nós sobretudo através de…','cancioneiros (coletâneas manuscritas)',['livros impressos da época','gravações orais','crónicas dos reis'],'Os cancioneiros reuniram as cantigas: Cancioneiro da Ajuda, da Biblioteca Nacional e da Vaticana.'],
['p1','canc','Qual destes NÃO é um cancioneiro da lírica galego-portuguesa?','Cancioneiro Geral',['Cancioneiro da Ajuda','Cancioneiro da Vaticana','Cancioneiro da Biblioteca Nacional'],'O Cancioneiro Geral (Garcia de Resende, 1516) é posterior e não pertence à lírica trovadoresca.'],
['p1','canc','O Cancioneiro da Ajuda reúne quase só…','cantigas de amor',['cantigas de amigo','cantigas de escárnio','romances'],'O da Ajuda tem sobretudo cantigas de amor; as cantigas de amigo estão nos da Vaticana e da Biblioteca Nacional.'],
['p1','canc','Os Cancioneiros da Vaticana e da Biblioteca Nacional são…','cópias feitas em Itália no século XVI',['originais escritos pelos trovadores','livros impressos em Lisboa','cópias feitas no século XX'],'Ambos foram copiados em Itália no séc. XVI e preservam cantigas de amigo, de amor e satíricas.'],
['p1','autores','Na época, as cantigas eram feitas para ser…','cantadas, com acompanhamento musical',['lidas em silêncio','apenas escritas em cancioneiros','declamadas sem música'],'Cantiga = texto para cantar. Poesia e música eram inseparáveis.'],
['p1','autores','O trovador era, geralmente…','um nobre que compunha cantigas',['um músico pago que só tocava instrumentos','um monge copista','um camponês que cantava nas feiras'],'Trovador: autor de condição nobre, que compunha letra e música.'],
['p1','autores','O jogral era…','um intérprete de condição social inferior, que cantava e tocava (e por vezes compunha)',['um nobre que só compunha','o rei que protegia os trovadores','o copista dos cancioneiros'],'Jogral: executante, de origem popular, que atuava a troco de pagamento.'],
['p1','autores','Os géneros da poesia trovadoresca são…','lírica (cantigas de amor e de amigo) e satírica (escárnio e maldizer)',['épica e dramática','apenas cantigas de amigo','sonetos e éclogas'],'Lírica: amor e amigo. Satírica: escárnio e maldizer.'],
['p1','autores','A cantiga de amigo tem origem…','numa tradição peninsular antiga (autóctone) de canções em voz feminina',['exclusivamente na poesia provençal','na poesia latina clássica','nos romances do século XVI'],'A cantiga de amor segue o modelo provençal; a de amigo vem de uma tradição peninsular mais antiga.'],
['p1','autores','Quem escrevia as cantigas de amigo?','trovadores (homens) que davam voz a uma donzela',['mulheres da corte','apenas jograis anónimos','monges'],'O autor é um homem, mas o sujeito poético é feminino.'],
['p1','amor','Na cantiga de AMOR, o sujeito poético é…','um homem que se dirige à "senhor"',['uma donzela que fala do amigo','a mãe da donzela','a natureza personificada'],'Cantiga de amor: voz masculina, dirige-se à "mia senhor" — é o contrário da cantiga de amigo.'],
['p1','amor','O ambiente típico da cantiga de amor é…','cortês, aristocrático',['rural e popular','marítimo','religioso'],'Amor: ambiente da corte. Amigo: ambiente rural/natural, mais popular.'],
['p1','amor','Na cantiga de amor, a "coita" é…','o sofrimento amoroso',['a alegria do encontro','a dança','o nome da amada'],'Coita = sofrimento por amor. Também aparece na cantiga de amigo, causada pela ausência do amigo.'],

// ---------- P2 · A CANTIGA DE AMIGO ----------
['p2','suj','Na cantiga de amigo, o sujeito poético é…','uma donzela',['um cavaleiro','um trovador que fala de si','um rei'],'Voz feminina: a donzela (jovem apaixonada) fala do seu "amigo".'],
['p2','suj','Na cantiga de amigo, a palavra "amigo" significa…','namorado, amado',['colega','irmão','senhor feudal'],'"Amigo" = namorado. Variantes nas cantigas: "amado", "meu amigo".'],
['p2','suj','A quem se pode dirigir a donzela nas cantigas de amigo?','à mãe, às amigas, à irmã, ao amigo ou a elementos da natureza',['apenas ao rei','apenas a Deus','apenas à "senhor"'],'Interlocutores frequentes: mãe, amigas, irmã, o amigo, e a natureza (ondas, flores, aves…).'],
['p2','suj','O interlocutor é…','a entidade a quem o sujeito poético se dirige',['o autor da cantiga','o jogral que a canta','o título da cantiga'],'Sujeito poético = quem fala; interlocutor = a quem fala.'],
['p2','suj','Quando a donzela fala com as ondas ou as flores, estes elementos funcionam como…','confidentes',['obstáculos','inimigos','narradores'],'A natureza personificada é confidente: ouve os desabafos e às vezes responde.'],
['p2','suj','Ao falar com as ondas como se fossem pessoas, a donzela recorre à…','personificação (e à apóstrofe)',['hipérbole','comparação','ironia'],'Personificação: atribuir características humanas a seres não humanos. Apóstrofe: interpelar diretamente.'],
['p2','suj','A apóstrofe é…','a interpelação direta de alguém ou de algo',['a repetição de palavras no início dos versos','um exagero','uma comparação com "como"'],'Ex.: "Ondas do mar de Vigo, / se vistes meu amigo?" — a donzela chama as ondas.'],
['p2','sent','O tema mais frequente nas cantigas de amigo é…','a ausência do amigo e a saudade',['a guerra entre reinos','a crítica a pessoas da corte','o elogio da senhor'],'Temas: ausência, saudade, espera, ansiedade, alegria do encontro, ciúme, zanga.'],
['p2','sent','Qual destes sentimentos é típico da donzela na cantiga de amigo?','saudade e ansiedade pela espera',['desprezo pelo amigo','indiferença','ódio à natureza'],'A donzela sofre com a ausência (coita), espera, receia que ele não volte.'],
['p2','sent','A "coita" da donzela é causada, normalmente, por…','a ausência ou o afastamento do amigo',['a pobreza','a doença do rei','uma guerra perdida'],'O amigo partiu (para o mar, para o fossado, para longe) e ela sofre.'],
['p2','sent','Para além da tristeza, a cantiga de amigo pode exprimir…','alegria, por exemplo pela notícia do regresso do amigo',['apenas raiva','apenas medo da morte','apenas devoção religiosa'],'Há cantigas alegres: a donzela feliz porque o amigo volta ou porque vai ao seu encontro.'],
['p2','esp','O espaço típico das cantigas de amigo é…','natural e campestre (fontes, rios, mar, campos)',['o palácio','a cidade grande','a igreja apenas'],'Ambiente rural, ao ar livre: fonte, rio, mar, campos, ermidas.'],
['p2','esp','A linguagem das cantigas de amigo é…','simples, com muitas repetições',['erudita e cheia de latinismos','muito complexa e difícil','técnica'],'Linguagem simples, popular, com repetições — fácil de memorizar e de cantar.'],
['p2','esp','As cantigas de amigo são, em geral…','curtas, com estrofes de dois ou três versos e refrão',['longas, com centenas de versos','escritas em prosa','sonetos de 14 versos'],'Estrofes breves (dísticos, muitas vezes) + refrão.'],
['p2','doc','Dizer que uma cantiga tem "valor documental" significa que…','dá informação sobre a vida e os costumes da época',['é um documento oficial do rei','foi escrita num papel especial','conta factos inventados'],'As cantigas mostram costumes, espaços, festas, trabalhos e a condição da mulher na Idade Média.'],
['p2','doc','As cantigas de romaria documentam…','as festas e peregrinações a santuários',['as batalhas navais','as leis do reino','a vida nos mosteiros'],'Romarias eram ocasiões de convívio e de encontro entre namorados.'],
['p2','doc','As cantigas em que o amigo partiu para o "fossado" mostram…','que os homens partiam em expedições militares ao serviço do rei',['que os homens iam estudar para a universidade','que as mulheres iam à guerra','que havia muitas viagens de lazer'],'Fossado = expedição militar. A cantiga documenta a vida das mulheres que ficavam à espera.'],
['p2','doc','A referência a lugares reais (Vigo, San Simón, Lisboa) contribui para…','o valor documental da cantiga',['a rima da cantiga','o refrão','a sátira'],'Lugares concretos ligam a cantiga à realidade geográfica e social da época.'],
['p2','doc','As cantigas de amigo mostram a mulher medieval muitas vezes…','dependente da autorização da mãe e à espera do amigo',['a governar o reino','a partir para a guerra','a viajar sozinha pelo mundo'],'A mãe aparece como figura de autoridade que autoriza ou proíbe o encontro.'],
['p2','tipos','Uma cantiga de amigo passada junto ao mar chama-se…','barcarola ou marinha',['bailia','alba','pastorela'],'Barcarola/marinha: o mar e as ondas como cenário e confidentes.'],
['p2','tipos','Uma cantiga de amigo em que as donzelas dançam chama-se…','bailia',['barcarola','alba','cantiga de romaria'],'Bailia ou bailada: convite à dança.'],
['p2','tipos','Uma cantiga de amigo passada ao amanhecer chama-se…','alba ou alvorada',['bailia','barcarola','cantiga de romaria'],'Alba/alvorada: o raiar do dia, muitas vezes a separação dos namorados.'],
['p2','tipos','Uma cantiga de amigo em que a donzela vai a um santuário chama-se…','cantiga de romaria',['barcarola','alba','bailia'],'Romaria: ida a uma igreja/ermida em festa, ocasião para ver o amigo.'],
['p2','tipos','"Bailemos nós ja todas tres, ai amigas" é o início de uma…','bailia',['barcarola','alba','cantiga de amor'],'O convite à dança ("bailemos") identifica a bailia.'],

// ---------- P3 · PARALELISMO, REFRÃO E PROGRESSÃO ----------
['p3','par','O paralelismo consiste em…','repetir ideias e versos de estrofe para estrofe, com pequenas variações',['usar rimas diferentes em cada estrofe','contar uma história longa','evitar repetições'],'Paralelismo: estrofes aos pares que dizem quase o mesmo, mudando poucas palavras.'],
['p3','par','No paralelismo, as estrofes organizam-se muitas vezes…','aos pares, a segunda repetindo a primeira com outra palavra final',['de forma totalmente diferente','em quadras soltas','sem qualquer relação'],'Ex.: "amigo" / "amado"; "Vigo" / "levado".'],
['p3','par','Em "se vistes meu amigo?" / "se vistes meu amado?", a troca de "amigo" por "amado" é um exemplo de…','paralelismo',['leixa-pren','refrão','hipérbole'],'Mesma frase, palavra final diferente (sinónima) — paralelismo.'],
['p3','par','O leixa-pren ("deixa-prende") consiste em…','retomar o 2.º verso de uma estrofe como 1.º verso de uma estrofe seguinte',['repetir o refrão no início','acabar todas as estrofes com a mesma rima','mudar de interlocutor'],'O verso "deixado" numa estrofe é "prendido" mais à frente.'],

['p5','ins','A prótese é…','a inserção de um som no início da palavra',['a inserção de um som no final','a queda de um som no início','a troca de posição de sons'],'Prótese: + início. Ex.: scutu- > escudo.'],

['p5','ins','A paragoge é…','a inserção de um som no final da palavra',['a queda de um som no final','a inserção de um som no início','a troca de sílabas'],'Paragoge: + final. Ex.: ante > antes.'],
['p5','sup','A aférese é…','a supressão de um som no início da palavra',['a supressão no final','a inserção no início','a supressão no interior'],'Aférese: − início. Ex.: attonitu- > tonto.'],
['p5','sup','A síncope é…','a supressão de um som no interior da palavra',['a supressão no início','a supressão no final','a inserção no interior'],'Síncope: − interior. Ex.: legale- > leal.'],
['p5','sup','A apócope é…','a supressão de um som no final da palavra',['a supressão no interior','a inserção no final','a supressão no início'],'Apócope: − final. Ex.: male- > mal.'],
['p5','alt','A metátese é…','a deslocação de sons ou sílabas dentro da palavra',['a perda de um som','a fusão de duas vogais','a passagem de surda a sonora'],'Metátese: muda de lugar. Ex.: feria- > feira.'],
['p5','alt','A assimilação é…','a mudança de um som por influência de outro próximo, tornando-o igual ou semelhante',['a passagem de dois sons iguais a diferentes','a passagem de consoante a vogal','a queda de um som'],'Assimilação: aproxima. Ex.: persona- > pessoa (rs > ss).'],

let S=load(), cur=null, quiz=null, view={name:'home'}, subjCur=null;
function blank(){return {history:[],wrong:[],saved:[],sub:{},seen:{},rec:{},time:{},tday:null,size:20,updated:0}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(blank(),JSON.parse(r))}catch(e){}return blank()}

const T_=()=>TESTS[cur];
const ALL=()=>'all:'+cur, ERR=()=>'err:'+cur, SAV=()=>'sav:'+cur;

const size=()=>[10,20,30].includes(S.size)?S.size:20;

const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const idsOf=k=>QS.map((q,i)=>q[0]===k?i:-1).filter(i=>i>=0);

function stratified(ids,n){const g={};shuffle(ids).forEach(i=>{const k=QS[i][1];(g[k]=g[k]||[]).push(i)});
 const keys=shuffle(Object.keys(g)),out=[];let r=0;
 while(out.length<n&&keys.some(k=>g[k].length>r)){keys.forEach(k=>{if(out.length<n&&g[k][r]!==undefined)out.push(g[k][r])});r++}
 return shuffle(out)}
function fresh(ids,n){const un=ids.filter(i=>!S.seen[i]);if(un.length>=n)return stratified(un,n);return shuffle(un.concat(stratified(ids.filter(i=>S.seen[i]),n-un.length)))}
function cover(k){const ids=idsOf(k);const s=ids.filter(i=>S.seen[i]).length;return {s,n:ids.length,p:ids.length?Math.round(s/ids.length*100):0}}
function build(t){
 if(t.startsWith('sub:')){const key=t.slice(4);return fresh(QS.map((q,i)=>(q[0]+':'+q[1])===key?i:-1).filter(i=>i>=0),size())}
 if(t===SAV())return shuffle(S.saved.filter(inCur)).slice(0,size());
 if(t===ERR())return shuffle(S.wrong.filter(inCur)).slice(0,size());
 if(t===ALL()){const ks=T_().keys,n=size();let o=[];ks.forEach((k,j)=>{const per=Math.floor(n/ks.length)+(j<n%ks.length?1:0);o=o.concat(fresh(idsOf(k),per))});return shuffle(o)}
 return fresh(idsOf(t),size())}
function tname(t){if(t.startsWith('sub:'))return SUBN[t.slice(4)]||'Treino';if(t.startsWith('all:'))return 'Mistura (como no teste)';if(t.startsWith('err:'))return 'Os meus erros';if(t.startsWith('sav:'))return 'Guardadas';return TOPICS[t].n}

function daysTo(d){if(!d)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(d+'T00:00:00')-t)/864e5)}
function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString('pt-PT',{day:'numeric',month:'long'})}
function cdBox(T){const n=daysTo(T.when);if(n===null||n<0)return '';
 const txt=n===0?'O teste é hoje.':n===1?'O teste é amanhã.':`Faltam ${n} dias para o teste (${fmtDate(T.when)}).`;
 return `<div class="cd ${n<=2?'hot':''}"><b>${n}</b><span>${txt}</span></div>`}
function tagFor(k){const L=Object.entries(TESTS).filter(([,T])=>T.subj===k);if(!L.length)return 'Em breve';
 const up=L.map(([,T])=>daysTo(T.when)).filter(n=>n!==null&&n>=0).sort((a,b)=>a-b);
 if(up.length)return up[0]===0?'Teste hoje':up[0]===1?'Teste amanhã':`Teste daqui a ${up[0]} dias`;
 return L.length===1?'1 teste para treinar':`${L.length} testes para treinar`}

let lastAct=0;
function tick(){const now=Date.now();if(view.name==='quiz'&&lastAct&&cur){const d=Math.min((now-lastAct)/1000,120);S.time[cur]=(S.time[cur]||0)+d;
 const day=new Date().toISOString().slice(0,10);if(!S.tday||S.tday.d!==day)S.tday={d:day};S.tday[cur]=(S.tday[cur]||0)+d}lastAct=now}
function fmtT(s){s=Math.round(s/60);if(s<1)return 'menos de 1 min';const h=Math.floor(s/60),m=s%60;return h?`${h} h ${m} min`:`${m} min`}
function recAdd(k,good){const r=S.rec[k]=S.rec[k]||[];r.push(good?1:0);if(r.length>20)r.shift()}
function prep(){const ks=T_().keys;let tot=0,weak=null,ws=2;ks.forEach(k=>{const cv=cover(k).p/100;const r=S.rec[k]||[];const acc=r.length?r.reduce((a,b)=>a+b,0)/r.length:0;const conf=Math.min(r.length/10,1);const sc=0.4*cv+0.6*acc*conf;tot+=sc;if(sc<ws){ws=sc;weak=TOPICS[k].n}});return {p:Math.round(tot/ks.length*100),weak}}
function stats(t){const h=S.history.filter(x=>x.t===t);if(!h.length)return null;const p=h.map(x=>Math.round(x.c/x.n*100));return {n:h.length,last:p[p.length-1],best:Math.max(...p),avg:Math.round(p.reduce((a,b)=>a+b,0)/p.length),prev:p.length>1?p[p.length-2]:null}}

function go(n){view={name:n};render();window.scrollTo(0,0)}
function openSubj(k){subjCur=k;const L=Object.keys(TESTS).filter(t=>TESTS[t].subj===k);if(L.length===1){cur=L[0];go('test')}else go('subj')}
function openTest(t){cur=t;go('test')}
function setSize(n){S.size=n;save();render()}
function start(t){const ids=build(t);if(!ids.length)return;quiz={t,ids,i:0,ok:0,answered:null,opts:null,wrongs:[]};view={name:'quiz'};lastAct=Date.now();render();window.scrollTo(0,0)}
function answer(j){if(!quiz||quiz.answered!==null)return;const id=quiz.ids[quiz.i],q=QS[id],choice=quiz.opts[j],good=choice===q[3];
 tick();recAdd(q[0],good);quiz.answered=j;S.seen[id]=1;const k=q[0]+':'+q[1];const st=S.sub[k]||[0,0];st[1]++;if(good)st[0]++;S.sub[k]=st;
 if(good){quiz.ok++;if(quiz.t===ERR())S.wrong=S.wrong.filter(x=>x!==id)}else{quiz.wrongs.push(id);if(!S.wrong.includes(id))S.wrong.push(id)}
 save();render();setTimeout(()=>{const f=$('#fb');if(f)f.scrollIntoView({behavior:'smooth',block:'nearest'})},40)}
function next(){if(!quiz||quiz.answered===null)return;tick();quiz.i++;quiz.answered=null;quiz.opts=null;
 if(quiz.i>=quiz.ids.length){S.history.push({d:Date.now(),t:quiz.t,c:quiz.ok,n:quiz.ids.length});if(S.history.length>500)S.history=S.history.slice(-500);save();view={name:'result'}}
 render();window.scrollTo(0,0)}
function toggleSave(){const id=quiz.ids[quiz.i];const k=S.saved.indexOf(id);if(k>=0)S.saved.splice(k,1);else S.saved.push(id);save();render()}
function resetTest(){if(!confirmReset){confirmReset=true;render();return}
 const ids=new Set(QS.map((q,i)=>inCur(i)?i:-1).filter(i=>i>=0));
 T_().keys.forEach(k=>{delete S.rec[k];Object.keys(S.sub).forEach(s=>{if(s.startsWith(k+':'))delete S.sub[s]})});
 ids.forEach(i=>delete S.seen[i]);S.wrong=S.wrong.filter(i=>!ids.has(i));S.saved=S.saved.filter(i=>!ids.has(i));
 S.history=S.history.filter(x=>!(T_().keys.includes(x.t)||[ALL(),ERR(),SAV()].includes(x.t)||(x.t.startsWith('sub:')&&T_().keys.includes(x.t.slice(4).split(':')[0]))));
 delete S.time[cur];confirmReset=false;save();go('test')}

document.addEventListener('keydown',e=>{if(view.name!=='quiz'||!quiz)return;

function subj(){const s=SUBJ.find(x=>x.k===subjCur);const L=Object.keys(TESTS).filter(t=>TESTS[t].subj===subjCur);
 return `${header("go('home')",s.n)}<div class="list">${L.map(t=>{const T=TESTS[t];return `<button class="testcard" style="background:${s.c};color:#fff" onclick="openTest('${t}')"><span class="k">${T.when?fmtDate(T.when):'Data por definir'}</span><span class="t">${T.title} · ${T.name}</span></button>`}).join('')}</div>`}

function test(){const T=T_(),s=SUBJ.find(x=>x.k===T.subj);
 const back=Object.keys(TESTS).filter(t=>TESTS[t].subj===T.subj).length>1?`subjCur='${T.subj}';go('subj')`:"go('home')";
 const tl=T.keys.map((k,i)=>{const P=TOPICS[k],st=stats(k),cv=cover(k);
  return `<button class="topic" style="--c:${P.c}" onclick="start('${k}')"><div><div class="n">${i+1}. ${P.n}</div><div class="s">${P.s}</div>
  <div class="cov"><div class="bar"><i style="width:${cv.p}%"></i></div><span>${cv.s}/${cv.n} vistas</span></div></div>
  <span class="best">${st?`<b>${st.best}%</b><br>melhor`:'—'}</span></button>`}).join('');
 const tot=T.keys.reduce((a,k)=>{const c=cover(k);return [a[0]+c.s,a[1]+c.n]},[0,0]);const tp=tot[1]?Math.round(tot[0]/tot[1]*100):0;
 const sa=stats(ALL()),nw=S.wrong.filter(inCur).length,ns=S.saved.filter(inCur).length,P=prep();
 const tm=S.time[cur]||0,td=(S.tday&&S.tday.d===new Date().toISOString().slice(0,10))?(S.tday[cur]||0):0;
 const rounds=S.history.filter(x=>T.keys.includes(x.t)||[ALL(),ERR(),SAV()].includes(x.t)||(x.t.startsWith('sub:')&&T.keys.includes(x.t.slice(4).split(':')[0]))).length;
 return `${header(back,s.n+' · '+T.title)}
 <div class="testcard" style="background:${s.c};color:#fff"><span class="k">${T.when?'Teste a '+fmtDate(T.when):'Data do teste por definir'}</span><span class="t">${T.name}</span><span class="small" style="opacity:.85">${QS.filter((q,i)=>inCur(i)).length} perguntas · rondas de 10, 20 ou 30</span></div>
 ${cdBox(T)}
 <div class="card prep"><div class="row"><h3>Preparação estimada</h3><span class="pp">${P.p}%</span></div><div class="bar"><i style="width:${P.p}%"></i></div>
 <p class="muted small">${P.p===0?'Faz uma ronda para começar a medir.':`Conta as perguntas já vistas e os acertos recentes em cada matéria.${P.p<85&&P.weak?` Mais fraco: <b>${esc(P.weak)}</b>.`:''}`}</p>
 <p class="small">Tempo de estudo: <b>${fmtT(tm)}</b>${td?` · hoje ${fmtT(td)}`:''} · ${tot[0]}/${tot[1]} perguntas vistas (${tp}%)</p></div>
 <div class="row"><span class="muted small">Perguntas por ronda</span><div class="seg">${[10,20,30].map(n=>`<button class="${size()===n?'on':''}" onclick="setSize(${n})">${n}</button>`).join('')}</div></div>
 <div class="list">
 <button class="topic" style="--c:var(--accent)" onclick="start('${ALL()}')"><div><div class="n">Mistura tudo</div><div class="s">Um pouco de cada matéria, como no teste</div></div><span class="best">${sa?`<b>${sa.best}%</b><br>melhor`:'—'}</span></button>
 ${tl}</div>
 <div class="pill2"><button onclick="start('${ERR()}')" ${nw?'':'disabled'}>Os meus erros<span>${nw} para rever</span></button>
 <button onclick="start('${SAV()}')" ${ns?'':'disabled'}>Guardadas<span>${ns} para rever</span></button></div>
 <button class="ghost" onclick="go('prog')">Evolução <span class="muted">· ${rounds} rondas feitas</span></button>
 <p class="muted small" style="text-align:center">A app mostra primeiro as perguntas que ainda não viste.</p>
 <button class="muted small" style="text-align:center;padding:6px" onclick="resetTest()">${confirmReset?'<b style="color:var(--bad)">Toca outra vez para apagar o progresso deste teste</b>':'Recomeçar este teste do zero'}</button>`}

function qview(){const id=quiz.ids[quiz.i],q=QS[id],P=TOPICS[q[0]];
 if(!quiz.opts)quiz.opts=shuffle([q[3],...q[4]]);
 const n=quiz.ids.length,done=quiz.answered!==null,good=done&&quiz.opts[quiz.answered]===q[3],sv=S.saved.includes(id);
 const opts=quiz.opts.map((o,j)=>{let c='';if(done){if(o===q[3])c='right';else if(j===quiz.answered)c='wrong'}
  return `<button class="opt ${c}" ${done?'disabled':''} onclick="answer(${j})"><span class="l">${'ABCD'[j]}</span><span>${esc(o)}</span></button>`}).join('');
 const fb=done?`<div class="fb ${good?'ok':'no'}" id="fb"><h3>${good?'Certo':'Errado'}</h3>${good?'':`<p>Resposta certa: <b>${esc(q[3])}</b></p>`}<p>${esc(q[5])}</p></div>
  <button class="big" onclick="next()">${quiz.i+1<n?'Seguinte':'Ver resultado'}</button>`:'';
 return `<div class="qtop"><button class="back" aria-label="Sair" onclick="go('test')">×</button><div class="prog"><i style="width:${(quiz.i+(done?1:0))/n*100}%"></i></div><span class="count">${quiz.i+1}/${n}</span>
 <button class="bm ${sv?'on':''}" aria-label="${sv?'Remover das guardadas':'Guardar pergunta'}" onclick="toggleSave()"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 3h12v18l-6-4-6 4z" fill="${sv?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button></div>
 <div class="card"><span class="qchip">${esc(P.n)}</span><div class="qtext">${esc(q[2])}</div><div class="opts">${opts}</div></div>${fb}
 <p class="keys">Teclado: 1–4 para responder · Enter para avançar</p>`}

function result(){const n=quiz.ids.length,p=Math.round(quiz.ok/n*100);
 const errs=quiz.wrongs.map(i=>QS[i]);
 return `<div class="card" style="align-items:center;text-align:center"><span class="muted small">${esc(tname(quiz.t))}</span><div class="score">${quiz.ok}/${n}</div><p class="muted">${p}% de respostas certas</p></div>
 ${errs.length?`<div class="card"><h3>Para rever (${errs.length})</h3>${errs.map(q=>`<div class="err"><span>${esc(q[2])}</span><span class="a">${esc(q[3])}</span></div>`).join('')}</div>`:''}
 <button class="big" onclick="start('${quiz.t}')">Nova ronda</button>
 ${S.wrong.filter(inCur).length?`<button class="ghost" onclick="start('${ERR()}')">Rever os meus erros (${S.wrong.filter(inCur).length})</button>`:''}
 <button class="ghost" onclick="go('test')">Voltar às matérias</button>`}

function prog(){const T=T_();const TK=[...T.keys,ALL(),ERR(),SAV()];
 const H=S.history.filter(x=>TK.includes(x.t)||(x.t.startsWith('sub:')&&T.keys.includes(x.t.slice(4).split(':')[0])));
 if(!H.length)return `${header("go('test')",'Evolução')}<div class="card empty">Ainda não há rondas feitas neste teste.</div>`;
 const pcts=H.map(x=>Math.round(x.c/x.n*100)),avg=Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length);
 const last=H.slice(-15),W=320,Hh=150,pl=32,pr=10,pt=10,pb=22;
 const xs=i=>pl+(last.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(last.length-1)),ys=v=>pt+(100-v)/100*(Hh-pt-pb);
 const pts=last.map((x,i)=>[xs(i),ys(Math.round(x.c/x.n*100))]);
 const css=getComputedStyle(document.documentElement),ac=css.getPropertyValue('--accent').trim(),ln=css.getPropertyValue('--line').trim(),mu=css.getPropertyValue('--muted').trim();
 const grid=[0,50,100].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${ys(v)}" y2="${ys(v)}" stroke="${ln}"/><text x="${pl-6}" y="${ys(v)+4}" font-size="10" text-anchor="end" fill="${mu}">${v}%</text>`).join('');
 const chart=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Percentagem de acertos nas últimas rondas">${grid}<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${ac}" stroke-width="2"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:3}" fill="${ac}"/>`).join('')}<text x="${pl}" y="${Hh-5}" font-size="10" fill="${mu}">mais antiga</text><text x="${W-pr}" y="${Hh-5}" font-size="10" text-anchor="end" fill="${mu}">última</text></svg>`;
 const rows=T.keys.map(k=>{const P=TOPICS[k];let ok=0,n=0;for(const [kk,v] of Object.entries(S.sub))if(kk.startsWith(k+':')){ok+=v[0];n+=v[1]}
  if(!n)return `<div class="trow" style="--c:${P.c}"><span class="nm">${P.n}</span><span class="v">sem respostas</span><div class="bar"><i style="width:0"></i></div></div>`;
  const p=Math.round(ok/n*100),st=stats(k);const tr=st&&st.prev!==null?(st.last>st.prev?' · a subir':st.last<st.prev?' · a descer':''):'';
  return `<div class="trow" style="--c:${P.c}"><span class="nm">${P.n}</span><span class="v">${p}% (${n})${tr}</span><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('');
 const weak=Object.entries(S.sub).filter(([k,v])=>v[1]>=3&&SUBN[k]&&T.keys.includes(k.split(':')[0])).map(([k,v])=>[k,Math.round(v[0]/v[1]*100)]).filter(x=>x[1]<80).sort((a,b)=>a[1]-b[1]).slice(0,5);
 const f5=pcts.slice(0,5),l5=pcts.slice(-5),evo=pcts.length>=6?Math.round(l5.reduce((a,b)=>a+b,0)/l5.length-f5.reduce((a,b)=>a+b,0)/f5.length):null;
 return `${header("go('test')",'Evolução')}
 <div class="card"><div class="kpis"><div class="kpi"><b>${H.length}</b><span>rondas</span></div><div class="kpi"><b>${avg}%</b><span>média</span></div><div class="kpi"><b>${fmtT(S.time[cur]||0).replace('menos de 1 min','<1 min')}</b><span>estudo</span></div></div>
 <p class="small muted">${evo!==null?`Últimas 5 rondas vs. primeiras 5: <b style="color:var(--ink)">${evo>0?'+':''}${evo} pontos percentuais</b>.`:'Com 6 ou mais rondas aparece a comparação entre as primeiras e as últimas.'}</p></div>
 <div class="card chart"><h3>Acertos nas últimas ${last.length} rondas</h3>${chart}</div>
 <div class="card"><h3>Por matéria</h3>${rows}</div>
 <div class="card"><h3>Pontos fracos</h3>${weak.length?`<p class="muted small">Abaixo de 80% (com pelo menos 3 respostas). Toca para treinar só isso.</p>${weak.map(([k,p])=>`<button class="wk" onclick="start('sub:${k}')"><span>${esc(SUBN[k])}</span><span>${p}% · treinar</span></button>`).join('')}`:'<p class="muted small">Nada abaixo de 80% (com pelo menos 3 respostas).</p>'}</div>`}

render();
</script>
</body>
</html>
